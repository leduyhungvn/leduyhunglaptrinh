<!DOCTYPE html>

            display: inline-flex;

<script>
    (function(){
        // ---------- DỮ LIỆU MẪU: UNIT 1 BÀI 1 (ĐÃ HỢP NHẤT P5) ----------
        const E6_U1_B1 = {
            P1: [ // trắc nghiệm trả lời câu hỏi
                { id: 1, word: "Where does Miss Lien live?", correct: "in a small house in Hanoi", wrong1: "in a big apartment", wrong2: "in the countryside" },
                { id: 2, word: "What does Miss Lien do?", correct: "She teaches English", wrong1: "She is a doctor", wrong2: "She works in a factory" },
                { id: 3, word: "What time does she have breakfast?", correct: "at seven", wrong1: "at six", wrong2: "at eight" },
                { id: 4, word: "Where does she have lunch?", correct: "in the canteen of the school", wrong1: "at home", wrong2: "in a restaurant" },
                { id: 5, word: "When does she teach dialogues?", correct: "on Wednesdays and Fridays", wrong1: "on Mondays", wrong2: "every day" },

                { id: 7, word: "What does she do in the evening?", correct: "stays at home and listens to music", wrong1: "goes out with friends", wrong2: "watches TV" },
                { id: 8, word: "Does she sometimes go to the movie theatre?", correct: "Yes, she does", wrong1: "No, she never goes", wrong2: "Only on Sundays" },
                { id: 9, word: "What time does she go to bed?", correct: "at ten o'clock", wrong1: "at nine o'clock", wrong2: "at eleven" },
                { id: 10, word: "Who is Miss Lien?", correct: "an English teacher", wrong1: "a student", wrong2: "a nurse" }
            ],
            P2: [ // TRUE - FALSE - NOT GIVEN
                { id: 1, word: "Miss Lien lives in a small house in Hanoi.", correct: "True", wrong1: "False", wrong2: "Not Given" },
                { id: 2, word: "She teaches Math at a school.", correct: "False", wrong1: "True", wrong2: "Not Given" },
                { id: 3, word: "She has lunch at home.", correct: "False", wrong1: "True", wrong2: "Not Given" },
                { id: 4, word: "She teaches dialogues on Wednesdays and Fridays.", correct: "True", wrong1: "False", wrong2: "Not Given" },
                { id: 5, word: "She teaches grammar on Tuesdays.", correct: "False", wrong1: "True", wrong2: "Not Given" },
                { id: 6, word: "In the evening she usually stays at home.", correct: "True", wrong1: "False", wrong2: "Not Given" },
                { id: 7, word: "She sometimes goes to the cinema.", correct: "True", wrong1: "False", wrong2: "Not Given" },
                { id: 8, word: "She has a pet dog.", correct: "Not Given", wrong1: "True", wrong2: "False" },
                { id: 9, word: "She always goes to bed at ten.", correct: "True", wrong1: "False", wrong2: "Not Given" },
                { id: 10, word: "Her school is in Hanoi.", correct: "True", wrong1: "False", wrong2: "Not Given" }
            ],
            P3: [ // Điền khuyết
                { id: 1, word: "Miss Lien lives in a small house ______ Hanoi.", correct: "in", wrong1: "on", wrong2: "at" },
                { id: 2, word: "She teaches English ______ a school there.", correct: "at", wrong1: "in", wrong2: "on" },
                { id: 3, word: "She usually has breakfast ______ seven.", correct: "at", wrong1: "in", wrong2: "on" },
                { id: 4, word: "She has lunch in the canteen ______ the school.", correct: "of", wrong1: "at", wrong2: "in" },
                { id: 5, word: "She teaches her students ______ the morning.", correct: "in", wrong1: "on", wrong2: "at" },
                { id: 6, word: "She teaches them dialogues ______ Wednesdays.", correct: "on", wrong1: "in", wrong2: "at" },
                { id: 7, word: "______ Mondays, she teaches grammar.", correct: "On", wrong1: "In", wrong2: "At" },
                { id: 8, word: "In the evening, she usually stays ______ home.", correct: "at", wrong1: "in", wrong2: "on" },
                { id: 9, word: "She sometimes goes ______ the movie theatre.", correct: "to", wrong1: "in", wrong2: "at" },
                { id: 10, word: "She always goes to bed ______ ten o'clock.", correct: "at", wrong1: "in", wrong2: "on" }
            ],
            P4: "Miss Lien lives in a small house in Hanoi. She teaches English at a school there. She usually has breakfast at seven in the morning and she has lunch at twelve o'clock in the canteen of the school. She teaches her students in the morning. She teaches them dialogues on Wednesdays and Fridays. On Mondays, she teaches them grammar. In the evening, she usually stays at home and listens to music. She sometimes goes to the movie theatre. She always goes to bed at ten o'clock.",
            // Hợp nhất P5: chứa tất cả câu cho audio
            P5: [
                "Miss Lien lives in a small house in Hanoi.",
                "She teaches English at a school there.",
                "She usually has breakfast at seven in the morning and she has lunch at twelve o'clock in the canteen of the school.",
                "She teaches her students in the morning.",
                "She teaches them dialogues on Wednesdays and Fridays.",
                "On Mondays, she teaches them grammar.",
                "In the evening, she usually stays at home and listens to music.",
                "She sometimes goes to the movie theatre.",
                "She always goes to bed at ten o'clock."
            ]
        };

        // Biến mẫu cho UNIT 2 BÀI 1 (chưa có nội dung)
        const E6_U2_B1 = {
            P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: []
        };

        // Danh sách UNIT, BÀI, DẠNG
        const UNIT_ITEMS = ['UNIT 1','UNIT 2','UNIT 3','UNIT 4','UNIT 5','UNIT 6','UNIT 7','UNIT 8','UNIT 9','UNIT 10','UNIT 11','UNIT 12'];
        const BAI_ITEMS = ['BÀI 1','BÀI 2','BÀI 3','BÀI 4','BÀI 5','BÀI 6','BÀI 7','BÀI 8','BÀI 9','BÀI 10','BÀI 11','BÀI 12','BÀI 13','BÀI 14','BÀI 15','BÀI 16','BÀI 17','BÀI 18','BÀI 19','BÀI 20','KIỂM TRA NGẪU NHIÊN'];
        const DANG_BAI = ['TRẮC NGHIỆM TRẢ LỜI CÂU HỎI','TRẮC NGHIỆM TRUE – FALSE – NOT GIVEN','TRẮC NGHIỆM ĐIỀN KHUYẾT'];

        // ---- state toàn cục ----
        let currentScreen = 'main'; // main, quiz, report
        let studentName = '';
        let selectedUnit = 'UNIT 1';
        let selectedBai = 'BÀI 1';
        let selectedDang = DANG_BAI[0];
        let quizData = null;         // 5 câu hỏi hiện tại { id, question, options, correct }
        let userAnswers = [];         // mảng { chosen }
        let startTime = null;
        let endTime = null;
        
        // Audio state & settings (giống tool)
        let voiceList = [];
        let voiceMode = 1;            // 1: 1 giọng, 2: 2 giọng (lẻ/chẵn)
        let singleVoice = null;
        let oddVoice = null;
        let evenVoice = null;
        let isPaused = false;
        let audioQueue = [];
        let audioTimeout = null;
        let audioEnabled = false;      // dùng để bắt đầu tính giờ khi nhấn loa lần đầu

        const app = document.getElementById('app');

        // ---------- HÀM PHÁT ÂM (hỗ trợ 1 hoặc 2 giọng) ----------
        function stopAllAudio() {
            speechSynthesis.cancel();
            if (audioTimeout) {
                clearTimeout(audioTimeout);
                audioTimeout = null;
            }
            audioQueue = [];
            isPaused = false;
        }

        function pauseAudio() {
            if (speechSynthesis.speaking) {
                speechSynthesis.pause();
                isPaused = true;
            }
            if (audioTimeout) {
                clearTimeout(audioTimeout);
                audioTimeout = null;
            }
        }

        function resumeAudio() {
            if (isPaused && speechSynthesis.paused) {
                speechSynthesis.resume();
                isPaused = false;
                return;
            }
        }

        // Lấy giọng phù hợp dựa vào index (0-based) cho 2 giọng
        function getVoiceForIndex(index) {
            if (voiceMode === 1) return singleVoice;
            // index chẵn (0,2,4...) là câu lẻ (1,3,5) -> oddVoice, index lẻ -> evenVoice
            return (index % 2 === 0) ? oddVoice : evenVoice;
        }

        // sentences: mảng các câu (string), gapSec, loop: số lần lặp mỗi câu
        function playAudioSentences(sentences, gapSec, loop) {
            stopAllAudio();
            if (!sentences || sentences.length === 0) return;

            // Tạo hàng chờ: mỗi câu được lặp lại 'loop' lần
            sentences.forEach((s, idx) => {
                for (let i = 0; i < loop; i++) {
                    audioQueue.push({ text: s, originalIndex: idx });
                }
            });

            let index = 0;
            const playNext = () => {
                if (index >= audioQueue.length) {
                    stopAllAudio();
                    return;
                }
                const item = audioQueue[index];
                const utterance = new SpeechSynthesisUtterance(item.text);
                utterance.lang = 'en-GB';
                
                // Gán giọng theo chỉ số câu gốc (originalIndex)
                const voice = getVoiceForIndex(item.originalIndex);
                if (voice) utterance.voice = voice;

                utterance.onend = () => {
                    index++;
                    if (index < audioQueue.length && !isPaused) {
                        audioTimeout = setTimeout(playNext, gapSec * 1000);
                    } else if (index >= audioQueue.length) {
                        stopAllAudio();
                    }
                };
                utterance.onerror = () => {
                    index++;
                    if (index < audioQueue.length && !isPaused) {
                        audioTimeout = setTimeout(playNext, gapSec * 1000);
                    }
                };
                speechSynthesis.speak(utterance);
            };
            playNext();
        }

        // Đọc một câu đơn (cho nút loa cạnh mỗi câu hỏi)
        function speakSingleText(text, originalIndex) {
            if (!text || text.trim() === '') return;
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            const voice = getVoiceForIndex(originalIndex);
            if (voice) utterance.voice = voice;
            speechSynthesis.speak(utterance);
        }

        // Populate voice dropdowns và ưu tiên chọn giọng "David" (không phân biệt hoa thường)
        function populateVoiceList() {
            if (!('speechSynthesis' in window)) return;
            const voices = speechSynthesis.getVoices();
            voiceList = voices;

            // Tìm giọng David (ưu tiên giọng UK hoặc US có tên chứa "David")
            const davidVoice = voiceList.find(v => 
                v.name.toLowerCase().includes('david') && 
                (v.lang.includes('en-GB') || v.lang.includes('en-US'))
            );

            // Cập nhật các dropdown hiện có trong DOM
            updateVoiceDropdowns(davidVoice);
        }

        function updateVoiceDropdowns(preferredVoice = null) {
            // Cập nhật các dropdown hiện có trong DOM
            const singleSelect = document.getElementById('voiceSelect');
            const oddSelect = document.getElementById('oddVoiceSelect');
            const evenSelect = document.getElementById('evenVoiceSelect');
            if (!singleSelect || !oddSelect || !evenSelect) return;

            const fillSelect = (select) => {
                select.innerHTML = ''; // Xóa hết option cũ
                // Thêm option trống
                const emptyOpt = document.createElement('option');
                emptyOpt.value = '';
                emptyOpt.textContent = '-- Chọn giọng --';
                select.appendChild(emptyOpt);

                voiceList.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.voiceURI;
                    opt.textContent = `${v.name} (${v.lang})${v.default ? ' [Mặc định]' : ''}`;
                    // Nếu có giọng ưu tiên (David) và khớp thì chọn
                    if (preferredVoice && v.voiceURI === preferredVoice.voiceURI) {
                        opt.selected = true;
                    }
                    select.appendChild(opt);
                });
            };
            fillSelect(singleSelect);
            fillSelect(oddSelect);
            fillSelect(evenSelect);

            // Gán lại biến voice
            singleVoice = singleSelect.value ? voiceList.find(v => v.voiceURI === singleSelect.value) : null;
            oddVoice = oddSelect.value ? voiceList.find(v => v.voiceURI === oddSelect.value) : null;
            evenVoice = evenSelect.value ? voiceList.find(v => v.voiceURI === evenSelect.value) : null;
        }

        if ('speechSynthesis' in window) {
            speechSynthesis.onvoiceschanged = populateVoiceList;
            // Gọi ngay lập tức nếu voices đã có sẵn
            if (speechSynthesis.getVoices().length > 0) {
                populateVoiceList();
            }
        }

        // ---------- RENDER CORE ----------
        function render() {
            if (currentScreen === 'main') renderMain();
            else if (currentScreen === 'quiz') renderQuiz();
            else if (currentScreen === 'report') renderReport();
        }

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        // ---------- MAIN ----------
        function renderMain() {
            let html = `
                <div class="main-card">
                    <h1>🔊 LUYỆN NGHE TIẾNG ANH LỚP 6</h1>
                    <div class="flex-col">
                        <div class="label-input"><label>👤 TÊN</label><input type="text" id="studentNameInput" value="${studentName}"></div>
                        <div class="label-input"><label>📚 UNIT</label><select id="unitSelect">${UNIT_ITEMS.map(u => `<option ${selectedUnit===u?'selected':''}>${u}</option>`).join('')}</select></div>
                        <div class="label-input"><label>📖 BÀI</label><select id="baiSelect">${BAI_ITEMS.map(b => `<option ${selectedBai===b?'selected':''}>${b}</option>`).join('')}</select></div>
                        <div class="label-input"><label>🎯 DẠNG</label><select id="dangSelect">${DANG_BAI.map(d => `<option ${selectedDang===d?'selected':''}>${d}</option>`).join('')}</select></div>
                        <div class="btn-group"><button class="btn primary" id="startBtn">▶ LÀM BÀI</button></div>
                    </div>
                    <div class="footer-info"><p>👨‍🏫 Thầy Hùng</p><p>Giáo viên dạy kèm Toán, tiếng Anh</p><p class="zalo">📞 Zalo: 0967.095.025</p></div>
                    <div class="action-buttons-container"><div></div><a href="#" class="scroll-top" id="scrollTopMain">⬆️</a></div>
                </div>`;
            app.innerHTML = html;
            document.getElementById('studentNameInput').addEventListener('input', e => studentName = e.target.value);
            document.getElementById('unitSelect').addEventListener('change', e => selectedUnit = e.target.value);
            document.getElementById('baiSelect').addEventListener('change', e => selectedBai = e.target.value);
            document.getElementById('dangSelect').addEventListener('change', e => selectedDang = e.target.value);
            document.getElementById('startBtn').addEventListener('click', () => {
                if (!studentName.trim()) { alert('Vui lòng nhập tên'); return; }
                if (!prepareQuizData()) { alert('Bài học chưa có nội dung.'); return; }
                currentScreen = 'quiz';
                startTime = Date.now();
                endTime = null;
                userAnswers = [];
                audioEnabled = false;
                render();
                scrollToTop();
            });
            document.getElementById('scrollTopMain').addEventListener('click', (e)=>{ e.preventDefault(); scrollToTop(); });
        }

        function prepareQuizData() {
            const unitKey = selectedUnit.replace('UNIT ','U');
            let baiKey = selectedBai.replace('BÀI ','B');
            if (selectedBai === 'KIỂM TRA NGẪU NHIÊN') {
                const r = Math.floor(Math.random() * 12) + 1;
                baiKey = `B${r}`;
            }
            const dataKey = `E6_${unitKey}_${baiKey}`;
            let rawData = window[dataKey];
            if (!rawData) {
                alert(`Chưa có nội dung cho ${dataKey}, dùng bài mẫu U1_B1.`);
                rawData = E6_U1_B1;
            }
            let questionPool = [];
            if (selectedDang.includes('TRẮC NGHIỆM TRẢ LỜI CÂU HỎI')) questionPool = rawData.P1 || [];
            else if (selectedDang.includes('TRUE – FALSE')) questionPool = rawData.P2 || [];
            else if (selectedDang.includes('ĐIỀN KHUYẾT')) questionPool = rawData.P3 || [];

            if (!questionPool.length) { alert('Dạng bài này chưa có câu hỏi.'); return false; }

            const shuffled = [...questionPool].sort(()=>0.5-Math.random()).slice(0,5);
            quizData = shuffled.map(q => {
                let opts = [q.correct, q.wrong1, q.wrong2];
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return {
                    id: q.id,
                    question: q.word,
                    options: opts,
                    correct: q.correct
                };
            });
            return true;
        }

        // ---------- QUIZ SCREEN ----------
        function renderQuiz() {
            let titleBai = selectedBai === 'KIỂM TRA NGẪU NHIÊN' ? 'KIỂM TRA' : selectedBai;
            let html = `
                <div class="main-card">
                    <h2>📘 LỚP 6 - ${selectedUnit} - ${titleBai}</h2>
                    <div class="title-sub">${selectedDang}</div>
                    
                    <!-- AUDIO PANEL cải tiến với chọn giọng -->
                    <div class="audio-panel" id="audioPanel">
                        <span class="speaker-icon" id="playSpeaker">🔊</span>
                        <select id="gapTimeSelect">
                            <option value="0.5">0.5s</option><option value="1" selected>1s</option><option value="2">2s</option><option value="3">3s</option><option value="4">4s</option><option value="5">5s</option><option value="6">6s</option>
                        </select>
                        <select id="loopCountSelect">
                            <option value="1" selected>1 lần</option>
                            <option value="2">2 lần</option>
                            <option value="3">3 lần</option>
                            <option value="4">4 lần</option>
                        </select>
                        <button id="pauseAudioBtn">⏸️</button>
                        <button id="stopAudioBtn">⏹️</button>
                    </div>
                    <!-- Tùy chọn giọng đọc -->
                    <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; align-items: center; background: #e0ebf9; padding: 12px 20px; border-radius: 40px;">
                        <label style="font-weight:600;">Số giọng:
                            <select id="voiceModeSelect" style="padding:6px 12px; border-radius:40px;">
                                <option value="1" selected>1 giọng</option>
                                <option value="2">2 giọng (lẻ/chẵn)</option>
                            </select>
                        </label>
                        <div id="singleVoiceContainer" style="display: flex; align-items:center; gap: 10px;">
                            <label>Giọng: <select id="voiceSelect" style="min-width:180px; padding:6px;"></select></label>
                        </div>
                        <div id="dualVoiceContainer" style="display: none; align-items:center; gap: 10px; flex-wrap:wrap;">
                            <label>Giọng lẻ (1,3...): <select id="oddVoiceSelect" style="min-width:160px;"></select></label>
                            <label>Giọng chẵn (2,4...): <select id="evenVoiceSelect" style="min-width:160px;"></select></label>
                        </div>
                    </div>

                    <div id="quizQuestions"></div>
                    <div class="btn-group"><button class="btn primary" id="submitQuizBtn">📩 NỘP BÀI</button></div>
                    
                    <div class="action-buttons-container">
                        <button class="btn-back" id="backToMainBtn">◀ QUAY LẠI</button>
                        <a href="#" class="scroll-top" id="scrollTopQuiz">⬆️</a>
                    </div>
                </div>`;
            app.innerHTML = html;

            // Render câu hỏi
            let qDiv = document.getElementById('quizQuestions');
            quizData.forEach((q, idx) => {
                let qHtml = `<div class="question-item" data-qidx="${idx}">
                    <div class="question-text">
                        <span class="speaker-btn" data-text="${q.question.replace(/"/g, '&quot;')}" data-index="${idx}">🔊</span>
                        ${idx+1}. ${q.question}
                    </div>
                    <div class="options">`;
                q.options.forEach((opt, optIdx) => {
                    let checked = (userAnswers[idx] && userAnswers[idx].chosen === opt) ? 'checked' : '';
                    qHtml += `<label class="option ${checked ? 'selected' : ''}"><input type="radio" name="q${idx}" value="${opt}" ${checked}> ${opt}</label>`;
                });
                qHtml += '</div></div>';
                qDiv.innerHTML += qHtml;
            });

            // Radio change
            document.querySelectorAll('.question-item input[type=radio]').forEach(radio => {
                radio.addEventListener('change', function(e) {
                    let name = this.name;
                    let qIndex = parseInt(name.substring(1));
                    let chosen = this.value;
                    if (!userAnswers[qIndex]) userAnswers[qIndex] = {};
                    userAnswers[qIndex].chosen = chosen;
                    document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                        r.closest('.option').classList.remove('selected');
                    });
                    this.closest('.option').classList.add('selected');
                });
            });

            // Speaker cho từng câu
            document.querySelectorAll('.speaker-btn[data-text]').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const text = btn.getAttribute('data-text');
                    const idx = parseInt(btn.getAttribute('data-index'));
                    speakSingleText(text, idx);
                });
            });

            // Voice dropdowns populate
            if (voiceList.length) {
                // Tìm giọng David để ưu tiên chọn
                const davidVoice = voiceList.find(v => 
                    v.name.toLowerCase().includes('david') && 
                    (v.lang.includes('en-GB') || v.lang.includes('en-US'))
                );
                updateVoiceDropdowns(davidVoice);
            } else {
                populateVoiceList();
            }

            // Sự kiện chọn giọng
            document.getElementById('voiceModeSelect').addEventListener('change', function(e) {
                voiceMode = parseInt(e.target.value);
                document.getElementById('singleVoiceContainer').style.display = voiceMode === 1 ? 'flex' : 'none';
                document.getElementById('dualVoiceContainer').style.display = voiceMode === 2 ? 'flex' : 'none';
            });
            document.getElementById('voiceSelect')?.addEventListener('change', e => {
                singleVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
            });
            document.getElementById('oddVoiceSelect')?.addEventListener('change', e => {
                oddVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
            });
            document.getElementById('evenVoiceSelect')?.addEventListener('change', e => {
                evenVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
            });

            // Audio controls
            document.getElementById('playSpeaker').addEventListener('click', ()=>{
                if (!audioEnabled) { startTime = Date.now(); audioEnabled = true; }
                let raw = window[`E6_${selectedUnit.replace('UNIT ','U')}_B1`] || E6_U1_B1;
                let sentences = raw.P5 || E6_U1_B1.P5;
                let gap = parseFloat(document.getElementById('gapTimeSelect').value);
                let loop = parseInt(document.getElementById('loopCountSelect').value);
                playAudioSentences(sentences, gap, loop);
            });
            document.getElementById('pauseAudioBtn').addEventListener('click', ()=>{
                if (isPaused) resumeAudio(); else pauseAudio();
            });
            document.getElementById('stopAudioBtn').addEventListener('click', stopAllAudio);
            document.getElementById('backToMainBtn').addEventListener('click', ()=>{ stopAllAudio(); currentScreen='main'; render(); scrollToTop(); });
            document.getElementById('scrollTopQuiz').addEventListener('click', e=>{ e.preventDefault(); scrollToTop(); });
            document.getElementById('submitQuizBtn').addEventListener('click', ()=>{
                if (userAnswers.filter(a=>a?.chosen).length !== 5) { alert('Vui lòng trả lời đủ 5 câu'); return; }
                endTime = Date.now();
                stopAllAudio();
                currentScreen = 'report';
                render();
                scrollToTop();
            });
        }

        // ---------- REPORT SCREEN ----------
        function renderReport() {
            let total = 5;
            let correctCount = userAnswers.filter((ans,i)=> ans?.chosen === quizData[i]?.correct).length;
            let percent = (correctCount/total)*100;
            let color = percent<50?'#f5222d':percent<70?'#faad14':percent<80?'#52c41a':percent<90?'#13c2c2':percent<100?'#1890ff':'#722ed1';
            let startStr = startTime ? new Date(startTime).toLocaleTimeString() : '';
            let endStr = endTime ? new Date(endTime).toLocaleTimeString() : '';
            let streak = 0, maxStreak=0;
            userAnswers.forEach((a,i)=> { if(a?.chosen===quizData[i]?.correct) streak++; else { maxStreak=Math.max(maxStreak,streak); streak=0; } });
            maxStreak=Math.max(maxStreak,streak);
            let totalTime = endTime && startTime ? Math.round((endTime-startTime)/1000) : 0;

            let titleBai = selectedBai === 'KIỂM TRA NGẪU NHIÊN' ? 'KIỂM TRA' : selectedBai;
            let raw = window[`E6_${selectedUnit.replace('UNIT ','U')}_B1`] || E6_U1_B1;
            let passageText = raw.P4 || E6_U1_B1.P4;
            let sentences = raw.P5 || E6_U1_B1.P5;

            let html = `
                <div class="main-card">
                    <h2>📊 BÁO CÁO LỚP 6 - ${selectedUnit} - ${titleBai}</h2>
                    <div class="title-sub">${selectedDang}</div>
                    
                    <div class="report-chart-grid">
                        <div class="chart-box">
                            <div style="font-weight:800; font-size:2.4rem; color:blue; margin-bottom:10px;">${studentName}</div>
                            <div class="pie" style="background: conic-gradient(${color} 0deg ${percent*3.6}deg, #e0e0e0 ${percent*3.6}deg 360deg);">
                                <span style="color: ${color};">${Math.round(percent)}%</span>
                            </div>
                            <div style="font-weight:bold; color:#1e3c72; margin-top:15px;">${new Date().toLocaleDateString()}</div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item"><div>⏱️ START</div><div>${startStr}</div></div>
                            <div class="stat-item"><div>⌛ END</div><div>${endStr}</div></div>
                            <div class="stat-item"><div>🔗 CHUỖI</div><div>${maxStreak}/${correctCount}/${total}</div></div>
                            <div class="stat-item"><div>⏳ Tổng</div><div>${totalTime}s</div></div>
                        </div>
                    </div>

                    <!-- Audio Panel Report (giống quiz) -->
                    <div class="audio-panel" id="audioPanelReport">
                        <span class="speaker-icon" id="playSpeakerReport">🔊</span>
                        <select id="gapTimeSelectReport"><option value="0.5">0.5s</option><option value="1" selected>1s</option><option value="2">2s</option><option value="3">3s</option><option value="4">4s</option><option value="5">5s</option><option value="6">6s</option></select>
                        <select id="loopCountSelectReport"><option value="1" selected>1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
                        <button id="pauseAudioBtnReport">⏸️</button><button id="stopAudioBtnReport">⏹️</button>
                    </div>
                    <!-- Chọn giọng trong report -->
                    <div style="display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0 20px; align-items: center; background: #e0ebf9; padding: 12px 20px; border-radius: 40px;">
                        <label style="font-weight:600;">Số giọng:
                            <select id="voiceModeSelectReport" style="padding:6px 12px;">
                                <option value="1" selected>1 giọng</option>
                                <option value="2">2 giọng</option>
                            </select>
                        </label>
                        <div id="singleVoiceContainerReport" style="display: flex; gap:10px;">
                            <label>Giọng: <select id="voiceSelectReport"></select></label>
                        </div>
                        <div id="dualVoiceContainerReport" style="display: none; gap:10px; flex-wrap:wrap;">
                            <label>Giọng lẻ: <select id="oddVoiceSelectReport"></select></label>
                            <label>Giọng chẵn: <select id="evenVoiceSelectReport"></select></label>
                        </div>
                    </div>

                    <button class="btn" id="togglePassageBtn">📄 HIỆN đoạn văn P4</button>
                    <div id="passageContainer" style="display:none;" class="hidden-passage">${passageText}</div>
                    
                    <h3>📋 Chi tiết câu hỏi</h3>
                    <table><tr><th>STT</th><th>Nội dung</th><th>Đáp án chọn</th><th>Đáp án đúng</th></tr>`;
            quizData.forEach((q,i)=>{
                let chosen = userAnswers[i]?.chosen || '—';
                let correct = q.correct;
                let wrongClass = (chosen !== correct) ? 'wrong-answer' : '';
                html += `<tr><td>${i+1}</td><td>${q.question}</td><td class="${wrongClass}">${chosen}</td><td><span class="correct-answer">${correct}</span></td></tr>`;
            });
            html += `</table><br>
                    <div class="action-buttons-container">
                        <button class="btn-back" id="backToMainBtnReport">◀ QUAY LẠI</button>
                        <a href="#" class="scroll-top" id="scrollTopReport">⬆️</a>
                    </div>
                </div>`;
            app.innerHTML = html;

            // Xử lý voice dropdowns trong report
            if (voiceList.length) {
                const davidVoice = voiceList.find(v => 
                    v.name.toLowerCase().includes('david') && 
                    (v.lang.includes('en-GB') || v.lang.includes('en-US'))
                );
                const singleSel = document.getElementById('voiceSelectReport');
                const oddSel = document.getElementById('oddVoiceSelectReport');
                const evenSel = document.getElementById('evenVoiceSelectReport');
                if (singleSel && oddSel && evenSel) {
                    const fill = (sel) => {
                        sel.innerHTML = '';
                        const emptyOpt = document.createElement('option');
                        emptyOpt.value = '';
                        emptyOpt.textContent = '-- Chọn giọng --';
                        sel.appendChild(emptyOpt);
                        voiceList.forEach(v => {
                            let opt = document.createElement('option');
                            opt.value = v.voiceURI;
                            opt.textContent = `${v.name} (${v.lang})`;
                            if (davidVoice && v.voiceURI === davidVoice.voiceURI) opt.selected = true;
                            sel.appendChild(opt);
                        });
                    };
                    fill(singleSel);
                    fill(oddSel);
                    fill(evenSel);
                }
            }

            // Sự kiện chuyển chế độ giọng report
            const modeSel = document.getElementById('voiceModeSelectReport');
            const singleDiv = document.getElementById('singleVoiceContainerReport');
            const dualDiv = document.getElementById('dualVoiceContainerReport');
            modeSel.addEventListener('change', e => {
                voiceMode = parseInt(e.target.value);
                singleDiv.style.display = voiceMode === 1 ? 'flex' : 'none';
                dualDiv.style.display = voiceMode === 2 ? 'flex' : 'none';
            });
            document.getElementById('voiceSelectReport')?.addEventListener('change', e => {
                singleVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
            });
            document.getElementById('oddVoiceSelectReport')?.addEventListener('change', e => {
                oddVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
            });
            document.getElementById('evenVoiceSelectReport')?.addEventListener('change', e => {
                evenVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
            });

            // Audio report
            document.getElementById('playSpeakerReport').addEventListener('click', ()=>{
                let gap = parseFloat(document.getElementById('gapTimeSelectReport').value);
                let loop = parseInt(document.getElementById('loopCountSelectReport').value);
                playAudioSentences(sentences, gap, loop);
            });
            document.getElementById('pauseAudioBtnReport').addEventListener('click', ()=>{
                if (isPaused) resumeAudio(); else pauseAudio();
            });
            document.getElementById('stopAudioBtnReport').addEventListener('click', stopAllAudio);
            document.getElementById('togglePassageBtn').addEventListener('click', ()=>{
                let c = document.getElementById('passageContainer');
                c.style.display = c.style.display === 'none' ? 'block' : 'none';
            });
            document.getElementById('backToMainBtnReport').addEventListener('click', ()=>{ stopAllAudio(); currentScreen='main'; render(); scrollToTop(); });
            document.getElementById('scrollTopReport').addEventListener('click', e=>{ e.preventDefault(); scrollToTop(); });
        }

        // Khởi tạo
        window.E6_U1_B1 = E6_U1_B1;
        window.E6_U2_B1 = E6_U2_B1;
        render();
    })();
</script>
</body>
</html>
