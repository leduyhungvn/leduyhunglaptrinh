<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Luyện nghe TA Lớp 4 (thêm dạng tổng hợp)</title>
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="en">
    <style>
        /* Toàn bộ style giữ nguyên như bản trước */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf5 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .app-container {
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }
        .main-card {
            width: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,20,40,0.3);
            border: 1px solid rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }
        @media (max-width: 700px) {
            body { padding: 10px; }
            .main-card { padding: 20px 16px; border-radius: 32px; }
        }
        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.02em;
            word-break: break-word;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            border-left: 8px solid #2a5298;
            padding-left: 20px;
        }
        @media (max-width: 700px) {
            h1 { font-size: 1.8rem; border-left-width: 6px; padding-left: 16px; }
        }
        h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #1e3c72;
        }
        .title-sub {
            font-size: 1.3rem;
            color: #2a5298;
            margin-bottom: 20px;
            font-weight: 500;
            padding-left: 4px;
        }
        @media (max-width: 700px) {
            h2 { font-size: 1.4rem; }
            .title-sub { font-size: 1.2rem; }
        }
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .label-input {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 10px 24px;
            border-radius: 60px;
            box-shadow: inset 2px 2px 8px #b8c3d0, inset -4px -4px 8px #ffffff;
            width: 100%;
        }
        .label-input label {
            font-weight: 600;
            color: #1e2f4d;
            font-size: 1rem;
            white-space: nowrap;
        }
        .label-input input, .label-input select {
            border: none;
            background: transparent;
            font-size: 1rem;
            padding: 8px 0;
            outline: none;
            font-weight: 500;
            width: 100%;
            min-width: 0;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 20px 0 10px;
            justify-content: center;
        }
        .btn {
            background: white;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 6px 6px 16px #b8c3d0, -6px -6px 16px #ffffff;
            cursor: pointer;
            transition: 0.15s;
            color: #1e2f4d;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
            justify-content: center;
        }
        .btn:active {
            box-shadow: inset 6px 6px 12px #b8c3d0, inset -6px -6px 12px #ffffff;
            transform: scale(0.97);
        }
        .btn.primary {
            background: #2a5298;
            color: white;
            box-shadow: 6px 6px 16px #1e3c72, -6px -6px 16px #3f6ab3;
        }
        @media (max-width: 700px) {
            .btn { padding: 12px 24px; font-size: 1.1rem; }
        }
        .footer-info {
            margin-top: 30px;
            background: #d9e2ef;
            border-radius: 40px;
            padding: 20px 30px;
            text-align: center;
            font-weight: 500;
            color: #102a4c;
            border: 1px solid #ffffff80;
        }
        .footer-info p {
            margin: 6px 0;
            font-size: 1rem;
        }
        .footer-info .zalo {
            font-size: 1.3rem;
            font-weight: 700;
            background: #0068ff20;
            display: inline-block;
            padding: 6px 32px;
            border-radius: 60px;
        }
        .audio-panel {
            background: #eef3fc;
            border-radius: 60px;
            padding: 16px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            margin: 20px 0 25px;
            box-shadow: inset 2px 2px 8px #b8c3d0, inset -4px -4px 10px white;
        }
        .audio-panel select, .audio-panel button {
            background: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 3px 3px 8px #b8c3d0;
            flex: 1 0 auto;
            min-width: 80px;
        }
        .speaker-icon {
            font-size: 2rem;
            cursor: pointer;
            background: #2a5298;
            color: white;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            box-shadow: 0 5px 0 #102a4c;
            flex-shrink: 0;
        }
        .voice-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 15px;
            width: 100%;
            background: rgba(255,255,255,0.4);
            border-radius: 40px;
            padding: 10px 18px;
        }
        .voice-container label {
            font-weight: 600;
            color: #1e2f4d;
            font-size: 0.9rem;
            white-space: nowrap;
        }
        .voice-container select {
            background: white;
            border: 1px solid #2a5298;
            border-radius: 40px;
            padding: 6px 12px;
            font-size: 0.85rem;
            min-width: 180px;
        }
        .question-item {
            background: white;
            border-radius: 32px;
            padding: 22px 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 18px;
            font-size: 1.1rem;
            line-height: 1.5;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .question-text .speaker-btn {
            font-size: 1.8rem;
            cursor: pointer;
            background: #2a5298;
            color: white;
            width: 44px;
            height: 44px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            box-shadow: 0 3px 0 #102a4c;
            flex-shrink: 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-left: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f3f7ff;
            padding: 12px 20px;
            border-radius: 60px;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 1rem;
            word-break: break-word;
        }
        .option.selected {
            border-color: #2a5298;
            background: #cddcff;
        }
        .option input {
            accent-color: #2a5298;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 25px #00000015;
            font-size: 0.95rem;
        }
        th {
            background: #2a5298;
            color: white;
            padding: 14px 10px;
            font-weight: 600;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #d0ddef;
        }
        .wrong-answer {
            background: #ffccc7;
            color: #a8071a;
            font-weight: 600;
            border-radius: 30px;
            padding: 4px 12px;
            display: inline-block;
        }
        .correct-answer {
            background: #b7eb8f;
            color: #237804;
            font-weight: 600;
            border-radius: 30px;
            padding: 4px 12px;
            display: inline-block;
            border: 2px solid #52c41a;
        }
        .report-chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin: 25px 0;
        }
        @media (max-width: 700px) {
            .report-chart-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        .chart-box {
            background: white;
            border-radius: 48px;
            padding: 25px;
            box-shadow: 0 15px 30px #0000001a;
            text-align: center;
        }
        .pie {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 15px auto;
            background: conic-gradient(#f5222d 0deg 180deg, #faad14 180deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .pie span {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 2.5rem;
            color: #1e2f4d;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .stat-item {
            background: white;
            border-radius: 32px;
            padding: 20px 12px;
            font-weight: 600;
            box-shadow: 0 5px 0 #b8c3d0;
            text-align: center;
            font-size: 1.2rem;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        .stat-item div:first-child { font-size: 1.1rem; margin-bottom: 8px; color: #1e2f4d; }
        .stat-item div:last-child { font-size: 1.4rem; font-weight: 700; color: #2a5298; }
        @media (max-width: 700px) {
            .stat-item { font-size: 1rem; padding: 15px 8px; min-height: 80px; }
            .stat-item div:first-child { font-size: 0.95rem; }
            .stat-item div:last-child { font-size: 1.2rem; }
        }
        .hidden-passage {
            background: #f0f5ff;
            border-radius: 36px;
            padding: 25px;
            margin: 25px 0;
            white-space: pre-line;
            font-size: 1rem;
            line-height: 1.6;
        }
        .action-buttons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 5px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .scroll-top {
            background: white;
            width: 56px;
            height: 56px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 4px 4px 14px #b8c3d0;
            cursor: pointer;
            text-decoration: none;
            color: #1e2f4d;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .scroll-top:active {
            box-shadow: inset 4px 4px 10px #b8c3d0;
            transform: scale(0.95);
        }
        .btn-back {
            background: white;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 6px 6px 16px #b8c3d0, -6px -6px 16px #ffffff;
            cursor: pointer;
            color: #1e2f4d;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>
<div class="app-container" id="app"></div>
<script>
    // =====================================================
    // HỆ THỐNG TỰ ĐỘNG THU THẬP CÁC BÀI HỌC (LỚP 4)
    // Chỉ cần khai báo biến với tên theo mẫu E4_U{unit}_B{bai}
    // =====================================================

    // Registry chứa tất cả các bài học
    window.LESSON_REGISTRY = {};

    // Hàm quét window để tìm các biến có tên dạng E4_..._...
    function scanLessons() {
        const lessonRegex = /^E4_U(\d+)_B(\d+)$/; // Lớp 4
        for (let key in window) {
            if (window.hasOwnProperty(key)) {
                const match = key.match(lessonRegex);
                if (match) {
                    const unit = match[1]; // unit, ví dụ "1"
                    const bai = match[2];  // bài, ví dụ "2"
                    const data = window[key];
                    // Kiểm tra xem data có cấu trúc bài học không (có P1, P2,...)
                    if (data && typeof data === 'object' && data.P1 !== undefined) {
                        if (!LESSON_REGISTRY['4']) LESSON_REGISTRY['4'] = {};
                        if (!LESSON_REGISTRY['4'][`U${unit}`]) LESSON_REGISTRY['4'][`U${unit}`] = {};
                        LESSON_REGISTRY['4'][`U${unit}`][`B${bai}`] = data;
                    }
                }
            }
        }
    }

    // =====================================================

    // ---------- UNIT 1 BÀI 2 ---------- (Giữ nguyên dữ liệu từ E9_U1_B2)

        P1: [
            { id: 1, word: "How old is Janet?", correct: "eleven years old", wrong1: "ten years old", wrong2: "twelve years old" },

            { id: 6, word: "She usually does her homework at home.", correct: "False", wrong1: "True", wrong2: "Not Given" },

            { id: 9, word: "The farm is very far from the school.", correct: "Not Given", wrong1: "True", wrong2: "False" },
            { id: 10, word: "They are going to have a biology lesson on the farm.", correct: "True", wrong1: "False", wrong2: "Not Given" }
        ],
        P3: [
            { id: 1, word: "Hi. My name ______ Janet.", correct: "is", wrong1: "are", wrong2: "am" },
            { id: 2, word: "I'm eleven years ______.", correct: "old", wrong1: "age", wrong2: "young" },

    function sortVoicesByPlatform(voices) {
        const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
        if (isIOS) {
            // Đưa giọng Samantha lên đầu (nếu có)
            const samanthaIndex = voices.findIndex(v => v.name.toLowerCase().includes('samantha'));
            if (samanthaIndex !== -1) {
                const samantha = voices[samanthaIndex];
                const otherVoices = voices.filter((_, idx) => idx !== samanthaIndex);
                return [samantha, ...otherVoices];
            }
            return voices;
        } else {
            // Desktop / Android: ưu tiên Google, Microsoft lên đầu
            const googleVoices = voices.filter(v => v.name.toLowerCase().includes('google'));
            const microsoftVoices = voices.filter(v => v.name.toLowerCase().includes('microsoft'));
            const otherVoices = voices.filter(v => !v.name.toLowerCase().includes('google') && !v.name.toLowerCase().includes('microsoft'));
            return [...googleVoices, ...microsoftVoices, ...otherVoices];
        }
    }

    // ---------- HÀM PHÁT ÂM (giữ nguyên) ----------
    function stopAllAudio() {
        speechSynthesis.cancel();
        if (audioTimeout) {
            clearTimeout(audioTimeout);
            audioTimeout = null;
        }
        audioQueue = [];
        isPaused = false;
    }

    function pauseAudio() {
        if (speechSynthesis.speaking) {
            speechSynthesis.pause();
            isPaused = true;
        }
        if (audioTimeout) {
            clearTimeout(audioTimeout);
            audioTimeout = null;
        }
    }

    function resumeAudio() {
        if (isPaused && speechSynthesis.paused) {
            speechSynthesis.resume();
            isPaused = false;
            return;
        }
    }

    function getVoiceForId(id) {
        if (voiceMode === 1) return singleVoice;
        return (id % 2 === 1) ? oddVoice : evenVoice;
    }

    function playAudioSentences(sentences, gapSec, loop) {
        stopAllAudio();
        if (!sentences || sentences.length === 0) return;

        sentences.forEach(item => {
            for (let i = 0; i < loop; i++) {
                audioQueue.push({ text: item.word, id: item.id });
            }
        });

        let index = 0;
        const playNext = () => {
            if (index >= audioQueue.length) {
                stopAllAudio();
                return;
            }
            const item = audioQueue[index];
            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.lang = 'en-GB';

            const voice = getVoiceForId(item.id);
            if (voice) utterance.voice = voice;

            utterance.onend = () => {
                index++;
                if (index < audioQueue.length && !isPaused) {
                    audioTimeout = setTimeout(playNext, gapSec * 1000);
                } else if (index >= audioQueue.length) {
                    stopAllAudio();
                }
            };
            utterance.onerror = () => {
                index++;
                if (index < audioQueue.length && !isPaused) {
                    audioTimeout = setTimeout(playNext, gapSec * 1000);
                }
            };
            speechSynthesis.speak(utterance);
        };
        playNext();
    }

    function splitTextWithUnderscores(text) {
        const parts = [];
        let lastIndex = 0;
        const regex = /_+/g;
        let match;
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
            }
            parts.push({ type: 'blank', content: match[0] });
            lastIndex = match.index + match[0].length;
        }
        if (lastIndex < text.length) {
            parts.push({ type: 'text', content: text.substring(lastIndex) });
        }
        return parts;
    }

    function speakSingleText(text, id) {
        if (!text || text.trim() === '') return;
        const parts = splitTextWithUnderscores(text);
        
        if (parts.length === 1 && parts[0].type === 'text') {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            const voice = getVoiceForId(id);
            if (voice) utterance.voice = voice;
            speechSynthesis.speak(utterance);
            return;
        }

        speechSynthesis.cancel();

        let currentIndex = 0;

        const speakNext = () => {
            if (currentIndex >= parts.length) return;
            const part = parts[currentIndex];
            let textToSpeak = part.content;
            if (part.type === 'blank') {
                textToSpeak = 'blank';
            }
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-GB';
            const voice = getVoiceForId(id);
            if (voice) utterance.voice = voice;

            utterance.onend = () => {
                currentIndex++;
                if (part.type === 'blank') {
                    setTimeout(speakNext, 300);
                } else {
                    speakNext();
                }
            };
            utterance.onerror = () => {
                currentIndex++;
                if (part.type === 'blank') {
                    setTimeout(speakNext, 300);
                } else {
                    speakNext();
                }
            };
            speechSynthesis.speak(utterance);
        };

        speakNext();
    }

    function populateVoiceList() {
        if (!('speechSynthesis' in window)) return;
        const voices = speechSynthesis.getVoices();
        voiceList = sortVoicesByPlatform(voices);
        const davidVoice = voiceList.find(v =>

    function updateVoiceDropdowns(preferredVoice = null) {
        const singleSelect = document.getElementById('voiceSelect');
        const oddSelect = document.getElementById('oddVoiceSelect');
        const evenSelect = document.getElementById('evenVoiceSelect');
        if (!singleSelect || !oddSelect || !evenSelect) return;

        const fillSelect = (select) => {
            select.innerHTML = '';
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '-- Chọn giọng --';
            select.appendChild(emptyOpt);

            voiceList.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.voiceURI;
                opt.textContent = `${v.name} (${v.lang})${v.default ? ' [Mặc định]' : ''}`;
                if (preferredVoice && v.voiceURI === preferredVoice.voiceURI) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        };
        fillSelect(singleSelect);
        fillSelect(oddSelect);
        fillSelect(evenSelect);

        singleVoice = singleSelect.value ? voiceList.find(v => v.voiceURI === singleSelect.value) : null;
        oddVoice = oddSelect.value ? voiceList.find(v => v.voiceURI === oddSelect.value) : null;
        evenVoice = evenSelect.value ? voiceList.find(v => v.voiceURI === evenSelect.value) : null;
    }

                    </div>
                    <div id="dualVoiceContainer" style="display: none; align-items:center; gap: 10px; flex-wrap:wrap;">
                        <label>Giọng lẻ (1,3,5...): <select id="oddVoiceSelect" style="min-width:160px;"></select></label>
                        <label>Giọng chẵn (2,4,6...): <select id="evenVoiceSelect" style="min-width:160px;"></select></label>
                    </div>
                </div>

                <div id="quizQuestions"></div>
                <div class="btn-group"><button class="btn primary" id="submitQuizBtn">📩 NỘP BÀI</button></div>
                
                <div class="action-buttons-container">
                    <button class="btn-back" id="backToMainBtn">◀ QUAY LẠI</button>
                    <a href="#" class="scroll-top" id="scrollTopQuiz">⬆️</a>
                </div>
            </div>`;
        app.innerHTML = html;

        let qDiv = document.getElementById('quizQuestions');
        quizData.forEach((q, idx) => {
            let qHtml = `<div class="question-item" data-qidx="${idx}">
                <div class="question-text">
                    <span class="speaker-btn" data-text="${q.question.replace(/"/g, '&quot;')}" data-id="${q.id}">🔊</span>
                    ${idx+1}. ${q.question}
                </div>
                <div class="options">`;
            q.options.forEach((opt, optIdx) => {
                let checked = (userAnswers[idx] && userAnswers[idx].chosen === opt) ? 'checked' : '';
                qHtml += `<label class="option ${checked ? 'selected' : ''}"><input type="radio" name="q${idx}" value="${opt}" ${checked}> ${opt}</label>`;
            });
            qHtml += '</div></div>';
            qDiv.innerHTML += qHtml;
        });

        document.querySelectorAll('.question-item input[type=radio]').forEach(radio => {
            radio.addEventListener('change', function(e) {
                let name = this.name;
                let qIndex = parseInt(name.substring(1));
                let chosen = this.value;
                if (!userAnswers[qIndex]) userAnswers[qIndex] = {};
                userAnswers[qIndex].chosen = chosen;
                document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                    r.closest('.option').classList.remove('selected');
                });
                this.closest('.option').classList.add('selected');
            });
        });

        document.querySelectorAll('.speaker-btn[data-text]').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                const text = btn.getAttribute('data-text');
                const id = parseInt(btn.getAttribute('data-id'));
                speakSingleText(text, id);
            });
        });

        if (voiceList.length) {
            const davidVoice = voiceList.find(v => 
                v.name.toLowerCase().includes('david') && 
                (v.lang.includes('en-GB') || v.lang.includes('en-US'))
            );
            updateVoiceDropdowns(davidVoice);
        } else {
            populateVoiceList();
        }

        document.getElementById('voiceModeSelect').addEventListener('change', function(e) {
            voiceMode = parseInt(e.target.value);
            document.getElementById('singleVoiceContainer').style.display = voiceMode === 1 ? 'flex' : 'none';
            document.getElementById('dualVoiceContainer').style.display = voiceMode === 2 ? 'flex' : 'none';
        });
        document.getElementById('voiceSelect')?.addEventListener('change', e => {
            singleVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('oddVoiceSelect')?.addEventListener('change', e => {
            oddVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('evenVoiceSelect')?.addEventListener('change', e => {
            evenVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });

        document.getElementById('playSpeaker').addEventListener('click', ()=>{
            if (!audioEnabled) { startTime = Date.now(); audioEnabled = true; }
            if (currentLessonData && currentLessonData.P5) {
                let gap = parseFloat(document.getElementById('gapTimeSelect').value);
                let loop = parseInt(document.getElementById('loopCountSelect').value);
                playAudioSentences(currentLessonData.P5, gap, loop);
            }
        });
        document.getElementById('pauseAudioBtn').addEventListener('click', ()=>{
            if (isPaused) resumeAudio(); else pauseAudio();
        });
        document.getElementById('stopAudioBtn').addEventListener('click', stopAllAudio);
        document.getElementById('backToMainBtn').addEventListener('click', ()=>{ stopAllAudio(); currentScreen='main'; render(); scrollToTop(); });
        document.getElementById('scrollTopQuiz').addEventListener('click', e=>{ e.preventDefault(); scrollToTop(); });
        document.getElementById('submitQuizBtn').addEventListener('click', ()=>{
            if (userAnswers.filter(a=>a?.chosen).length !== quizData.length) { 
                alert(`Vui lòng trả lời đủ ${quizData.length} câu`); 
                return; 
            }
            endTime = Date.now();
            stopAllAudio();
            currentScreen = 'report';
            render();
            scrollToTop();
        });
    }

    function renderReport() {
        let total = quizData.length;
        let correctCount = userAnswers.filter((ans,i)=> ans?.chosen === quizData[i]?.correct).length;
        let percent = (correctCount/total)*100;
        let color = percent<50?'#f5222d':percent<70?'#faad14':percent<80?'#52c41a':percent<90?'#13c2c2':percent<100?'#1890ff':'#722ed1';
        let startStr = startTime ? new Date(startTime).toLocaleTimeString() : '';
        let endStr = endTime ? new Date(endTime).toLocaleTimeString() : '';
        let streak = 0, maxStreak=0;
        userAnswers.forEach((a,i)=> { if(a?.chosen===quizData[i]?.correct) streak++; else { maxStreak=Math.max(maxStreak,streak); streak=0; } });
        maxStreak=Math.max(maxStreak,streak);
        let totalTime = endTime && startTime ? Math.round((endTime-startTime)/300) : 0;

        let titleBai = selectedBai === 'KIỂM TRA NGẪU NHIÊN' ? 'KIỂM TRA' : selectedBai;
        let passageText = currentLessonData?.P4 || 'Chưa có nội dung';
        let sentences = currentLessonData?.P5 || [];

        let html = `
            <div class="main-card">
                <h2>📊 BÁO CÁO LỚP 4 - ${selectedUnit} - ${titleBai}</h2>
                <div class="title-sub">${selectedDang}</div>
                
                <div class="report-chart-grid">
                    <div class="chart-box">
                        <div style="font-weight:800; font-size:2.4rem; color:blue; margin-bottom:10px;">${studentName}</div>
                        <div class="pie" style="background: conic-gradient(${color} 0deg ${percent*3.6}deg, #e0e0e0 ${percent*3.6}deg 360deg);">
                            <span style="color: ${color};">${Math.round(percent)}%</span>
                        </div>
                        <div style="font-weight:bold; color:#1e3c72; margin-top:15px;">${new Date().toLocaleDateString()}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item"><div>⏱️ START</div><div>${startStr}</div></div>
                        <div class="stat-item"><div>⌛ END</div><div>${endStr}</div></div>
                        <div class="stat-item"><div>🔗 CHUỖI</div><div>${maxStreak}/${correctCount}/${total}</div></div>
                        <div class="stat-item"><div>⏳ Tổng</div><div>${totalTime}s</div></div>
                    </div>
                </div>

                <div class="audio-panel" id="audioPanelReport">
                    <span class="speaker-icon" id="playSpeakerReport">🔊</span>
                    <select id="gapTimeSelectReport">
                        <option value="0.25">0.25s</option>
                        <option value="0.5" selected>0.5s</option>
                        <option value="0.75">0.75s</option>
                        <option value="1">1s</option>
                        <option value="2">2s</option>
                        <option value="3">3s</option>
                        <option value="4">4s</option>
                        <option value="5">5s</option>
                        <option value="6">6s</option>
                    </select>
                    <select id="loopCountSelectReport">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                    <button id="pauseAudioBtnReport">⏸️</button><button id="stopAudioBtnReport">⏹️</button>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0 20px; align-items: center; background: #e0ebf9; padding: 12px 20px; border-radius: 40px;">
                    <label style="font-weight:600;">Số giọng:
                        <select id="voiceModeSelectReport" style="padding:6px 12px;">
                            <option value="1" selected>1 giọng</option>
                            <option value="2">2 giọng</option>
                        </select>
                    </label>
                    <div id="singleVoiceContainerReport" style="display: flex; gap:10px;">
                        <label>Giọng: <select id="voiceSelectReport"></select></label>
                    </div>
                    <div id="dualVoiceContainerReport" style="display: none; gap:10px; flex-wrap:wrap;">
                        <label>Giọng lẻ: <select id="oddVoiceSelectReport"></select></label>
                        <label>Giọng chẵn: <select id="evenVoiceSelectReport"></select></label>
                    </div>
                </div>

                <button class="btn" id="togglePassageBtn">📄 HIỆN đoạn văn P4</button>
                <div id="passageContainer" style="display:none;" class="hidden-passage">${passageText}</div>
                
                <h3>📋 Chi tiết câu hỏi</h3>
                <table><thead><tr><th>STT</th><th>Nội dung</th><th>Đáp án chọn</th><th>Đáp án đúng</th></tr></thead><tbody>`;
        quizData.forEach((q,i)=>{
            let chosen = userAnswers[i]?.chosen || '—';
            let correct = q.correct;
            let wrongClass = (chosen !== correct) ? 'wrong-answer' : '';
            html += `<tr><td>${i+1}</td><td>${q.question}</td><td class="${wrongClass}">${chosen}</td><td><span class="correct-answer">${correct}</span></td></tr>`;
        });
        html += `</tbody></table><br>
                <div class="action-buttons-container">
                    <button class="btn-back" id="backToMainBtnReport">◀ QUAY LẠI</button>
                    <a href="#" class="scroll-top" id="scrollTopReport">⬆️</a>
                </div>
            </div>`;
        app.innerHTML = html;

        // Xử lý voice dropdowns trong report (giống quiz)
        if (voiceList.length) {
            const davidVoice = voiceList.find(v => 
                v.name.toLowerCase().includes('david') && 
                (v.lang.includes('en-GB') || v.lang.includes('en-US'))
            );
            const singleSel = document.getElementById('voiceSelectReport');
            const oddSel = document.getElementById('oddVoiceSelectReport');
            const evenSel = document.getElementById('evenVoiceSelectReport');
            if (singleSel && oddSel && evenSel) {
                const fill = (sel) => {
                    sel.innerHTML = '';
                    const emptyOpt = document.createElement('option');
                    emptyOpt.value = '';
                    emptyOpt.textContent = '-- Chọn giọng --';
                    sel.appendChild(emptyOpt);
                    voiceList.forEach(v => {
                        let opt = document.createElement('option');
                        opt.value = v.voiceURI;
                        opt.textContent = `${v.name} (${v.lang})`;
                        if (davidVoice && v.voiceURI === davidVoice.voiceURI) opt.selected = true;
                        sel.appendChild(opt);
                    });
                };
                fill(singleSel);
                fill(oddSel);
                fill(evenSel);
            }
        }

        const modeSel = document.getElementById('voiceModeSelectReport');
        const singleDiv = document.getElementById('singleVoiceContainerReport');
        const dualDiv = document.getElementById('dualVoiceContainerReport');
        modeSel.addEventListener('change', e => {
            voiceMode = parseInt(e.target.value);
            singleDiv.style.display = voiceMode === 1 ? 'flex' : 'none';
            dualDiv.style.display = voiceMode === 2 ? 'flex' : 'none';
        });
        document.getElementById('voiceSelectReport')?.addEventListener('change', e => {
            singleVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('oddVoiceSelectReport')?.addEventListener('change', e => {
            oddVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('evenVoiceSelectReport')?.addEventListener('change', e => {
            evenVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });

        document.getElementById('playSpeakerReport').addEventListener('click', ()=>{
            if (currentLessonData && currentLessonData.P5) {
                let gap = parseFloat(document.getElementById('gapTimeSelectReport').value);
                let loop = parseInt(document.getElementById('loopCountSelectReport').value);
                playAudioSentences(currentLessonData.P5, gap, loop);
            }
        });
        document.getElementById('pauseAudioBtnReport').addEventListener('click', ()=>{
            if (isPaused) resumeAudio(); else pauseAudio();
        });
        document.getElementById('stopAudioBtnReport').addEventListener('click', stopAllAudio);
        document.getElementById('togglePassageBtn').addEventListener('click', ()=>{
            let c = document.getElementById('passageContainer');
            c.style.display = c.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('backToMainBtnReport').addEventListener('click', ()=>{ stopAllAudio(); currentScreen='main'; render(); scrollToTop(); });
        document.getElementById('scrollTopReport').addEventListener('click', e=>{ e.preventDefault(); scrollToTop(); });
    }

    function render() {
        if (currentScreen === 'main') renderMain();
        else if (currentScreen === 'quiz') renderQuiz();
        else if (currentScreen === 'report') renderReport();
    }

    render();
</script>
</body>
</html>
