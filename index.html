<script>
    // =====================================================
    // HỆ THỐNG TỰ ĐỘNG THU THẬP CÁC BÀI HỌC (LỚP 5)
    // =====================================================

    window.LESSON_REGISTRY = {};

    function scanLessons() {
        const lessonRegex = /^E5_U(\d+)_B(\d+)$/;
        for (let key in window) {
            if (window.hasOwnProperty(key)) {
                const match = key.match(lessonRegex);
                if (match) {
                    const unit = match[1];
                    const bai = match[2];
                    const data = window[key];
                    if (data && typeof data === 'object' && data.P1 !== undefined) {
                        if (!LESSON_REGISTRY['5']) LESSON_REGISTRY['5'] = {};
                        if (!LESSON_REGISTRY['5'][`U${unit}`]) LESSON_REGISTRY['5'][`U${unit}`] = {};
                        LESSON_REGISTRY['5'][`U${unit}`][`B${bai}`] = data;
                    }
                }
            }
        }
    }

    // ---------- DỮ LIỆU BÀI HỌC (Giữ nguyên - đã rút gọn trong ví dụ này nhưng bạn cần giữ nguyên full dữ liệu của bạn) ----------
    // ... (Phần dữ liệu var E5_U1_B1 = {...} ... các bạn copy y nguyên từ code cũ của bạn vào đây) ...
    // QUAN TRỌNG: Hãy dán toàn bộ nội dung dữ liệu bài học (E5_U1_B1, E5_U1_B2...) vào đây.
    // Tôi sẽ bỏ qua phần dữ liệu dài để tập trung vào sửa lỗi JS.
    
    // === DÁN DỮ LIỆU CỦA BẠN VÀO ĐÂY (GIỮ NGUYÊN) ===
    var E5_U1_B1 = { P1: [ /* ... */ ], P2: [ /* ... */ ], P3: [ /* ... */ ], P4: "...", P5: [ /* ... */ ] };
    // ... (Các bài khác) ...
    // === KẾT THÚC PHẦN DỮ LIỆU ===

    var E5_U1_B4 = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };
    var E5_U1_B5 = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };
    var E5_U1_B6 = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };
    var E5_U1_B7 = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };
    var E5_U1_B8 = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };
    var E5_U1_B9 = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };
    var E5_U1_B10 = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };

    (function createEmptyLessons() {
        for (let unit = 2; unit <= 20; unit++) {
            for (let bai = 1; bai <= 10; bai++) {
                let varName = 'E5_U' + unit + '_B' + bai;
                if (typeof window[varName] === 'undefined') {
                    window[varName] = { P1: [], P2: [], P3: [], P4: "Chưa có nội dung", P5: [] };
                }
            }
        }
    })();

    scanLessons();

    function isLessonValid(lesson) {
        return (lesson.P1 && lesson.P1.length > 0) ||
               (lesson.P2 && lesson.P2.length > 0) ||
               (lesson.P3 && lesson.P3.length > 0) ||
               (lesson.P4 && lesson.P4 !== "Chưa có nội dung");
    }

    const UNIT_ITEMS = [];
    for (let i = 1; i <= 20; i++) UNIT_ITEMS.push(`UNIT ${i}`);
    const BAI_ITEMS = ['KIỂM TRA NGẪU NHIÊN', ...Array.from({ length: 10 }, (_, i) => `BÀI ${i+1}`)];
    const DANG_BAI = ['TRẮC NGHIỆM TỔNG HỢP', 'TRẮC NGHIỆM TRẢ LỜI CÂU HỎI', 'TRẮC NGHIỆM TRUE – FALSE – NOT GIVEN', 'TRẮC NGHIỆM ĐIỀN KHUYẾT'];

    let currentScreen = 'main';
    let studentName = '';
    let selectedUnit = 'UNIT 1';
    let selectedBai = 'KIỂM TRA NGẪU NHIÊN';
    let selectedDang = DANG_BAI[0];
    let quizData = null;
    let userAnswers = [];
    let startTime = null;
    let endTime = null;
    let currentLessonData = null;

    let voiceList = [];
    let voiceMode = 1;
    let singleVoice = null;
    let oddVoice = null;
    let evenVoice = null;
    let isPaused = false;
    let audioQueue = [];
    let audioTimeout = null;
    let audioEnabled = false;

    const app = document.getElementById('app');

    // ---------- HÀM PHÁT ÂM (giữ nguyên) ----------
    function stopAllAudio() {
        speechSynthesis.cancel();
        if (audioTimeout) {
            clearTimeout(audioTimeout);
            audioTimeout = null;
        }
        audioQueue = [];
        isPaused = false;
    }

    function pauseAudio() {
        if (speechSynthesis.speaking) {
            speechSynthesis.pause();
            isPaused = true;
        }
        if (audioTimeout) {
            clearTimeout(audioTimeout);
            audioTimeout = null;
        }
    }

    function resumeAudio() {
        if (isPaused && speechSynthesis.paused) {
            speechSynthesis.resume();
            isPaused = false;
            return;
        }
    }

    function getVoiceForId(id) {
        if (voiceMode === 1) return singleVoice;
        return (id % 2 === 1) ? oddVoice : evenVoice;
    }

    function playAudioSentences(sentences, gapSec, loop) {
        stopAllAudio();
        if (!sentences || sentences.length === 0) return;

        sentences.forEach(item => {
            for (let i = 0; i < loop; i++) {
                audioQueue.push({ text: item.word, id: item.id });
            }
        });

        let index = 0;
        const playNext = () => {
            if (index >= audioQueue.length) {
                stopAllAudio();
                return;
            }
            const item = audioQueue[index];
            const utterance = new SpeechSynthesisUtterance(item.text);
            utterance.lang = 'en-GB';

            const voice = getVoiceForId(item.id);
            if (voice) utterance.voice = voice;

            utterance.onend = () => {
                index++;
                if (index < audioQueue.length && !isPaused) {
                    audioTimeout = setTimeout(playNext, gapSec * 300);
                } else if (index >= audioQueue.length) {
                    stopAllAudio();
                }
            };
            utterance.onerror = () => {
                index++;
                if (index < audioQueue.length && !isPaused) {
                    audioTimeout = setTimeout(playNext, gapSec * 300);
                }
            };
            speechSynthesis.speak(utterance);
        };
        playNext();
    }

    function splitTextWithUnderscores(text) {
        const parts = [];
        let lastIndex = 0;
        const regex = /_+/g;
        let match;
        while ((match = regex.exec(text)) !== null) {
            if (match.index > lastIndex) {
                parts.push({ type: 'text', content: text.substring(lastIndex, match.index) });
            }
            parts.push({ type: 'blank', content: match[0] });
            lastIndex = match.index + match[0].length;
        }
        if (lastIndex < text.length) {
            parts.push({ type: 'text', content: text.substring(lastIndex) });
        }
        return parts;
    }

    function speakSingleText(text, id) {
        if (!text || text.trim() === '') return;
        const parts = splitTextWithUnderscores(text);
        
        if (parts.length === 1 && parts[0].type === 'text') {
            speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-GB';
            const voice = getVoiceForId(id);
            if (voice) utterance.voice = voice;
            speechSynthesis.speak(utterance);
            return;
        }

        speechSynthesis.cancel();

        let currentIndex = 0;

        const speakNext = () => {
            if (currentIndex >= parts.length) return;
            const part = parts[currentIndex];
            let textToSpeak = part.content;
            if (part.type === 'blank') {
                textToSpeak = 'blank';
            }
            const utterance = new SpeechSynthesisUtterance(textToSpeak);
            utterance.lang = 'en-GB';
            const voice = getVoiceForId(id);
            if (voice) utterance.voice = voice;

            utterance.onend = () => {
                currentIndex++;
                if (part.type === 'blank') {
                    setTimeout(speakNext, 300);
                } else {
                    speakNext();
                }
            };
            utterance.onerror = () => {
                currentIndex++;
                if (part.type === 'blank') {
                    setTimeout(speakNext, 300);
                } else {
                    speakNext();
                }
            };
            speechSynthesis.speak(utterance);
        };

        speakNext();
    }

    // ----- XÁC ĐỊNH THIẾT BỊ -----
    function getDeviceType() {
        const ua = navigator.userAgent;
        if (/iPhone|iPad|iPod/i.test(ua)) return 'ios';
        if (/Android/i.test(ua)) return 'android';
        return 'desktop';
    }

    // ----- LỌC GIỌNG: LẤY TẤT CẢ GIỌNG en-GB/en-US, SẮP XẾP ƯU TIÊN -----
    function getPrioritizedVoices(allVoices) {
        const device = getDeviceType();
        let englishVoices = allVoices.filter(v => v.lang.startsWith('en-GB') || v.lang.startsWith('en-US'));
        if (englishVoices.length === 0) return [];

        let priorityKeywords = [];
        if (device === 'ios') {
            priorityKeywords.push('daniel', 'siri', 'kate', 'jamie', 'oliver', 'serena');
            priorityKeywords.push('samantha', 'susan', 'tom', 'zoe', 'alex', 'alison');
        } else if (device === 'android') {
            priorityKeywords.push('google uk english male', 'google uk english female',
                                  'google us english male', 'google us english female', 'google us english');
        } else {
            priorityKeywords.push('microsoft david', 'microsoft mark', 'microsoft zira',
                                  'google uk english male', 'google uk english female', 'google us english');
        }

        const voicesWithPriority = englishVoices.map(v => {
            const lowerName = v.name.toLowerCase();
            const matched = priorityKeywords.some(kw => lowerName.includes(kw));
            return { voice: v, priority: matched };
        });

        voicesWithPriority.sort((a, b) => {
            if (a.priority !== b.priority) return b.priority - a.priority;
            return a.voice.name.localeCompare(b.voice.name);
        });

        return voicesWithPriority.map(vwp => vwp.voice);
    }

    function populateVoiceList() {
        if (!('speechSynthesis' in window)) return;
        const allVoices = speechSynthesis.getVoices();
        voiceList = getPrioritizedVoices(allVoices);

        // Chọn giọng mặc định
        let defaultVoice = null;
        if (voiceList.length > 0) {
            defaultVoice = voiceList[0];
        }
        // Cập nhật dropdown nếu đang ở màn hình quiz/report
        // Hàm này sẽ được gọi an toàn ngay cả khi chưa có DOM
        updateVoiceDropdowns(defaultVoice);
    }

    function updateVoiceDropdowns(preferredVoice = null) {
        const singleSelect = document.getElementById('voiceSelect');
        const oddSelect = document.getElementById('oddVoiceSelect');
        const evenSelect = document.getElementById('evenVoiceSelect');
        
        // Nếu chưa vào màn hình làm bài, các element này chưa tồn tại -> chỉ cần populate data vào biến voiceList là đủ
        if (!singleSelect || !oddSelect || !evenSelect) return;

        const fillSelect = (select) => {
            select.innerHTML = '';
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '-- Chọn giọng --';
            select.appendChild(emptyOpt);

            voiceList.forEach(v => {
                const opt = document.createElement('option');
                opt.value = v.voiceURI;
                opt.textContent = `${v.name} (${v.lang})${v.default ? ' [Mặc định]' : ''}`;
                if (preferredVoice && v.voiceURI === preferredVoice.voiceURI) {
                    opt.selected = true;
                }
                select.appendChild(opt);
            });
        };
        fillSelect(singleSelect);
        fillSelect(oddSelect);
        fillSelect(evenSelect);

        singleVoice = singleSelect.value ? voiceList.find(v => v.voiceURI === singleSelect.value) : (voiceList[0] || null);
        oddVoice = oddSelect.value ? voiceList.find(v => v.voiceURI === oddSelect.value) : (voiceList[0] || null);
        evenVoice = evenSelect.value ? voiceList.find(v => v.voiceURI === evenSelect.value) : (voiceList[0] || null);
    }

    // =====================================================
    // SỬA LỖI IOS: DÙNG CƠ CHẾ POLLING (THĂM DÒ LIÊN TỤC)
    // =====================================================
    if ('speechSynthesis' in window) {
        // 1. Lắng nghe sự kiện chuẩn
        speechSynthesis.onvoiceschanged = populateVoiceList;

        // 2. Dùng Interval để ép buộc tải trên iOS nếu sự kiện không fire ngay
        let iosVoiceRetryCount = 0;
        const iosVoiceInterval = setInterval(() => {
            const voices = speechSynthesis.getVoices();
            if (voices.length > 0) {
                console.log("Đã tải giọng đọc thành công (hoặc retry).");
                populateVoiceList(); // Cập nhật lần cuối
                clearInterval(iosVoiceInterval); // Dừng kiểm tra
            } else {
                iosVoiceRetryCount++;
                // Thử tối đa 20 lần (10 giây), sau đó bỏ qua để tránh treo script
                if (iosVoiceRetryCount > 20) {
                    clearInterval(iosVoiceInterval);
                }
            }
        }, 500); // Kiểm tra mỗi 0.5 giây
    }

    // ---------- HÀM CHUẨN BỊ DỮ LIỆU ----------
    function prepareQuizData() {
        const unitKey = selectedUnit.replace('UNIT ', 'U');
        let baiNumber = null;
        let rawData = null;

        if (selectedBai === 'KIỂM TRA NGẪU NHIÊN') {
            const unitLessons = LESSON_REGISTRY['5']?.[unitKey];
            if (!unitLessons) {
                alert(`Unit ${selectedUnit} chưa có bài nào.`);
                return false;
            }
            const availableBais = Object.keys(unitLessons);
            const validBais = availableBais.filter(b => isLessonValid(unitLessons[b]));
            if (validBais.length === 0) {
                alert(`Unit ${selectedUnit} chưa có bài nào có dữ liệu.`);
                return false;
            }
            const randomBai = validBais[Math.floor(Math.random() * validBais.length)];
            baiNumber = randomBai.substring(1);
            rawData = unitLessons[randomBai];
        } else {
            baiNumber = selectedBai.replace('BÀI ', '');
            rawData = LESSON_REGISTRY['5']?.[unitKey]?.[`B${baiNumber}`];
            if (!rawData) {
                alert(`Không tìm thấy dữ liệu cho ${selectedUnit} - ${selectedBai}.`);
                return false;
            }
            if (!isLessonValid(rawData)) {
                alert(`Bài ${selectedBai} trong ${selectedUnit} chưa có nội dung.`);
                return false;
            }
        }

        if (!rawData) {
            alert(`Không tìm thấy dữ liệu cho ${selectedUnit} - ${selectedBai}.`);
            return false;
        }

        currentLessonData = rawData;

        let questionPool = [];
        let numberOfQuestions = 5;

        if (selectedDang === 'TRẮC NGHIỆM TỔNG HỢP') {
            const p1 = rawData.P1 || [];
            const p2 = rawData.P2 || [];
            const p3 = rawData.P3 || [];
            questionPool = [...p1, ...p2, ...p3];
            numberOfQuestions = 10;
        } else if (selectedDang.includes('TRẮC NGHIỆM TRẢ LỜI CÂU HỎI')) {
            questionPool = rawData.P1 || [];
        } else if (selectedDang.includes('TRUE – FALSE')) {
            questionPool = rawData.P2 || [];
        } else if (selectedDang.includes('ĐIỀN KHUYẾT')) {
            questionPool = rawData.P3 || [];
        }

        if (!questionPool.length) {
            alert('Dạng bài này chưa có câu hỏi.');
            return false;
        }

        const shuffled = [...questionPool].sort(() => 0.5 - Math.random());
        const selected = shuffled.slice(0, Math.min(numberOfQuestions, shuffled.length));

        quizData = selected.map(q => {
            let opts = [q.correct, q.wrong1, q.wrong2];
            for (let i = opts.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [opts[i], opts[j]] = [opts[j], opts[i]];
            }
            return {
                id: q.id,
                question: q.word,
                options: opts,
                correct: q.correct
            };
        });
        return true;
    }

    // ---------- RENDER ----------
    function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

    function renderMain() {
        let html = `
            <div class="main-card">
                <h1>🔊 LUYỆN NGHE TIẾNG ANH LỚP 5</h1>
                <div class="flex-col">
                    <div class="label-input"><label>👤 TÊN</label><input type="text" id="studentNameInput" value="${studentName}"></div>
                    <div class="label-input"><label>📚 UNIT</label><select id="unitSelect">${UNIT_ITEMS.map(u => `<option ${selectedUnit===u?'selected':''}>${u}</option>`).join('')}</select></div>
                    <div class="label-input"><label>📖 BÀI</label><select id="baiSelect">${BAI_ITEMS.map(b => `<option ${selectedBai===b?'selected':''}>${b}</option>`).join('')}</select></div>
                    <div class="label-input"><label>🎯 DẠNG</label><select id="dangSelect">${DANG_BAI.map(d => `<option ${selectedDang===d?'selected':''}>${d}</option>`).join('')}</select></div>
                    <div class="btn-group"><button class="btn primary" id="startBtn">▶ LÀM BÀI</button></div>
                </div>
                <div class="footer-info"><p>👨🏫 Thầy Hùng</p><p>Giáo viên dạy kèm Toán, tiếng Anh</p><p class="zalo">📞 Zalo: 0967.095.025</p></div>
                <div class="action-buttons-container"><div></div><a href="#" class="scroll-top" id="scrollTopMain">⬆️</a></div>
            </div>`;
        app.innerHTML = html;
        document.getElementById('studentNameInput').addEventListener('input', e => studentName = e.target.value);
        document.getElementById('unitSelect').addEventListener('change', e => selectedUnit = e.target.value);
        document.getElementById('baiSelect').addEventListener('change', e => selectedBai = e.target.value);
        document.getElementById('dangSelect').addEventListener('change', e => selectedDang = e.target.value);
        document.getElementById('startBtn').addEventListener('click', () => {
            if (!studentName.trim()) { alert('Vui lòng nhập tên'); return; }
            if (!prepareQuizData()) { return; }
            currentScreen = 'quiz';
            startTime = Date.now();
            endTime = null;
            userAnswers = [];
            audioEnabled = false;
            render();
            scrollToTop();
        });
        document.getElementById('scrollTopMain').addEventListener('click', (e)=>{ e.preventDefault(); scrollToTop(); });
    }

    function renderQuiz() {
        let titleBai = selectedBai === 'KIỂM TRA NGẪU NHIÊN' ? 'KIỂM TRA' : selectedBai;
        let html = `
            <div class="main-card">
                <h2>📘 LỚP 5 - ${selectedUnit} - ${titleBai}</h2>
                <div class="title-sub">${selectedDang}</div>
                
                <div class="audio-panel" id="audioPanel">
                    <span class="speaker-icon" id="playSpeaker">🔊</span>
                    <select id="gapTimeSelect">
                        <option value="0.25">0.25s</option>
                        <option value="0.5" selected>0.5s</option>
                        <option value="0.75">0.75s</option>
                        <option value="1">1s</option>
                        <option value="2">2s</option>
                        <option value="3">3s</option>
                        <option value="4">4s</option>
                        <option value="5">5s</option>
                        <option value="6">6s</option>
                    </select>
                    <select id="loopCountSelect">
                        <option value="1" selected>1 lần</option>
                        <option value="2">2 lần</option>
                        <option value="3">3 lần</option>
                        <option value="4">4 lần</option>
                    </select>
                    <button id="pauseAudioBtn">⏸️</button>
                    <button id="stopAudioBtn">⏹️</button>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 16px; margin-bottom: 20px; align-items: center; background: #e0ebf9; padding: 12px 20px; border-radius: 40px;">
                    <label style="font-weight:600;">Số giọng:
                        <select id="voiceModeSelect" style="padding:6px 12px; border-radius:40px;">
                            <option value="1" selected>1 giọng</option>
                            <option value="2">2 giọng (lẻ/chẵn)</option>
                        </select>
                    </label>
                    <div id="singleVoiceContainer" style="display: flex; align-items:center; gap: 10px;">
                        <label>Giọng: <select id="voiceSelect" style="min-width:180px; padding:6px;"></select></label>
                    </div>
                    <div id="dualVoiceContainer" style="display: none; align-items:center; gap: 10px; flex-wrap:wrap;">
                        <label>Giọng lẻ (1,3,5...): <select id="oddVoiceSelect" style="min-width:160px;"></select></label>
                        <label>Giọng chẵn (2,4,6...): <select id="evenVoiceSelect" style="min-width:160px;"></select></label>
                    </div>
                </div>

                <div id="quizQuestions"></div>
                <div class="btn-group"><button class="btn primary" id="submitQuizBtn">📩 NỘP BÀI</button></div>
                
                <div class="action-buttons-container">
                    <button class="btn-back" id="backToMainBtn">◀ QUAY LẠI</button>
                    <a href="#" class="scroll-top" id="scrollTopQuiz">⬆️</a>
                </div>
            </div>`;
        app.innerHTML = html;

        let qDiv = document.getElementById('quizQuestions');
        quizData.forEach((q, idx) => {
            let qHtml = `<div class="question-item" data-qidx="${idx}">
                <div class="question-text">
                    <span class="speaker-btn" data-text="${q.question.replace(/"/g, '&quot;')}" data-id="${q.id}">🔊</span>
                    ${idx+1}. ${q.question}
                </div>
                <div class="options">`;
            q.options.forEach((opt, optIdx) => {
                let checked = (userAnswers[idx] && userAnswers[idx].chosen === opt) ? 'checked' : '';
                qHtml += `<label class="option ${checked ? 'selected' : ''}"><input type="radio" name="q${idx}" value="${opt}" ${checked}> ${opt}</label>`;
            });
            qHtml += '</div></div>';
            qDiv.innerHTML += qHtml;
        });

        document.querySelectorAll('.question-item input[type=radio]').forEach(radio => {
            radio.addEventListener('change', function(e) {
                let name = this.name;
                let qIndex = parseInt(name.substring(1));
                let chosen = this.value;
                if (!userAnswers[qIndex]) userAnswers[qIndex] = {};
                userAnswers[qIndex].chosen = chosen;
                document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                    r.closest('.option').classList.remove('selected');
                });
                this.closest('.option').classList.add('selected');
            });
        });

        document.querySelectorAll('.speaker-btn[data-text]').forEach(btn => {
            btn.addEventListener('click', e => {
                e.stopPropagation();
                const text = btn.getAttribute('data-text');
                const id = parseInt(btn.getAttribute('data-id'));
                speakSingleText(text, id);
            });
        });

        // --- XỬ LÝ GIỌNG ĐỌC TRONG QUIZ ---
        // Gọi update để nạp dữ liệu vào dropdown (nếu voiceList đã có từ trước)
        // Nếu voiceList rỗng (iOS chậm), nó sẽ được cập nhật sau bởi Interval đã đặt ở trên
        if (voiceList.length > 0) {
            updateVoiceDropdowns(voiceList[0]);
        } else {
            // Thêm listener để cập nhật dropdown ngay khi voiceList được tải xong (bởi interval)
            // Chúng ta dùng một biến cờ để tránh gắn nhiều listener
            if (!window.voiceLoadedListenerAdded) {
                const checkVoicesReady = setInterval(() => {
                    if (voiceList.length > 0) {
                        updateVoiceDropdowns(voiceList[0]);
                        clearInterval(checkVoicesReady);
                    }
                }, 200);
                window.voiceLoadedListenerAdded = true;
            }
        }

        document.getElementById('voiceModeSelect').addEventListener('change', function(e) {
            voiceMode = parseInt(e.target.value);
            document.getElementById('singleVoiceContainer').style.display = voiceMode === 1 ? 'flex' : 'none';
            document.getElementById('dualVoiceContainer').style.display = voiceMode === 2 ? 'flex' : 'none';
        });
        document.getElementById('voiceSelect')?.addEventListener('change', e => {
            singleVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('oddVoiceSelect')?.addEventListener('change', e => {
            oddVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('evenVoiceSelect')?.addEventListener('change', e => {
            evenVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });

        document.getElementById('playSpeaker').addEventListener('click', ()=>{
            if (!audioEnabled) { startTime = Date.now(); audioEnabled = true; }
            if (currentLessonData && currentLessonData.P5) {
                let gap = parseFloat(document.getElementById('gapTimeSelect').value);
                let loop = parseInt(document.getElementById('loopCountSelect').value);
                playAudioSentences(currentLessonData.P5, gap, loop);
            }
        });
        document.getElementById('pauseAudioBtn').addEventListener('click', ()=>{
            if (isPaused) resumeAudio(); else pauseAudio();
        });
        document.getElementById('stopAudioBtn').addEventListener('click', stopAllAudio);
        document.getElementById('backToMainBtn').addEventListener('click', ()=>{ stopAllAudio(); currentScreen='main'; render(); scrollToTop(); });
        document.getElementById('scrollTopQuiz').addEventListener('click', e=>{ e.preventDefault(); scrollToTop(); });
        document.getElementById('submitQuizBtn').addEventListener('click', ()=>{
            if (userAnswers.filter(a=>a?.chosen).length !== quizData.length) { 
                alert(`Vui lòng trả lời đủ ${quizData.length} câu`); 
                return; 
            }
            endTime = Date.now();
            stopAllAudio();
            currentScreen = 'report';
            render();
            scrollToTop();
        });
    }

    function renderReport() {
        let total = quizData.length;
        let correctCount = userAnswers.filter((ans,i)=> ans?.chosen === quizData[i]?.correct).length;
        let percent = (correctCount/total)*100;
        let color = percent<50?'#f5222d':percent<70?'#faad14':percent<80?'#52c41a':percent<90?'#13c2c2':percent<100?'#1890ff':'#722ed1';
        let startStr = startTime ? new Date(startTime).toLocaleTimeString() : '';
        let endStr = endTime ? new Date(endTime).toLocaleTimeString() : '';
        let streak = 0, maxStreak=0;
        userAnswers.forEach((a,i)=> { if(a?.chosen===quizData[i]?.correct) streak++; else { maxStreak=Math.max(maxStreak,streak); streak=0; } });
        maxStreak=Math.max(maxStreak,streak);
        let totalTime = endTime && startTime ? Math.round((endTime-startTime)/300) : 0;

        let titleBai = selectedBai === 'KIỂM TRA NGẪU NHIÊN' ? 'KIỂM TRA' : selectedBai;
        let passageText = currentLessonData?.P4 || 'Chưa có nội dung';

        let html = `
            <div class="main-card">
                <h2>📊 BÁO CÁO LỚP 5 - ${selectedUnit} - ${titleBai}</h2>
                <div class="title-sub">${selectedDang}</div>
                
                <div class="report-chart-grid">
                    <div class="chart-box">
                        <div style="font-weight:800; font-size:2.4rem; color:blue; margin-bottom:10px;">${studentName}</div>
                        <div class="pie" style="background: conic-gradient(${color} 0deg ${percent*3.6}deg, #e0e0e0 ${percent*3.6}deg 360deg);">
                            <span style="color: ${color};">${Math.round(percent)}%</span>
                        </div>
                        <div style="font-weight:bold; color:#1e3c72; margin-top:15px;">${new Date().toLocaleDateString()}</div>
                    </div>
                    <div class="stats-grid">
                        <div class="stat-item"><div>⏱️ START</div><div>${startStr}</div></div>
                        <div class="stat-item"><div>⌛ END</div><div>${endStr}</div></div>
                        <div class="stat-item"><div>🔗 CHUỖI</div><div>${maxStreak}/${correctCount}/${total}</div></div>
                        <div class="stat-item"><div>⏳ Tổng</div><div>${totalTime}s</div></div>
                    </div>
                </div>

                <div class="audio-panel" id="audioPanelReport">
                    <span class="speaker-icon" id="playSpeakerReport">🔊</span>
                    <select id="gapTimeSelectReport">
                        <option value="0.25">0.25s</option>
                        <option value="0.5" selected>0.5s</option>
                        <option value="0.75">0.75s</option>
                        <option value="1">1s</option>
                        <option value="2">2s</option>
                        <option value="3">3s</option>
                        <option value="4">4s</option>
                        <option value="5">5s</option>
                        <option value="6">6s</option>
                    </select>
                    <select id="loopCountSelectReport">
                        <option value="1" selected>1</option>
                        <option value="2">2</option>
                        <option value="3">3</option>
                        <option value="4">4</option>
                    </select>
                    <button id="pauseAudioBtnReport">⏸️</button><button id="stopAudioBtnReport">⏹️</button>
                </div>
                <div style="display: flex; flex-wrap: wrap; gap: 16px; margin: 10px 0 20px; align-items: center; background: #e0ebf9; padding: 12px 20px; border-radius: 40px;">
                    <label style="font-weight:600;">Số giọng:
                        <select id="voiceModeSelectReport" style="padding:6px 12px;">
                            <option value="1" selected>1 giọng</option>
                            <option value="2">2 giọng</option>
                        </select>
                    </label>
                    <div id="singleVoiceContainerReport" style="display: flex; gap:10px;">
                        <label>Giọng: <select id="voiceSelectReport"></select></label>
                    </div>
                    <div id="dualVoiceContainerReport" style="display: none; gap:10px; flex-wrap:wrap;">
                        <label>Giọng lẻ: <select id="oddVoiceSelectReport"></select></label>
                        <label>Giọng chẵn: <select id="evenVoiceSelectReport"></select></label>
                    </div>
                </div>

                <button class="btn" id="togglePassageBtn">📄 HIỆN đoạn văn P4</button>
                <div id="passageContainer" style="display:none;" class="hidden-passage">${passageText}</div>
                
                <h3>📋 Chi tiết câu hỏi</h3>
                 <table>
                    <thead>
                         <tr><th>STT</th><th>Nội dung</th><th>Đáp án chọn</th><th>Đáp án đúng</th></tr>
                    </thead>
                    <tbody>`;
        quizData.forEach((q,i)=>{
            let chosen = userAnswers[i]?.chosen || '—';
            let correct = q.correct;
            let wrongClass = (chosen !== correct) ? 'wrong-answer' : '';
            html += `<tr><td>${i+1}</td><td>${q.question}</td><td class="${wrongClass}">${chosen}</td><td><span class="correct-answer">${correct}</span></td></tr>`;
        });
        html += `</tbody>
                 </table>
                <br>
                <div class="action-buttons-container">
                    <button class="btn-back" id="backToMainBtnReport">◀ QUAY LẠI</button>
                    <a href="#" class="scroll-top" id="scrollTopReport">⬆️</a>
                </div>
            </div>`;
        app.innerHTML = html;

        // --- XỬ LÝ GIỌNG ĐỌC TRONG REPORT ---
        if (voiceList.length > 0) {
            updateVoiceDropdowns(voiceList[0]);
        } else {
            if (!window.voiceLoadedListenerAdded) {
                const checkVoicesReady = setInterval(() => {
                    if (voiceList.length > 0) {
                        updateVoiceDropdowns(voiceList[0]);
                        clearInterval(checkVoicesReady);
                    }
                }, 200);
                window.voiceLoadedListenerAdded = true;
            }
        }
        
        // Gán trực tiếp vào các element trong Report
        const singleSel = document.getElementById('voiceSelectReport');
        const oddSel = document.getElementById('oddVoiceSelectReport');
        const evenSel = document.getElementById('evenVoiceSelectReport');
        
        const fillReportSelect = (select) => {
            if (!select) return;
            select.innerHTML = '';
            const emptyOpt = document.createElement('option');
            emptyOpt.value = '';
            emptyOpt.textContent = '-- Chọn giọng --';
            select.appendChild(emptyOpt);
            voiceList.forEach(v => {
                let opt = document.createElement('option');
                opt.value = v.voiceURI;
                opt.textContent = `${v.name} (${v.lang})`;
                if (voiceList[0] && v.voiceURI === voiceList[0].voiceURI) opt.selected = true;
                select.appendChild(opt);
            });
        };
        fillReportSelect(singleSel);
        fillReportSelect(oddSel);
        fillReportSelect(evenSel);

        const modeSel = document.getElementById('voiceModeSelectReport');
        const singleDiv = document.getElementById('singleVoiceContainerReport');
        const dualDiv = document.getElementById('dualVoiceContainerReport');
        modeSel.addEventListener('change', e => {
            voiceMode = parseInt(e.target.value);
            singleDiv.style.display = voiceMode === 1 ? 'flex' : 'none';
            dualDiv.style.display = voiceMode === 2 ? 'flex' : 'none';
        });
        document.getElementById('voiceSelectReport')?.addEventListener('change', e => {
            singleVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('oddVoiceSelectReport')?.addEventListener('change', e => {
            oddVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });
        document.getElementById('evenVoiceSelectReport')?.addEventListener('change', e => {
            evenVoice = e.target.value ? voiceList.find(v => v.voiceURI === e.target.value) : null;
        });

        document.getElementById('playSpeakerReport').addEventListener('click', ()=>{
            if (currentLessonData && currentLessonData.P5) {
                let gap = parseFloat(document.getElementById('gapTimeSelectReport').value);
                let loop = parseInt(document.getElementById('loopCountSelectReport').value);
                playAudioSentences(currentLessonData.P5, gap, loop);
            }
        });
        document.getElementById('pauseAudioBtnReport').addEventListener('click', ()=>{
            if (isPaused) resumeAudio(); else pauseAudio();
        });
        document.getElementById('stopAudioBtnReport').addEventListener('click', stopAllAudio);
        document.getElementById('togglePassageBtn').addEventListener('click', ()=>{
            let c = document.getElementById('passageContainer');
            c.style.display = c.style.display === 'none' ? 'block' : 'none';
        });
        document.getElementById('backToMainBtnReport').addEventListener('click', ()=>{ stopAllAudio(); currentScreen='main'; render(); scrollToTop(); });
        document.getElementById('scrollTopReport').addEventListener('click', e=>{ e.preventDefault(); scrollToTop(); });
    }

    function render() {
        if (currentScreen === 'main') renderMain();
        else if (currentScreen === 'quiz') renderQuiz();
        else if (currentScreen === 'report') renderReport();
    }

    render();
</script>
