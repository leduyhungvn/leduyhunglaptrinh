<style>
/* CSS CHUNG */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background-color: #f5f7fa;
color: #333;
line-height: 1.4;
}

.container {
max-width: 1000px;
margin: 0 auto;
padding: 10px;
}

header {
text-align: center;
margin-bottom: 15px;
padding: 15px;
background: linear-gradient(135deg, #1e5799, #207cca);
color: white;
border-radius: 10px;
box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1 {
font-size: 28px;
margin-bottom: 5px;
}

.screen {
display: none;
background-color: white;
border-radius: 10px;
box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
padding: 20px;
margin-bottom: 20px;
}

.active {
display: block;
}

/* Form & Buttons */
.form-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 5px;
font-weight: 600;
color: #2c3e50;
font-size: 16px;
}

input, select {
width: 100%;
padding: 12px;
border: 1px solid #ddd;
border-radius: 5px;
font-size: 16px;
transition: border-color 0.3s;
}

input:focus, select:focus {
border-color: #3498db;
outline: none;
}

.row {
display: flex;
gap: 15px;
margin-bottom: 15px;
}

.col {
flex: 1;
}

.btn {
display: inline-block;
padding: 12px 24px;
background-color: #3498db;
color: white;
border: none;
border-radius: 5px;
font-size: 16px;
cursor: pointer;
transition: background-color 0.3s;
text-align: center;
margin-right: 10px;
margin-top: 10px;
width: 100%;
}

.btn:hover {
background-color: #2980b9;
}

.btn-secondary { background-color: #7f8c8d; }
.btn-success { background-color: #2ecc71; }
.btn-danger { background-color: #e74c3c; }

/* Test Screen */
.test-header-container {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
padding-bottom: 10px;
border-bottom: 1px solid #eee;
}
.test-title { font-size: 20px; font-weight: bold; color: #2c3e50; }
.test-info { display: flex; align-items: center; gap: 10px; }
.timer { text-align: center; font-size: 28px; font-weight: bold; color: #e74c3c; background: #f9f9f9; padding: 5px 10px; border-radius: 5px; }
.question-counter { font-size: 18px; font-weight: bold; }

.question { margin-bottom: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 8px; border-left: 4px solid #3498db; }
.question-number { font-weight: bold; color: #3498db; margin-bottom: 8px; font-size: 20px; }
.question-content { margin-bottom: 12px; font-size: 18px; }
.options { list-style-type: none; }
.option { padding: 10px 15px; margin-bottom: 8px; background-color: white; border-radius: 5px; cursor: pointer; border: 1px solid #e0e0e0; font-size: 18px; transition: all 0.2s; }
.option:hover { background-color: #f0f7ff; border-color: #3498db; }
.option.selected { background-color: #e1f0ff; border-color: #3498db; font-weight: bold; }

/* Badge cho phần câu hỏi */
.part-badge {
display: inline-block;
padding: 2px 8px;
border-radius: 4px;
color: white;
font-size: 12px;
margin-right: 5px;
font-weight: bold;
}
.badge-p1 { background-color: #3498db; } /* Xanh */
.badge-p2 { background-color: #9b59b6; } /* Tím */
.badge-p3 { background-color: #e67e22; } /* Cam */

.notification {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background-color: rgba(46, 204, 113, 0.9); color: white; padding: 15px 30px;
border-radius: 8px; font-size: 18px; font-weight: bold; z-index: 1000; display: none;
}

/* --- RESULT SCREEN STYLES --- */
.result-header { text-align: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
.result-header h2 { font-size: 22px; }

.result-wrapper {
display: flex;
flex-direction: row;
gap: 20px;
align-items: stretch;
}

/* --- Ô 1 (Bên trái) --- */
.result-left {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 15px;
background-color: #fff;
border-radius: 8px;
text-align: center;
}

.student-name-display {
color: #1890ff;
font-weight: bold;
font-size: 50px; 
margin-bottom: 15px;
line-height: 1.1;
}

.chart-container {
position: relative;
width: 200px;
height: 200px;
margin-bottom: 15px;
flex-shrink: 0;
}

.pie-chart {
width: 100%;
height: 100%;
border-radius: 50%;
background: conic-gradient(#eee 0% 100%);
display: flex;
align-items: center;
justify-content: center;
transition: background 1s ease-out;
}

.pie-chart::after {
content: ""; position: absolute; width: 75%; height: 75%;
background-color: white; border-radius: 50%;
}

.chart-center {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
text-align: center; z-index: 10;
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

.percentage-text { display: block; font-size: 40px; font-weight: 800; color: #333; line-height: 1; }
.score-detail-text { display: block; font-size: 20px; font-weight: bold; color: #666; margin-top: 2px; }

.exam-date {
color: #000; font-weight: bold; font-size: 18.5px;
margin-top: auto; padding-top: 10px; border-top: 1px solid #eee; width: 100%;
}

/* --- Ô 2 (Bên phải) --- */
.result-right {
flex: 1;
display: grid;
grid-template-columns: 1fr 1fr;
grid-template-rows: 1fr 1fr;
gap: 10px;
}

.grid-item {
background-color: #f8f9fa;
border-radius: 8px;
padding: 20px; 
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
border: 1px solid #eee;
}

.grid-icon { width: 52px; height: 52px; margin-bottom: 10px; color: #555; }
.grid-label { font-size: 18px; color: #666; margin-bottom: 5px; }
.grid-value { font-size: 27px; color: #333; font-weight: bold; }

.grid-item.time-start .grid-icon { color: #27ae60; }
.grid-item.time-end .grid-icon { color: #e74c3c; }
.grid-item.wrong .grid-icon { color: #e67e22; }
.grid-item.unanswered .grid-icon { color: #95a5a6; }

/* Review List */
.review-list { margin-top: 20px; width: 100%; }
.review-item { padding: 10px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid; background-color: #fff; border: 1px solid #eee; }
.review-item.correct { border-left-color: #2ecc71; background-color: #f0fff4; }
.review-item.incorrect { border-left-color: #e74c3c; background-color: #fff5f5; }
.review-item.unanswered { border-left-color: #95a5a6; background-color: #f8f9fa; }
.review-question-title { font-weight: bold; margin-bottom: 5px; font-size: 16px; }
.review-options { margin-top: 5px; }
.review-option-row { padding: 3px 0; font-size: 14px; }
.review-opt-correct { color: #2ecc71; font-weight: bold; }
.review-opt-wrong { color: #e74c3c; text-decoration: line-through; }

/* --- MOBILE OPTIMIZATION --- */
@media (max-width: 768px) {
.row { flex-direction: column; gap: 10px; }
.btn { padding: 10px; font-size: 14px; }

.result-wrapper { flex-direction: column; gap: 10px; }
.result-left { padding: 10px 5px; }
.student-name-display { font-size: 29px; margin-bottom: 5px; }
.chart-container { width: 140px; height: 140px; margin-bottom: 5px; }
.percentage-text { font-size: 26px; }
.score-detail-text { font-size: 14px; }
.exam-date { font-size: 14px; padding-top: 5px; }

.result-right { width: 100%; gap: 6px; }
.grid-item { padding: 6px; }
.grid-icon { width: 20px; height: 20px; margin-bottom: 2px; }
.grid-label { font-size: 10px; }
.grid-value { font-size: 14px; }

.review-item { padding: 8px; }
.review-question-title { font-size: 14px; }
.review-option-row { font-size: 12px; }
.screen { padding: 10px; margin-bottom: 10px; }
}

/* MathJax */
.math-container { margin: 5px 0; padding: 5px; background-color: rgba(255,255,255,0.9); border-radius: 3px; overflow-x: auto; }
mjx-container { outline: none; }
</style>
</head>

<div class="container">

<!-- Màn hình chính -->

</div>

<p><strong>Thầy Lê Duy Hùng</strong></p>
<p>ZALO: 0967 095 025</p>
<p>FACEBOOK: <a href="https://www.facebook.com/leduyhung.vietnam" target="_blank" style="color:#3498db;">https://www.facebook.com/leduyhung.vietnam</a></p>

</div>

<!-- Màn hình làm bài -->
<div id="test-screen" class="screen">
<div class="test-header-container">

<div class="review-list" id="review-list"></div>

<div style="text-align: center; margin-top: 20px;">

</div>
</div>

function shuffleArray(array) {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

// Hàm chuyển đổi dữ liệu thô sang định dạng hiển thị
function convertQuestionToDisplayFormat(question, partType) {
    const labels = ['A', 'B', 'C', 'D'];
    let options = [];
    let correctAnswer = '';

    // Xử lý P2 (Đúng/Sai)
    if (partType === 'P2') {
        // Câu hỏi Đúng/Sai luôn có 2 đáp án cố định là A: Đúng, B: Sai
        // Dữ liệu đầu vào: correct = "Đúng" hoặc "Sai"
        const isTrue = question.correct === "Đúng";
        
        options = [
            { id: 'A', text: 'Đúng' },
            { id: 'B', text: 'Sai' }
        ];
        
        // Đáp án đúng là A nếu nội dung là Đúng, ngược lại là B
        correctAnswer = isTrue ? 'A' : 'B';
    } 
    // Xử lý P1 và P3 (Trắc nghiệm & Điền khuyết - cấu trúc giống nhau)
    else {
        const allChoices = [
            { text: question.correct, isCorrect: true },
            { text: question.wrong1, isCorrect: false },
            { text: question.wrong2, isCorrect: false },
            { text: question.wrong3, isCorrect: false }
        ].filter(c => c.text && c.text.trim() !== ""); // Lọc bỏ đáp án rỗng nếu có

        const shuffledChoices = shuffleArray([...allChoices]);
        const correctChoice = shuffledChoices.find(choice => choice.isCorrect);
        const correctIndex = shuffledChoices.indexOf(correctChoice);
        
        correctAnswer = labels[correctIndex];
        
        shuffledChoices.forEach((choice, index) => {
            options.push({ id: labels[index], text: choice.text });
        });
    }

    // Tạo ID duy nhất để tránh trùng lặp giữa các phần (Ví dụ: P1-1, P2-1)
    const uniqueId = `${partType}-${question.id}`;

    return {
        id: uniqueId,
        originalId: question.id, // Giữ lại ID gốc để hiển thị nếu cần
        partType: partType,
        content: question.content,
        options: options,
        correctAnswer: correctAnswer
    };
}

// Hàm lấy câu hỏi ngẫu nhiên theo logic mới
function getRandomQuestions(code) {
    const bank = questionBanks[code];
    if (!bank) return [];

    let finalQuestions = [];
    
    // Hàm con để xử lý từng phần
    const processPart = (partData, countNeeded, partType) => {
        if (!partData || partData.length === 0) return [];
        
        // Xáo trộn và lấy số lượng cần thiết (hoặc tất cả nếu ít hơn)
        const shuffled = shuffleArray([...partData]);
        const selected = shuffled.slice(0, Math.min(countNeeded, shuffled.length));
        
        // Chuyển đổi định dạng
        return selected.map(q => convertQuestionToDisplayFormat(q, partType));
    };

    // 1. Lấy 4 câu từ P1
    const p1Questions = processPart(bank.P1, 4, 'P1');
    
    // 2. Lấy 4 câu từ P2
    const p2Questions = processPart(bank.P2, 4, 'P2');
    
    // 3. Lấy 2 câu từ P3
    const p3Questions = processPart(bank.P3, 2, 'P3');

    // Ghép lại theo thứ tự: P1 -> P2 -> P3
    finalQuestions = [...p1Questions, ...p2Questions, ...p3Questions];

    // Gán số thứ tự hiển thị (Display Order)
    finalQuestions.forEach((q, index) => {
        q.displayOrder = index + 1;
    });

    return finalQuestions;
}

function startTest() {
studentName = document.getElementById('student-name').value.trim();
const grade = document.getElementById('grade-select').value;
const term = document.getElementById('term-select').value;
if (!studentName) { alert('Vui lòng nhập họ và tên!'); return; }
if (!grade || !term) { alert('Vui lòng chọn lớp và kỳ ôn tập!'); return; }
if (studentName.length > 40) { alert('Họ và tên không được vượt quá 40 ký tự!'); return; }

// Lấy câu hỏi theo logic mới
currentQuestions = getRandomQuestions(currentTestCode);

if (currentQuestions.length === 0) {
    alert('Kho đề này hiện đang trống. Vui lòng chọn đề khác.');
    return;
}

userAnswers = {};
timeLeft = 600;
testStartTime = new Date();
currentQuestionIndex = 0;
isTransitioning = false;

document.getElementById('test-title').textContent = `${gradeNames[grade]} - ${termNames[term]}`;
renderCurrentQuestion();
startTimer();
showScreen('test-screen');
document.addEventListener('visibilitychange', handleVisibilityChange);
}

function handleVisibilityChange() {
if (document.hidden) { clearInterval(timerInterval); submitTest(); }
}

function startTimer() {
clearInterval(timerInterval);
updateTimerDisplay();
timerInterval = setInterval(() => {
timeLeft--;
updateTimerDisplay();
if (timeLeft <= 0) { clearInterval(timerInterval); submitTest(); }
}, 1000);
}

function updateTimerDisplay() {
const minutes = Math.floor(timeLeft / 60);
const seconds = timeLeft % 60;
document.getElementById('timer').textContent = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
if (timeLeft <= 60) {
document.getElementById('timer').style.color = '#e74c3c';
document.getElementById('timer').style.backgroundColor = '#ffebee';
}
}

function showNotification(message, duration = 1000) {
const notification = document.getElementById('notification');
notification.textContent = message;
notification.style.display = 'block';
setTimeout(() => { notification.style.display = 'none'; }, duration);
}

function getPartBadgeClass(partType) {
    if (partType === 'P1') return 'badge-p1';
    if (partType === 'P2') return 'badge-p2';
    if (partType === 'P3') return 'badge-p3';
    return '';
}

function renderCurrentQuestion() {
const container = document.getElementById('current-question-container');
const question = currentQuestions[currentQuestionIndex];
let optionsHTML = '';

// Hiển thị các đáp án
question.options.forEach(option => {
optionsHTML += `<li class="option" data-question="${question.id}" data-option="${option.id}"><div class="math-container"><strong>${option.id}.</strong> ${option.text}</div></li>`;
});

// Tạo badge tên phần
const partLabel = question.partType === 'P1' ? 'Phần 1' : (question.partType === 'P2' ? 'Phần 2 (Đ/S)' : 'Phần 3 (Điền)');

container.innerHTML = `
    <div class="question">
        <div class="question-number">
            <span class="part-badge ${getPartBadgeClass(question.partType)}">${partLabel}</span>
            Câu ${question.displayOrder} - ${currentTestCode}
        </div>
        <div class="question-content"><div class="math-container">${question.content}</div></div>
        <ul class="options">${optionsHTML}</ul>
    </div>
`;

document.getElementById('current-question-number').textContent = currentQuestionIndex + 1;
document.getElementById('total-questions').textContent = currentQuestions.length;

document.querySelectorAll('.option').forEach(option => {
option.addEventListener('click', function() {
if (isTransitioning) return;
const questionId = this.getAttribute('data-question');
const optionId = this.getAttribute('data-option');
isTransitioning = true;
userAnswers[questionId] = optionId;
showNotification("Đã chọn đáp án!");
setTimeout(() => {
if (currentQuestionIndex >= currentQuestions.length - 1) submitTest();
else { currentQuestionIndex++; renderCurrentQuestion(); isTransitioning = false; }
}, 800);
});
});
if (window.MathJax) setTimeout(() => MathJax.typesetPromise(), 200);
}

function submitTest() {
clearInterval(timerInterval);
testSubmitTime = new Date();
document.removeEventListener('visibilitychange', handleVisibilityChange);
showResults();
}

function getScoreColor(percentage) {
if (percentage >= 0 && percentage <= 49) return '#f5222d';
else if (percentage >= 50 && percentage <= 69) return '#faad14';
else if (percentage >= 70 && percentage <= 79) return '#52c41a';
else if (percentage >= 80 && percentage <= 89) return '#13c2c2';
else if (percentage >= 90 && percentage <= 99) return '#1890ff';
else if (percentage === 100) return '#722ed1';
else return '#e0e0e0';
}

function showResults() {
const grade = document.getElementById('grade-select').value;
const term = document.getElementById('term-select').value;
document.getElementById('result-title').textContent = `${gradeNames[grade]} - ${termNames[term]} - KẾT QUẢ`;
const { correctCount, incorrectCount, unansweredCount, percentage } = calculateScore();
document.getElementById('result-student-name').textContent = studentName;
const scoreChart = document.getElementById('score-chart');
const color = getScoreColor(percentage);
scoreChart.style.background = `conic-gradient(${color} ${percentage}%, #eee ${percentage}% 100%)`;
document.getElementById('score-percentage').textContent = `${percentage}%`;
// Sử dụng currentQuestions.length làm mẫu số (số câu thực tế lấy được)
document.getElementById('score-detail').textContent = `${correctCount}/${currentQuestions.length}`;
document.getElementById('result-date').textContent = `${testSubmitTime.getDate().toString().padStart(2, '0')}/${(testSubmitTime.getMonth() + 1).toString().padStart(2, '0')}/${testSubmitTime.getFullYear()}`;
document.getElementById('start-time-hms').textContent = formatTimeHMS(testStartTime);
document.getElementById('end-time-hms').textContent = formatTimeHMS(testSubmitTime);
document.getElementById('incorrect-count').textContent = `${incorrectCount}/${currentQuestions.length}`;
document.getElementById('unanswered-count').textContent = `${unansweredCount}/${currentQuestions.length}`;
renderReviewQuestions();
showScreen('result-screen');
}

function calculateScore() {
let correctCount = 0, incorrectCount = 0, unansweredCount = 0;
currentQuestions.forEach(question => {
const userAnswer = userAnswers[question.id];
if (!userAnswer) unansweredCount++;
else if (userAnswer === question.correctAnswer) correctCount++;
else incorrectCount++;
});
return { correctCount, incorrectCount, unansweredCount, percentage: currentQuestions.length > 0 ? Math.round((correctCount / currentQuestions.length) * 100) : 0 };
}

function formatTimeHMS(date) {
const h = date.getHours().toString().padStart(2, '0');
const m = date.getMinutes().toString().padStart(2, '0');
const s = date.getSeconds().toString().padStart(2, '0');
return `${h}:${m}:${s}`;
}

function renderReviewQuestions() {
const container = document.getElementById('review-list');
container.innerHTML = '';
currentQuestions.forEach(question => {
const userAnswer = userAnswers[question.id];
const isCorrect = userAnswer === question.correctAnswer;
const isUnanswered = !userAnswer;
let statusClass = isUnanswered ? 'unanswered' : (isCorrect ? 'correct' : 'incorrect');
let optionsHTML = '';
question.options.forEach(option => {
let textStyle = (option.id === question.correctAnswer) ? 'color: #2ecc71; font-weight: bold;' : ((option.id === userAnswer && !isCorrect) ? 'color: #e74c3c; text-decoration: line-through;' : 'color: #000;');
optionsHTML += `<div class="review-option-row" style="${textStyle}"><div class="math-container"><strong>${option.id}.</strong> ${option.text}</div></div>`;
});
const reviewItem = document.createElement('div');
reviewItem.className = `review-item ${statusClass}`;
const partLabel = question.partType === 'P1' ? 'P1' : (question.partType === 'P2' ? 'P2' : 'P3');
reviewItem.innerHTML = `<div class="review-question-title"><span class="part-badge ${getPartBadgeClass(question.partType)}">${partLabel}</span> Câu ${question.displayOrder} - ${currentTestCode}</div><div class="question-content" style="font-size: 16px; margin-bottom: 5px;"><div class="math-container">${question.content}</div></div><div class="review-options">${optionsHTML}</div>`;
container.appendChild(reviewItem);
});
if (window.MathJax) setTimeout(() => MathJax.typesetPromise(), 300);
}

function retryTest() {
// Gọi lại hàm lấy câu hỏi ngẫu nhiên mới
currentQuestions = getRandomQuestions(currentTestCode);
if (currentQuestions.length === 0) {
    alert('Kho đề này hiện đang trống.');
    showScreen('main-screen');
    return;
}
userAnswers = {};
timeLeft = 600;
testStartTime = new Date();
currentQuestionIndex = 0;
isTransitioning = false;
renderCurrentQuestion();
startTimer();
document.addEventListener('visibilitychange', handleVisibilityChange);
showScreen('test-screen');
}

document.addEventListener('DOMContentLoaded', function() {
document.getElementById('grade-select').addEventListener('change', updateTestCode);
document.getElementById('term-select').addEventListener('change', updateTestCode);
document.getElementById('start-btn').addEventListener('click', startTest);
document.getElementById('submit-test-btn').addEventListener('click', submitTest);
document.getElementById('retry-btn').addEventListener('click', retryTest);
document.getElementById('back-btn').addEventListener('click', () => showScreen('main-screen'));
});

const gradeNames = { '1': 'TOÁN LỚP 1', '2': 'TOÁN LỚP 2', '3': 'TOÁN LỚP 3', '4': 'TOÁN LỚP 4', '5': 'TOÁN LỚP 5', '6': 'TOÁN LỚP 6', '7': 'TOÁN LỚP 7', '8': 'TOÁN LỚP 8', '9': 'TOÁN LỚP 9' };
const termNames = { 'GK1': 'GIỮA HỌC KÌ 1', 'HK1': 'CUỐI HỌC KÌ 1', 'GK2': 'GIỮA HỌC KÌ 2', 'HK2': 'CUỐI HỌC KÌ 2' };
</script>
</body>
</html>
