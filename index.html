<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <!-- viewport: chống zoom khi focus input -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Ôn Thi Toán THPT - Chuyên Đề Hàm Số</title>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js" id="MathJax-script" async></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif; }
        input, textarea, select, button { font-size: 16px; }
        body { background: #f0f2f5; margin: 0; padding: 12px; }
        .container { max-width: 1400px; margin: 0 auto; background: white; border-radius: 28px; box-shadow: 0 12px 30px rgba(0,0,0,0.1); padding: 16px; }
        @media (min-width: 768px) {
            body { padding: 20px; }
            .container { padding: 20px 24px; }
        }
        h1, h2, h3 { margin-top: 0; }
        .hidden { display: none !important; }
        .info-card { background: #f9f9ff; border-radius: 20px; padding: 18px; margin-bottom: 20px; border: 1px solid #e6e9f0; }
        button, .btn { background: #2c3e66; color: white; border: none; padding: 10px 20px; border-radius: 40px; font-weight: bold; cursor: pointer; transition: 0.2s; font-size: 1rem; }
        button:hover { background: #1a2a48; transform: scale(0.97); }
        .timer { background: #1e2a3a; color: #ffd966; font-family: monospace; font-size: 1.6rem; font-weight: bold; padding: 8px 16px; border-radius: 60px; display: inline-block; }
        .passage { background: #fef7e0; padding: 18px; border-radius: 18px; border-left: 6px solid #f4b942; font-size: 1.2rem; white-space: pre-wrap; overflow-x: auto; line-height: 1.5; }
        .question-card { background: white; border-radius: 20px; margin-bottom: 20px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); border: 1px solid #e4e9f2; }
        .options { display: flex; flex-direction: column; gap: 12px; margin-top: 16px; }
        .option-row { display: flex; align-items: center; gap: 12px; cursor: pointer; padding: 6px 12px; border-radius: 40px; transition: background 0.1s; }
        .option-row:hover { background: #f0f4ff; }
        .option-row input { width: 18px; height: 18px; margin: 0; cursor: pointer; }
        .option-row label { flex: 1; cursor: pointer; font-weight: normal; }
        .virtual-pad { 
            display: grid; 
            grid-template-columns: repeat(4, 1fr); 
            gap: 10px; 
            max-width: 360px; 
            margin-top: 18px; 
            background: #f5f7fc;
            padding: 12px;
            border-radius: 28px;
        }
        .v-key { 
            background: white; 
            border: 1px solid #ccd7f0; 
            padding: 12px 0; 
            text-align: center; 
            font-weight: bold; 
            font-size: 1.2rem; 
            border-radius: 20px; 
            cursor: pointer; 
            transition: 0.05s linear; 
        }
        .v-key:active { background: #cddaf5; transform: scale(0.96); }
        .report-grid { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 24px; align-items: stretch; }
        .chart-box, .stats-box { flex: 1; min-width: 240px; background: #ffffff; border-radius: 24px; padding: 16px; box-shadow: 0 6px 14px rgba(0,0,0,0.05); text-align: center; display: flex; flex-direction: column; justify-content: center; }
        .chart-container { position: relative; width: 200px; height: 200px; margin: 0 auto; }
        @media (max-width: 600px) {
            .chart-container { width: 160px; height: 160px; }
            .chart-percent-text { font-size: 2.2rem !important; }
        }
        .chart-percent-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); font-size: 2.8rem !important; font-weight: 800; text-align: center; pointer-events: none; white-space: nowrap; }
        .chart-name-above { font-weight: bold; color: #1890ff; margin-bottom: 6px; word-break: break-word; }
        /* Tăng kích thước tên người làm thêm 50% (cỡ 1.5rem -> 2.25rem) */
        .chart-name-above strong { font-size: 2.25rem !important; }
        .chart-date-below { font-weight: bold; color: #1e2a3a; margin-top: 10px; font-size: 0.9rem; }
        
        /* 4 ô nhỏ chia đều khung */
        .mini-cards { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 16px; 
            height: 100%;
            align-items: stretch;
        }
        .mini-item { 
            background: #f8faff; 
            border-radius: 22px; 
            padding: 16px 8px; 
            text-align: center; 
            font-weight: 600; 
            font-size: 0.9rem;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
        }
        .mini-item span { 
            font-size: 1.3rem; 
            font-weight: 800; 
            margin-top: 8px; 
            display: block;
            color: #1e2a3a;
        }
        @media (min-width: 768px) {
            .mini-item { padding: 24px 12px; font-size: 1rem; min-height: 130px; }
            .mini-item span { font-size: 1.6rem; }
        }
        
        .question-review { border-left: 4px solid #aaa; margin: 20px 0; padding: 16px; background: #fefefe; border-radius: 16px; }
        .review-option { display: flex; align-items: flex-start; gap: 12px; padding: 8px 12px; margin: 6px 0; border-radius: 40px; flex-wrap: wrap; }
        .review-option-correct { background: #e8f5e9; color: #2e7d32; }
        .review-option-wrong { background: #ffebee; color: #c62828; text-decoration: line-through; }
        .highlight-correct-answer { background: #e8f5e9; color: #2e7d32; font-weight: bold; border-left: 3px solid #2e7d32; }
        .mark-icon { font-weight: bold; min-width: 28px; font-size: 1.2rem; }
        footer { margin-top: 30px; font-size: 0.85rem; text-align: center; border-top: 1px solid #ddd; padding-top: 18px; color: #4a627a; }
        
        /* LAYOUT LÀM BÀI */
        .exam-wrapper {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 120px);
            min-height: 450px;
            overflow: hidden;
        }
        .exam-header { flex-shrink: 0; margin-bottom: 12px; }
        .exam-scroll-area { flex: 1; overflow-y: auto; overflow-x: hidden; padding-right: 4px; }
        .exam-layout { display: flex; flex-direction: column; gap: 16px; }
        @media (min-width: 768px) and (orientation: landscape) {
            .exam-layout { flex-direction: row; align-items: flex-start; gap: 24px; }
            .exam-passage-col { flex: 0 0 40%; width: 40%; position: sticky; top: 0; display: flex; flex-direction: column; }
            .exam-questions-col { flex: 0 0 58%; width: 58%; }
            .exam-wrapper { height: calc(100vh - 140px); }
        }
        @media (max-width: 767px) {
            .exam-wrapper { height: auto; min-height: 70vh; }
            .exam-scroll-area { overflow-y: visible; }
            .exam-layout { flex-direction: column; gap: 12px; }
            .exam-passage-col, .exam-questions-col { width: 100%; }
            .passage { font-size: 1rem; padding: 14px; }
            .timer { font-size: 1.2rem; padding: 6px 12px; }
            .question-progress { font-size: 0.8rem; }
        }
        @media (max-width: 767px) and (orientation: landscape) {
            .exam-layout { flex-direction: row; align-items: flex-start; gap: 16px; }
            .exam-passage-col { flex: 0 0 45%; width: 45%; }
            .exam-questions-col { flex: 0 0 52%; width: 52%; }
            .exam-wrapper { height: calc(100vh - 100px); }
            .passage { font-size: 0.95rem; padding: 12px; }
        }
        .exam-passage-col .passage { margin-bottom: 12px; }
        .ans-input { width: 100%; padding: 12px 16px; font-size: 16px; border-radius: 40px; border: 1px solid #ccc; margin: 10px 0; }
        .report-header { text-align: center; margin-bottom: 16px; }
        .report-main-title { font-size: 1.6rem; font-weight: bold; color: #0b2b44; margin-bottom: 4px; }
        .report-sub-title { font-size: 1rem; font-weight: 500; color: #2c3e66; border-top: 2px solid #e0e7f0; display: inline-block; padding-top: 4px; }
        .submit-btn-container { margin-top: 12px; width: 100%; }
        .question-progress { font-size: 0.85rem; color: #2c3e66; margin-bottom: 10px; font-weight: 500; }
        
        .report-review-wrapper {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 10px;
            max-height: 60vh;
            overflow-y: auto;
            padding-right: 4px;
        }
        @media (min-width: 768px) and (orientation: landscape) {
            .report-review-wrapper { flex-direction: row; align-items: flex-start; gap: 24px; }
            .report-passage-col { flex: 0 0 40%; width: 40%; position: sticky; top: 0; }
            .report-answers-col { flex: 0 0 58%; width: 58%; }
        }
        @media (max-width: 767px) and (orientation: landscape) {
            .report-review-wrapper { flex-direction: row; gap: 16px; }
            .report-passage-col { flex: 0 0 45%; width: 45%; }
            .report-answers-col { flex: 0 0 52%; width: 52%; }
        }
        @media (max-width: 767px) {
            .report-review-wrapper { flex-direction: column; max-height: none; }
            .report-passage-col, .report-answers-col { width: 100%; }
        }
        .answers-list { display: flex; flex-direction: column; gap: 16px; }
    </style>
</head>
<body>
<div class="container" id="app">
    <!-- GIAO DIỆN 1 -->
    <div id="screen1">
        <h1 style="color:#0b2b44; font-size: 1.6rem;">📚 ÔN THI TOÁN THPT THEO CHUYÊN ĐỀ</h1>
        <div class="info-card">
            <label>👤 Tên người làm (≤40 ký tự): </label>
            <input type="text" id="studentName" maxlength="40" placeholder="Ví dụ: Nguyễn Văn A" style="width:100%; padding:10px; margin:8px 0; border-radius:30px; border:1px solid #ccc; font-size:16px;">
            <label>📂 Chọn Chuyên đề: </label>
            <select id="chuyenDeSelect" style="width:100%; padding:10px; margin:8px 0; border-radius:30px; font-size:16px;">
                <option value="CD1">Chuyên Đề 1</option>
                <option value="CD2">Chuyên Đề 2</option>
                <option value="CD3">Chuyên Đề 3</option>
                <option value="CD4">Chuyên Đề 4</option>
                <option value="CD5">Chuyên Đề 5</option>
                <option value="CD6">Chuyên Đề 6</option>
                <option value="CD7">Chuyên Đề 7</option>
                <option value="CD8">Chuyên Đề 8</option>
                <option value="CD9">Chuyên Đề 9</option>
                <option value="CD10">Chuyên Đề 10</option>
            </select>
            <button id="startExamBtn" style="margin-top:16px; width:100%;">✅ LÀM BÀI</button>
        </div>
        <footer>📞 THÔNG TIN LIÊN HỆ<br>Thầy Hùng<br>** Zalo: 0967.095.025<br>** Facebook: leduyhung.vietnam</footer>
    </div>

    <!-- GIAO DIỆN 2 - LÀM BÀI (1 câu/lần, nút nộp bài ở cuối ô passage) -->
    <div id="screen2" class="hidden">
        <div class="exam-wrapper">
            <div class="exam-header">
                <div style="display:flex; justify-content:space-between; flex-wrap:wrap; align-items:center; gap:8px;">
                    <h2 id="subTitleCD" style="font-size:1.2rem;">CHUYÊN ĐỀ 1</h2>
                    <div class="timer" id="timerDisplay">20:00</div>
                </div>
            </div>
            <div class="exam-scroll-area">
                <div class="exam-layout" id="examLayout">
                    <div class="exam-passage-col">
                        <div class="passage" id="passageArea"></div>
                        <div class="submit-btn-container">
                            <button id="submitExamBtn" style="background:#b23c1c; width:100%; padding: 12px;">📤 NỘP BÀI</button>
                        </div>
                    </div>
                    <div class="exam-questions-col">
                        <div id="questionsList"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- GIAO DIỆN 3 - BÁO CÁO -->
    <div id="screen3" class="hidden">
        <div class="report-header">
            <div class="report-main-title">ÔN THI TOÁN THPT THEO CHUYÊN ĐỀ</div>
            <div class="report-sub-title" id="reportSubTitle">BÁO CÁO CHI TIẾT - CHUYÊN ĐỀ 1</div>
        </div>
        <div class="report-grid">
            <div class="chart-box">
                <div id="chartNameAbove" class="chart-name-above"></div>
                <div class="chart-container">
                    <canvas id="scoreChart" width="200" height="200" style="width:100%; height:100%;"></canvas>
                    <div id="chartPercentText" class="chart-percent-text">0%</div>
                </div>
                <div id="chartDateBelow" class="chart-date-below"></div>
            </div>
            <div class="stats-box">
                <div class="mini-cards">
                    <div class="mini-item" style="background:#e6f7ff;">⏱️ START<br><span id="statStart">--:--:--</span></div>
                    <div class="mini-item" style="background:#fff7e6;">⏲️ END<br><span id="statEnd">--:--:--</span></div>
                    <div class="mini-item" style="background:#f6ffed;">🏆 CHUỖI / ĐÚNG / TỔNG<br><span id="statStreak">0/0/0</span></div>
                    <div class="mini-item" style="background:#f9f0ff;">⏱️ TỔNG THỜI GIAN<br><span id="totalTimeSpent">0s</span></div>
                </div>
            </div>
        </div>
        <div class="report-review-wrapper">
            <div class="report-passage-col">
                <div class="passage" id="reportPassageArea"></div>
            </div>
            <div class="report-answers-col">
                <div id="reviewDetails" class="answers-list"></div>
            </div>
        </div>
        <div style="display: flex; gap:16px; margin-top:20px; justify-content:center; flex-wrap:wrap;"><button id="retryBtn">🔄 LÀM LẠI</button><button id="backToStartBtn">🔙 QUAY LẠI</button></div>
    </div>
</div>

<script>
    // ======================= DỮ LIỆU (GIỮ NGUYÊN) =======================
    const QUESTION_BANK = {
        CD1: {
            C1: {
                id: "C1",
                passage: "Cho bảng biến thiên sau: \\[\\begin{array}{c|ccccccc} x & -\\infty & & 0 & & 2 & & +\\infty \\\\ \\hline y' & & + & 0 & - & 0 & + & \\\\ \\hline y & & & 2 & & & & +\\infty \\\\ & & \\nearrow & & \\searrow & & \\nearrow & \\\\ & -\\infty & & & & -2 & & \\end{array}\\]",
                P1: [
                    {id:1, content:"Từ bảng biến thiên, hàm số đồng biến trên khoảng nào?", correct:"\\( (-\\infty;0) \\) v\\(\\grave{a}\\) \\((2;+\\infty) \\)", wrong1:"\\( (0;2) \\)", wrong2:"\\( (-\\infty;+\\infty) \\)", wrong3:"\\( (0;+\\infty) \\)"},
                    {id:2, content:"Giá trị cực đại của hàm số là:", correct:"2", wrong1:"-2", wrong2:"0", wrong3:"+\\infty"},
                    {id:3, content:"Hàm số nghịch biến trên khoảng:", correct:"\\( (0;2) \\)", wrong1:"\\( (-\\infty;0) \\)", wrong2:"\\( (2;+\\infty) \\)", wrong3:"\\( (-2;2) \\)"},
                    {id:4, content:"Hệ số a của hàm số \\( y = ax^3 + bx^2 + cx + d \\) có dấu:", correct:"Dương", wrong1:"Âm", wrong2:"Không xác định", wrong3:"Bằng 0"},
                    {id:5, content:"Tổng các giá trị cực đại và cực tiểu của hàm số là:", correct:"0", wrong1:"2", wrong2:"-2", wrong3:"4"},
                    {id:6, content:"Đồ thị hàm số cắt trục tung tại điểm có tung độ:", correct:"2", wrong1:"0", wrong2:"-2", wrong3:"3"},
                    {id:7, content:"Số giao điểm của đồ thị với trục hoành là:", correct:"3", wrong1:"1", wrong2:"2", wrong3:"0"},
                    {id:8, content:"Phương trình \\( y' = 0 \\) có:", correct:"2 nghi\u1ec7m ph\u00e2n bi\u1ec7t", wrong1:"V\u00f4 nghi\u1ec7m", wrong2:"1 nghi\u1ec7m", wrong3:"Nghi\u1ec7m k\u00e9p"},
                    {id:9, content:"Điểm cực đại của hàm số là:", correct:"\\( x = 0 \\)", wrong1:"\\( x = 2 \\)", wrong2:"\\( x = -2 \\)", wrong3:"\\( x = 1 \\)"},
                    {id:10, content:"Hàm số đạt cực tiểu tại:", correct:"\\( x = 2 \\)", wrong1:"\\( x = 0 \\)", wrong2:"\\( x = -2 \\)", wrong3:"\\( x = 1 \\)"},
                    {id:11, content:"Giá trị của \\( y \\) khi \\( x = 0 \\) là:", correct:"2", wrong1:"0", wrong2:"-2", wrong3:"1"},
                    {id:12, content:"Giá trị của \\( y \\) khi \\( x = 2 \\) là:", correct:"-2", wrong1:"2", wrong2:"0", wrong3:"4"},
                    {id:13, content:"Đạo hàm \\( y' \\) của hàm số \\( y = x^3 - 3x^2 + 2 \\) là:", correct:"\\( 3x^2 - 6x \\)", wrong1:"\\( 3x^2 + 6x \\)", wrong2:"\\( -3x^2 + 6x \\)", wrong3:"\\( -3x^2 - 6x \\)"},
                    {id:14, content:"Hệ số b trong hàm số \\( y = x^3 - 3x^2 + 2 \\) là:", correct:"-3", wrong1:"3", wrong2:"0", wrong3:"2"},
                    {id:15, content:"Hệ số c trong hàm số \\( y = x^3 - 3x^2 + 2 \\) là:", correct:"0", wrong1:"-3", wrong2:"2", wrong3:"1"},
                    {id:16, content:"Hệ số tự do d của hàm số \\( y = x^3 - 3x^2 + 2 \\) là:", correct:"2", wrong1:"0", wrong2:"-2", wrong3:"1"},
                    {id:17, content:"Tổng hoành độ hai điểm cực trị bằng:", correct:"2", wrong1:"0", wrong2:"1", wrong3:"3"},
                    {id:18, content:"Khoảng cách giữa hai điểm cực trị trên trục hoành là:", correct:"2", wrong1:"0", wrong2:"1", wrong3:"3"},
                    {id:19, content:"Trung điểm của hai điểm cực trị có hoành độ bằng:", correct:"1", wrong1:"0", wrong2:"2", wrong3:"-1"},
                    {id:20, content:"Giới hạn \\( \\lim_{x \\to -\\infty} y \\) là:", correct:"-\\infty", wrong1:"+\\infty", wrong2:"0", wrong3:"2"}
                ],
                P2: [
                    {id:1, content:"Hàm số có bậc là 3.", correct:"true"},{id:2, content:"Điểm cực tiểu có hoành độ bằng 2.", correct:"true"},{id:3, content:"Giá trị cực đại lớn hơn giá trị cực tiểu.", correct:"true"},{id:4, content:"Hàm số đồng biến trên khoảng (0;2).", correct:"false"},{id:5, content:"Hệ số a của hàm số âm.", correct:"false"},{id:6, content:"Đồ thị hàm số có đúng 2 giao điểm với trục hoành.", correct:"false"},{id:7, content:"Phương trình y' = 0 có nghiệm kép.", correct:"false"},{id:8, content:"Hàm số có tâm đối xứng là điểm I(1;0).", correct:"true"},{id:9, content:"Hàm số lẻ.", correct:"false"},{id:10, content:"Đạo hàm cấp hai y'' = 6x - 6.", correct:"true"},{id:11, content:"Tổng giá trị cực đại và cực tiểu bằng 0.", correct:"true"},{id:12, content:"Hàm số đạt cực trị tại x = 0 và x = 2.", correct:"true"},{id:13, content:"Giá trị cực tiểu bằng 2.", correct:"false"},{id:14, content:"Hệ số b của hàm số y = x^3 - 3x^2 + 2 là -3.", correct:"true"},{id:15, content:"Hệ số c của hàm số trên là 0.", correct:"true"},{id:16, content:"Đồ thị cắt trục tung tại điểm có tung độ dương.", correct:"true"},{id:17, content:"Trên khoảng (2;+∞), hàm số nghịch biến.", correct:"false"},{id:18, content:"Điểm uốn của đồ thị không thuộc trục hoành.", correct:"false"},{id:19, content:"Hàm số đồng biến trên (-∞;0).", correct:"true"},{id:20, content:"Hàm số y = -x^3 + 3x^2 - 2 có cùng bảng biến thiên.", correct:"false"}
                ],
                P3: [
                    {id:1, content:"Tổng hệ số a + b + c + d của hàm số y = ax^3 + bx^2 + cx + d là ...", answerType:"int", correct:0},{id:2, content:"Giá trị của y''(1) là ...", answerType:"int_zero", correct:0},{id:3, content:"Tích hoành độ hai điểm cực trị là ...", answerType:"int", correct:0},{id:4, content:"Giá trị nhỏ nhất của hàm số trên [0;3] là ...", answerType:"int_neg", correct:-2},{id:5, content:"Giá trị lớn nhất của hàm số trên [-1;1] là ...", answerType:"int_pos", correct:2},{id:6, content:"Số đường tiệm cận của đồ thị hàm số là ...", answerType:"int_pos", correct:0},{id:7, content:"y(1,2), làm tròn đến hàng phần trăm là ...", answerType:"float_neg", correct:-0.59, decimals:2},{id:8, content:"y'(0,5), làm tròn đến hàng phần chục là ...", answerType:"float_neg", correct:-2.3, decimals:1},{id:9, content:"Khoảng cách từ điểm cực đại đến đường y = -1 (theo phương thẳng đứng), làm tròn đến hàng phần trăm là ...", answerType:"float_pos", correct:3.00, decimals:2},{id:10, content:"Tung độ giao điểm của đồ thị với đường thẳng x = 1,5, làm tròn đến hàng phần chục là ...", answerType:"float_neg", correct:-1.4, decimals:1},{id:11, content:"Trung bình cộng của y(0,2) và y(1,8), làm tròn đến hàng phần trăm là ...", answerType:"float_pos", correct:0.00, decimals:2},{id:12, content:"Hoành độ điểm có tung độ bằng 1 (khác 0), làm tròn đến hàng phần chục là ...", answerType:"float_pos", correct:2.4, decimals:1},{id:13, content:"y'(1,5), làm tròn đến hàng phần trăm là ...", answerType:"float_neg", correct:-2.25, decimals:2},{id:14, content:"y(0,6), làm tròn đến hàng phần chục là ...", answerType:"float_neg", correct:1.1, decimals:1},{id:15, content:"Nghiệm lớn hơn 2 của phương trình y = 3, làm tròn đến hàng phần trăm là ...", answerType:"float_pos", correct:3.10, decimals:2},{id:16, content:"Khoảng cách từ điểm uốn đến đường y = 0,5 (theo phương thẳng đứng), làm tròn đến hàng phần chục là ...", answerType:"float_pos", correct:0.5, decimals:1},{id:17, content:"Tổng hoành độ các giao điểm của đồ thị với trục hoành là ...", answerType:"int", correct:3},{id:18, content:"Giá trị của y tại x = -1 là ...", answerType:"int_neg", correct:-2},{id:19, content:"y'(-0,5), làm tròn đến hàng phần chục là ...", answerType:"float_pos", correct:3.8, decimals:1},{id:20, content:"Giá trị của biểu thức y(0) + y(2) + y(1) là ...", answerType:"int", correct:0}
                ]
            },
            C2: {
                id: "C2",
                passage: "Cho bảng biến thiên sau: \\[\\begin{array}{c|ccccccc} x & -\\infty & & 0 & & 2 & & +\\infty \\\\ \\hline y' & & - & 0 & + & 0 & - & \\\\ \\hline y & +\\infty & & & & 2 & & \\\\ & & \\searrow & & \\nearrow & & \\searrow & \\\\ & & & -2 & & & & -\\infty \\end{array}\\]",
                P1: [{id:1, content:"Từ bảng biến thiên, hàm số nghịch biến trên khoảng nào?", correct:"\\( (-\\infty;0) \\) v\\(\\grave{a}\\) \\((2;+\\infty) \\)", wrong1:"\\( (0;2) \\)", wrong2:"\\( (-\\infty;+\\infty) \\)", wrong3:"\\( (0;+\\infty) \\)"},{id:2, content:"Giá trị cực đại của hàm số là:", correct:"2", wrong1:"-2", wrong2:"0", wrong3:"+\\infty"}],
                P2: [{id:1, content:"Hàm số có bậc là 3.", correct:"true"}],
                P3: [{id:1, content:"Tổng hệ số a+b+c+d là ...", answerType:"int", correct:0}]
            }
        },
        CD2: { B1: { id:"CD2_B1", passage: "Chuyên đề 2 đang cập nhật", P1: [], P2: [], P3: [] } },
        CD3: { B1: { id:"CD3_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }, CD4: { B1: { id:"CD4_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }, CD5: { B1: { id:"CD5_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }, CD6: { B1: { id:"CD6_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }, CD7: { B1: { id:"CD7_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }, CD8: { B1: { id:"CD8_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }, CD9: { B1: { id:"CD9_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }, CD10: { B1: { id:"CD10_B1", passage: "Chưa có dữ liệu", P1: [], P2: [], P3: [] } }
    };

    function getRandomItems(arr, count) { if(!arr.length) return []; let shuffled = [...arr]; for(let i=shuffled.length-1;i>0;i--){ let j=Math.floor(Math.random()*(i+1)); [shuffled[i],shuffled[j]]=[shuffled[j],shuffled[i]]; } return shuffled.slice(0, count); }
    
    let currentExamData = null, timerInterval = null, timeLeft = 1200, examActive = false, submitted = false;
    let questionsList = [], userAnswers = [], startTime = null, endTime = null, currentQIndex = 0;
    
    function renderMath() { if(window.MathJax) MathJax.typesetPromise(); }
    
    function renderCurrentQuestion() {
        if(!questionsList.length) return;
        const q = questionsList[currentQIndex];
        const total = questionsList.length;
        let html = `<div class="question-progress">📌 Câu ${currentQIndex+1} / ${total}</div>`;
        html += `<div class="question-card"><strong>Câu ${currentQIndex+1} (${q.idMeta})</strong><br>`;
        html += `<div class="math-content">${q.content}</div><div class="options">`;
        if(q.part === "P1") {
            let opts = [
                { key: 'A', value: q.correct },
                { key: 'B', value: q.wrong1 },
                { key: 'C', value: q.wrong2 },
                { key: 'D', value: q.wrong3 }
            ];
            opts.sort(()=>Math.random()-0.5);
            opts.forEach(opt => {
                let checked = (userAnswers[currentQIndex] === opt.value) ? 'checked' : '';
                html += `<label class="option-row"><input type="radio" name="currentQ" value="${opt.value.replace(/"/g, '&quot;')}" ${checked}> <span><strong>${opt.key}.</strong> ${opt.value}</span></label>`;
            });
            html += `</div></div>`;
        } else if(q.part === "P2") {
            let trueChecked = (userAnswers[currentQIndex] === 'true') ? 'checked' : '';
            let falseChecked = (userAnswers[currentQIndex] === 'false') ? 'checked' : '';
            html += `<label class="option-row"><input type="radio" name="currentQ" value="true" ${trueChecked}> <span>Đúng</span></label>`;
            html += `<label class="option-row"><input type="radio" name="currentQ" value="false" ${falseChecked}> <span>Sai</span></label>`;
            html += `</div></div>`;
        } else {
            let val = userAnswers[currentQIndex] !== undefined ? userAnswers[currentQIndex] : '';
            html += `<input type="text" id="p3input" class="ans-input" placeholder="Nhập đáp số..." value="${val}" inputmode="decimal">`;
            html += `<div class="virtual-pad" id="virtualPad"></div></div></div>`;
        }
        document.getElementById("questionsList").innerHTML = html;
        renderMath();
        if(q.part === "P1" || q.part === "P2") {
            let radios = document.querySelectorAll(`input[name="currentQ"]`);
            radios.forEach(r => r.addEventListener("change", (e) => { 
                userAnswers[currentQIndex] = e.target.value;
                setTimeout(() => { if(examActive && !submitted && currentQIndex+1 < questionsList.length) { currentQIndex++; renderCurrentQuestion(); } }, 400);
            }));
        } else if(q.part === "P3") {
            const inputElem = document.getElementById("p3input");
            const padDiv = document.getElementById("virtualPad");
            if(padDiv) {
                let keys = ['7','8','9','-', '4','5','6','.', '1','2','3','/', '⌫','0','C','OK'];
                padDiv.innerHTML = '';
                keys.forEach(k => {
                    let btn = document.createElement('div'); btn.className='v-key'; btn.innerText=k;
                    btn.onclick = () => { 
                        if(!inputElem) return; 
                        if(k === 'OK') { 
                            userAnswers[currentQIndex] = inputElem.value;
                            if(examActive && !submitted && currentQIndex+1 < questionsList.length) { currentQIndex++; renderCurrentQuestion(); }
                        } else if(k === '⌫') inputElem.value = inputElem.value.slice(0,-1);
                        else if(k === 'C') inputElem.value = '';
                        else inputElem.value += k; 
                        userAnswers[currentQIndex] = inputElem.value;
                    };
                    padDiv.appendChild(btn);
                });
            }
            if(inputElem) inputElem.addEventListener("input", (e) => { userAnswers[currentQIndex] = e.target.value; });
        }
    }
    
    function forceEnd() { if(!submitted && examActive) { submitted=true; examActive=false; clearInterval(timerInterval); endTime=new Date(); buildReportAndShow(); } }
    
    function buildReportAndShow() {
        let attemptedIndices = [];
        for(let i=0;i<questionsList.length;i++){ let ans = userAnswers[i]; if(ans !== undefined && ans !== null && ans !== '') attemptedIndices.push(i); }
        let correct = 0;
        let detailsForReview = [];
        for(let idx of attemptedIndices){
            let q=questionsList[idx], u=userAnswers[idx], ok=false;
            if(q.part==="P1") ok=(u===q.correct);
            else if(q.part==="P2") ok=(u===q.correct);
            else { let nu=parseFloat(u), nc=parseFloat(q.correct); ok=(!isNaN(nu) && !isNaN(nc) && Math.abs(nu-nc)<0.001); }
            if(ok) correct++;
            detailsForReview.push({q, u, ok, correctAns: q.correct, originalIndex: idx});
        }
        let totalAttempted = attemptedIndices.length;
        let percent = totalAttempted === 0 ? 0 : (correct/totalAttempted)*100;
        let percentInt = Math.round(percent);
        let color = percent<50?"#f5222d": percent<70?"#faad14": percent<80?"#52c41a": percent<90?"#13c2c2": percent<100?"#1890ff":"#722ed1";
        let studentName = document.getElementById("studentName").value.trim() || "Người làm";
        // Tăng kích thước tên 50% so với 1.5rem -> 2.25rem (đã có CSS .chart-name-above strong)
        document.getElementById("chartNameAbove").innerHTML = `<strong style="color:#1890ff;">${studentName}</strong>`;
        document.getElementById("chartPercentText").innerHTML = `${percentInt}%`;
        document.getElementById("chartPercentText").style.color = color;
        let todayStr = new Date().toLocaleDateString("vi-VN");
        document.getElementById("chartDateBelow").innerHTML = `<strong>${todayStr} - ${totalAttempted}/${questionsList.length} câu</strong>`;
        let ctx = document.getElementById('scoreChart').getContext('2d');
        if(window.myChart) window.myChart.destroy();
        window.myChart = new Chart(ctx, { type: 'doughnut', data: { labels: ['Đúng', 'Sai'], datasets: [{ data: [correct, totalAttempted-correct], backgroundColor: [color, '#e0e0e0'], borderWidth: 0 }] }, options: { cutout: '70%', plugins: { tooltip: { callbacks: { label: (ctx) => `${ctx.raw} câu` } }, legend: { display: false } } } });
        document.getElementById("statStart").innerText = startTime?startTime.toLocaleTimeString():"--";
        document.getElementById("statEnd").innerText = endTime?endTime.toLocaleTimeString():new Date().toLocaleTimeString();
        let totalSec = Math.floor(((endTime||new Date())-startTime)/1000);
        document.getElementById("totalTimeSpent").innerText = `${Math.floor(totalSec/60)}m ${totalSec%60}s`;
        let longest=0,cur=0;
        for(let i=0;i<questionsList.length;i++){
            let ans = userAnswers[i];
            if(ans !== undefined && ans !== null && ans !== ''){
                let qq=questionsList[i];
                let ok = (qq.part==="P1")? (ans===qq.correct) : (qq.part==="P2")? (ans===qq.correct) : (Math.abs(parseFloat(ans)-parseFloat(qq.correct))<0.001);
                if(ok){ cur++; longest=Math.max(longest,cur); } else cur=0;
            } else cur=0;
        }
        document.getElementById("statStreak").innerHTML = `${longest}/${correct}/${questionsList.length}`;
        document.getElementById("reportPassageArea").innerHTML = currentExamData?.passage || "";
        let answersHtml = '';
        for(let d of detailsForReview){
            let q = d.q;
            let isCorrect = d.ok;
            let borderColor = isCorrect ? "#2e7d32" : "#c62828";
            answersHtml += `<div class="question-review" style="border-left-color: ${borderColor};">`;
            answersHtml += `<strong>${isCorrect ? "✓" : "✗"} Câu ${d.originalIndex+1} (${q.idMeta})</strong><br>`;
            answersHtml += `<div style="margin: 8px 0;"><strong class="math-content">${q.content}</strong></div>`;
            if(q.part === "P1") {
                let allOptions = [{ key: 'A', value: q.correct },{ key: 'B', value: q.wrong1 },{ key: 'C', value: q.wrong2 },{ key: 'D', value: q.wrong3 }];
                for(let opt of allOptions) {
                    let isUserChoice = (d.u === opt.value);
                    let isCorrectChoice = (q.correct === opt.value);
                    let markIcon = "", optClass = "review-option";
                    if(isCorrectChoice) markIcon = "✓ ";
                    if(isUserChoice && isCorrectChoice) optClass += " review-option-correct";
                    else if(isUserChoice && !isCorrectChoice) optClass += " review-option-wrong";
                    else if(isCorrectChoice && !isCorrect) optClass += " highlight-correct-answer";
                    answersHtml += `<div class="${optClass}"><span class="mark-icon">${markIcon}</span><strong>${opt.key}.</strong> ${opt.value}</div>`;
                }
                if(!isCorrect && d.u) answersHtml += `<div class="review-option highlight-correct-answer"><span class="mark-icon">✓</span> Đáp án đúng: ${q.correct}</div>`;
            } else if(q.part === "P2") {
                let userChoiceText = d.u === "true" ? "Đúng" : "Sai";
                let correctText = q.correct === "true" ? "Đúng" : "Sai";
                answersHtml += `<div class="review-option"><span class="mark-icon">${isCorrect?"✓":"✗"}</span> Lựa chọn của bạn: <strong>${userChoiceText}</strong></div>`;
                answersHtml += `<div class="review-option highlight-correct-answer"><span class="mark-icon">✓</span> Đáp án đúng: ${correctText}</div>`;
            } else {
                answersHtml += `<div class="review-option"><span class="mark-icon">${isCorrect?"✓":"✗"}</span> Đáp án đã nhập: <strong>${d.u || "(chưa nhập)"}</strong></div>`;
                answersHtml += `<div class="review-option highlight-correct-answer"><span class="mark-icon">✓</span> Đáp án đúng: ${d.correctAns}</div>`;
            }
            answersHtml += `</div>`;
        }
        if(detailsForReview.length === 0) answersHtml = `<div class="info-card">⚠️ Bạn chưa làm câu nào.</div>`;
        document.getElementById("reviewDetails").innerHTML = answersHtml;
        let titleCD = document.getElementById("subTitleCD").innerText;
        document.getElementById("reportSubTitle").innerHTML = `BÁO CÁO CHI TIẾT - ${titleCD}`;
        renderMath();
        switchScreen(3);
    }
    
    function switchScreen(num) {
        document.getElementById("screen1").classList.add("hidden");
        document.getElementById("screen2").classList.add("hidden");
        document.getElementById("screen3").classList.add("hidden");
        if(num===1) document.getElementById("screen1").classList.remove("hidden");
        else if(num===2) document.getElementById("screen2").classList.remove("hidden");
        else document.getElementById("screen3").classList.remove("hidden");
        renderMath();
    }
    
    function startExamProcess(examData) {
        if(timerInterval) clearInterval(timerInterval);
        questionsList = examData.questions;
        userAnswers = new Array(questionsList.length).fill(undefined);
        examActive = true; submitted = false; timeLeft = 20*60; startTime = new Date(); currentQIndex = 0;
        currentExamData = examData;
        document.getElementById("passageArea").innerHTML = examData.passage;
        renderCurrentQuestion();
        timerInterval = setInterval(()=>{ if(examActive && !submitted){ if(timeLeft<=0) forceEnd(); else { timeLeft--; let m=Math.floor(timeLeft/60), s=timeLeft%60; document.getElementById("timerDisplay").innerText=`${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; } } },1000);
        const handleBlur = () => { if(examActive && !submitted) forceEnd(); };
        document.addEventListener("visibilitychange", handleBlur);
        window.addEventListener("blur", handleBlur);
    }
    
    document.getElementById("startExamBtn").addEventListener("click",()=>{
        let name = document.getElementById("studentName").value.trim();
        if(name===""){ alert("Vui lòng nhập tên"); return; }
        let selected = document.getElementById("chuyenDeSelect").value;
        let topic = QUESTION_BANK[selected];
        if(!topic || Object.keys(topic).length===0){ alert(`Chuyên đề ${selected} chưa có thông tin đề thi.`); return; }
        let boList = Object.values(topic);
        let randomBo = boList[Math.floor(Math.random() * boList.length)];
        if(randomBo.P1.length===0 && randomBo.P2.length===0 && randomBo.P3.length===0 && selected!=="CD1"){ alert(`Chuyên đề ${selected} chưa có câu hỏi.`); return; }
        let p1sel = getRandomItems(randomBo.P1,10), p2sel = getRandomItems(randomBo.P2,5), p3sel = getRandomItems(randomBo.P3,5);
        p1sel.sort(()=>Math.random()-0.5); p2sel.sort(()=>Math.random()-0.5); p3sel.sort(()=>Math.random()-0.5);
        let allQ = [];
        p1sel.forEach((q,i)=> allQ.push({...q, part:"P1", idMeta:`${randomBo.id || 'C?'}-P1-${q.id}`}));
        p2sel.forEach((q,i)=> allQ.push({...q, part:"P2", idMeta:`${randomBo.id || 'C?'}-P2-${q.id}`}));
        p3sel.forEach((q,i)=> allQ.push({...q, part:"P3", idMeta:`${randomBo.id || 'C?'}-P3-${q.id}`}));
        document.getElementById("subTitleCD").innerText = `${selected} - ${randomBo.id || 'Bộ'}`;
        startExamProcess({ passage: randomBo.passage, questions: allQ });
        switchScreen(2);
    });
    document.getElementById("submitExamBtn").addEventListener("click",()=>{ if(!submitted && examActive) forceEnd(); });
    document.getElementById("retryBtn").addEventListener("click",()=>{ switchScreen(1); if(timerInterval)clearInterval(timerInterval); });
    document.getElementById("backToStartBtn").addEventListener("click",()=>{ switchScreen(1); if(timerInterval)clearInterval(timerInterval); });
</script>
