<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ÔN TẬP TRẮC NGHIỆM TOÁN (10-11-12) - CẤU TRÚC MỚI</title>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
body { background-color: #f5f7fa; color: #333; line-height: 1.4; }
.container { max-width: 1000px; margin: 0 auto; padding: 10px; }
header { text-align: center; margin-bottom: 15px; padding: 15px; background: linear-gradient(135deg, #1e5799, #207cca); color: white; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
h1 { font-size: 28px; margin-bottom: 5px; }
.screen { display: none; background-color: white; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); padding: 20px; margin-bottom: 20px; }
.active { display: block; }
.form-group { margin-bottom: 15px; }
label { display: block; margin-bottom: 5px; font-weight: 600; color: #2c3e50; font-size: 16px; }
input, select { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 5px; font-size: 16px; transition: border-color 0.3s; }
input:focus, select:focus { border-color: #3498db; outline: none; }
.row { display: flex; gap: 15px; margin-bottom: 15px; }
.col { flex: 1; }
.btn { display: inline-block; padding: 12px 24px; background-color: #3498db; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; transition: background-color 0.3s; text-align: center; margin-right: 10px; margin-top: 10px; width: 100%; }
.btn:hover { background-color: #2980b9; }
.btn-secondary { background-color: #7f8c8d; }
.btn-success { background-color: #2ecc71; }
.btn-danger { background-color: #e74c3c; }
.btn-info { background-color: #17a2b8; }
.test-header-container { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; padding-bottom: 10px; border-bottom: 1px solid #eee; flex-wrap: wrap; gap: 10px; }
.test-title { font-size: 20px; font-weight: bold; color: #2c3e50; }
.test-info { display: flex; align-items: center; gap: 10px; }
.timer { text-align: center; font-size: 28px; font-weight: bold; color: #e74c3c; background: #f9f9f9; padding: 5px 10px; border-radius: 5px; }
.question-counter { font-size: 18px; font-weight: bold; }
.question { margin-bottom: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 8px; border-left: 4px solid #3498db; }
.question-number { font-weight: bold; color: #3498db; margin-bottom: 8px; font-size: 20px; }
.question-content { margin-bottom: 12px; font-size: 18px; }
.options { list-style-type: none; }
.option { padding: 10px 15px; margin-bottom: 8px; background-color: white; border-radius: 5px; cursor: pointer; border: 1px solid #e0e0e0; font-size: 18px; transition: all 0.2s; }
.option:hover { background-color: #f0f7ff; border-color: #3498db; }
.option.selected { background-color: #e1f0ff; border-color: #3498db; font-weight: bold; }
.statements-group { margin-top: 15px; background: #fff; border-radius: 8px; padding: 10px; border: 1px solid #e0e0e0; }
.statement-item { margin-bottom: 15px; padding: 8px; background: #fefefe; border-left: 3px solid #9b59b6; }
.statement-text { font-size: 17px; margin-bottom: 8px; font-weight: 500; }
.statement-options { display: flex; gap: 20px; align-items: center; }
.statement-options label { display: inline-flex; align-items: center; gap: 5px; font-weight: normal; cursor: pointer; margin-right: 15px; }
.statement-options input { width: auto; margin-right: 5px; transform: scale(1.1); }
.part-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; color: white; font-size: 12px; margin-right: 5px; font-weight: bold; }
.badge-p1 { background-color: #3498db; }
.badge-p2 { background-color: #9b59b6; }
.badge-p3 { background-color: #e67e22; }
.notification { position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background-color: rgba(46,204,113,0.9); color: white; padding: 15px 30px; border-radius: 8px; font-size: 18px; font-weight: bold; z-index: 1000; display: none; }
.result-header { text-align: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
.result-header h2 { font-size: 22px; }
.result-wrapper { display: flex; flex-direction: row; gap: 20px; align-items: stretch; }
.result-left { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 15px; background-color: #fff; border-radius: 8px; text-align: center; }
.student-name-display { color: #1890ff; font-weight: bold; font-size: 50px; margin-bottom: 15px; line-height: 1.1; }
.chart-container { position: relative; width: 200px; height: 200px; margin-bottom: 15px; flex-shrink: 0; }
.pie-chart { width: 100%; height: 100%; border-radius: 50%; background: conic-gradient(#eee 0% 100%); display: flex; align-items: center; justify-content: center; transition: background 1s ease-out; }
.pie-chart::after { content: ""; position: absolute; width: 75%; height: 75%; background-color: white; border-radius: 50%; }
.chart-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); text-align: center; z-index: 10; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.percentage-text { display: block; font-size: 44px; font-weight: 800; color: #333; line-height: 1.2; }
.exam-date { color: #000; font-weight: bold; font-size: 18.5px; margin-top: auto; padding-top: 10px; border-top: 1px solid #eee; width: 100%; }
.result-right { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; }
.grid-item { border-radius: 8px; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; border: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
.grid-icon { width: 52px; height: 52px; margin-bottom: 10px; }
.grid-label { font-size: 18px; margin-bottom: 5px; font-weight: 500; }
.grid-value { font-size: 27px; font-weight: bold; }
.time-start { background-color: #e6f7ff; border-left: 4px solid #1890ff; }
.time-start .grid-icon { stroke: #1890ff; }
.time-start .grid-label { color: #1890ff; }
.time-end { background-color: #f6ffed; border-left: 4px solid #52c41a; }
.time-end .grid-icon { stroke: #52c41a; }
.time-end .grid-label { color: #52c41a; }
.wrong { background-color: #fff2f0; border-left: 4px solid #ff4d4f; }
.wrong .grid-icon { stroke: #ff4d4f; }
.wrong .grid-label { color: #ff4d4f; }
.unanswered { background-color: #fff7e6; border-left: 4px solid #faad14; }
.unanswered .grid-icon { stroke: #faad14; }
.unanswered .grid-label { color: #faad14; }
.review-list { margin-top: 20px; width: 100%; }
.review-item { padding: 10px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid; background-color: #fff; border: 1px solid #eee; }
.review-item.correct { border-left-color: #2ecc71; background-color: #f0fff4; }
.review-item.incorrect { border-left-color: #e74c3c; background-color: #fff5f5; }
.review-question-title { font-weight: bold; margin-bottom: 5px; font-size: 16px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
.review-question-title:hover { opacity: 0.8; }
.source-code { font-size: 11px; font-family: monospace; background: #f0f0f0; padding: 8px; margin-top: 8px; border-radius: 4px; overflow-x: auto; white-space: pre-wrap; word-break: break-all; display: none; }
.source-code.show { display: block; }
.code-toggle { background: none; border: none; color: #17a2b8; cursor: pointer; font-size: 12px; padding: 2px 8px; border-radius: 4px; }
.code-toggle:hover { background: #e0e0e0; }
.review-options { margin-top: 5px; }
.review-option-row { padding: 3px 0; font-size: 14px; }
.review-statement { margin-bottom: 8px; padding-left: 8px; border-left: 2px solid #ccc; }
.review-statement.correct-st { color: #2ecc71; }
.review-statement.incorrect-st { color: #e74c3c; }
.math-container { margin: 5px 0; padding: 5px; background-color: rgba(255,255,255,0.9); border-radius: 3px; overflow-x: auto; }
.input-group { margin-top: 15px; display: flex; flex-direction: column; gap: 15px; }
.number-input { width: 100%; padding: 12px; font-size: 20px; text-align: center; border: 2px solid #3498db; border-radius: 8px; background: white; }
.virtual-keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; background: #f0f0f0; padding: 10px; border-radius: 10px; margin-top: 5px; }
.keypad-btn { padding: 12px; font-size: 20px; font-weight: bold; background: white; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; transition: all 0.2s; text-align: center; }
.keypad-btn:hover { background: #e0e0e0; transform: scale(0.98); }
.keypad-btn.special { background: #ff9800; color: white; }
.keypad-btn.ok { background: #4caf50; color: white; grid-column: span 2; }
.question-content table {
    border-collapse: collapse;
    width: auto;
    margin: 16px auto;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: white;
}
.question-content th, .question-content td {
    border: 1px solid #333;
    padding: 2px 8px;
    text-align: center;
    vertical-align: middle;
    white-space: nowrap;
}
.question-content th { background-color: #f2f2f2; font-weight: bold; }
@media (max-width: 768px) {
  .row { flex-direction: column; gap: 10px; }
  .btn { padding: 10px; font-size: 14px; }
  .result-wrapper { flex-direction: column; gap: 10px; }
  .result-left { padding: 10px 5px; }
  .student-name-display { font-size: 29px; margin-bottom: 5px; }
  .chart-container { width: 140px; height: 140px; margin-bottom: 5px; }
  .percentage-text { font-size: 29px; }
  .exam-date { font-size: 14px; padding-top: 5px; }
  .result-right { width: 100%; gap: 6px; }
  .grid-item { padding: 6px; }
  .grid-icon { width: 20px; height: 20px; margin-bottom: 2px; }
  .grid-label { font-size: 10px; }
  .grid-value { font-size: 14px; }
  .review-item { padding: 8px; }
  .review-question-title { font-size: 14px; }
  .statement-text { font-size: 14px; }
  .screen { padding: 10px; margin-bottom: 10px; }
  .virtual-keypad { gap: 5px; }
  .keypad-btn { padding: 8px; font-size: 16px; }
  .question-content table { font-size: 12px; }
  .question-content th, .question-content td { padding: 2px 4px; white-space: normal; }
}
</style>
</head>
<body>
<div class="container">
  <header><h1>ÔN TẬP TRẮC NGHIỆM TOÁN (10-11-12)</h1></header>
  <div id="main-screen" class="screen active">
    <div class="form-group"><label>Họ và tên:</label><input type="text" id="student-name" maxlength="40" placeholder="Nhập họ và tên (tối đa 40 ký tự)"></div>
    <div class="row"><div class="col"><div class="form-group"><label>Chọn lớp:</label><select id="grade-select"><option value="">-- Chọn lớp --</option><option value="10">TOÁN LỚP 10</option><option value="11">TOÁN LỚP 11</option><option value="12">TOÁN LỚP 12</option></select></div></div><div class="col"><div class="form-group"><label>Chọn kỳ ôn tập:</label><select id="term-select"><option value="">-- Chọn kỳ --</option><option value="GK1">GIỮA HỌC KÌ 1</option><option value="HK1">CUỐI HỌC KÌ 1</option><option value="GK2">GIỮA HỌC KÌ 2</option><option value="HK2">CUỐI HỌC KÌ 2</option><option value="THI">THI THỬ TỐT NGHIỆP</option></select></div></div></div>
    <div class="form-group"><label>Mã kho đề: <span id="code-display" style="font-weight: bold; color: #e74c3c;"></span></label></div>
    <button id="start-btn" class="btn btn-success">Bắt đầu làm bài</button>
    <div class="contact-info" style="background:#f8f9fa; padding:15px; border-radius:8px; text-align:center; font-size:14px; margin-top:15px;"><h3>Thông tin liên hệ</h3><p><strong>Thầy Lê Duy Hùng</strong></p><p>ZALO: 0967 095 025</p><p>FACEBOOK: <a href="https://www.facebook.com/leduyhung.vietnam" target="_blank">https://www.facebook.com/leduyhung.vietnam</a></p></div>
  </div>
  <div id="test-screen" class="screen">
    <div class="test-header-container"><div class="test-title" id="test-title"></div><div class="test-info"><div class="timer" id="timer">60:00</div><div class="question-counter">Câu <span id="current-question-number">1</span>/<span id="total-questions">22</span></div></div></div>
    <div id="current-question-container"></div>
    <div style="text-align: center;"><button id="submit-test-btn" class="btn btn-danger">NỘP BÀI</button></div>
  </div>
  <div id="result-screen" class="screen">
    <div class="result-header"><h2 id="result-title"></h2></div>
    <div class="result-wrapper"><div class="result-left"><div class="student-name-display" id="result-student-name"></div><div class="chart-container"><div class="pie-chart" id="score-chart"></div><div class="chart-center"><span class="percentage-text" id="score-percentage">0%</span></div></div><div class="exam-date" id="result-date"></div></div><div class="result-right"><div class="grid-item time-start"><svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><div class="grid-label">Bắt đầu</div><div class="grid-value" id="start-time-hms">00:00:00</div></div><div class="grid-item time-end"><svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg><div class="grid-label">Kết thúc</div><div class="grid-value" id="end-time-hms">00:00:00</div></div><div class="grid-item wrong"><svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg><div class="grid-label">Sai</div><div class="grid-value" id="incorrect-count">0/22</div></div><div class="grid-item unanswered"><svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="8"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg><div class="grid-label">Chưa chọn</div><div class="grid-value" id="unanswered-count">0/22</div></div></div></div>
    <div id="cheating-warning" style="display: none; background-color: #ffebee; color: #c62828; padding: 10px; border-radius: 8px; margin-bottom: 15px; text-align: center; font-weight: bold;"></div>
    <div class="review-list" id="review-list"></div>
    <div style="text-align: center; margin-top: 20px;"><button id="retry-btn" class="btn btn-success">LÀM LẠI</button><button id="back-btn" class="btn btn-secondary">QUAY LẠI</button></div>
  </div>
</div>
<div id="notification" class="notification"></div>
<script>
// ==================== KHO ĐỀ ĐỒNG BỘ CẤU TRÚC (12 P1 + 4 P2 + 6 P3) ====================

function shuffleArray(arr){ for(let i=arr.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; } return arr; }
function randomSample(arr, k){ if(k>=arr.length) return shuffleArray([...arr]); const shuffled=shuffleArray([...arr]); return shuffled.slice(0,k); }
function getRandomQuestions(code){
  const bank = questionBanks[code];
  if(!bank) return [];
  const p1Groups = ['P1A','P1B','P1C','P1D','P1E','P1F','P1G','P1H','P1I','P1J','P1K','P1L'];
  const hasAllGroups = p1Groups.every(g => bank[g] && bank[g].length >= 1);
  if(hasAllGroups && bank.P2A && bank.P3A) {
    const final = [];
    for(let grp of p1Groups) { if(bank[grp] && bank[grp].length) { const selected = randomSample(bank[grp], 1); if(selected.length) final.push({...selected[0], partType:'P1', sourceSubpart:grp, originalId:selected[0].id}); } }
    const p1Questions = shuffleArray(final.filter(q => q.partType === 'P1'));
    const p2Groups = ['P2A','P2B','P2C','P2D']; const p2Questions = [];
    for(let grp of p2Groups) { if(bank[grp] && bank[grp].length) { const selected = randomSample(bank[grp], 1); if(selected.length) p2Questions.push({...selected[0], partType:'P2', sourceSubpart:grp, originalId:selected[0].id}); } }
    const p3Groups = ['P3A','P3B','P3C','P3D','P3E','P3F']; const p3Questions = [];
    for(let grp of p3Groups) { if(bank[grp] && bank[grp].length) { const selected = randomSample(bank[grp], 1); if(selected.length) p3Questions.push({...selected[0], partType:'P3', sourceSubpart:grp, originalId:selected[0].id}); } }
    return [...p1Questions, ...shuffleArray(p2Questions), ...shuffleArray(p3Questions)];
  } else { const final = []; if(bank.P1) final.push(...bank.P1.map(q => ({...q, partType:'P1', sourceSubpart:'P1', originalId:q.id}))); if(bank.P2) final.push(...bank.P2.map(q => ({...q, partType:'P2', sourceSubpart:'P2', originalId:q.id}))); if(bank.P3) final.push(...bank.P3.map(q => ({...q, partType:'P3', sourceSubpart:'P3', originalId:q.id}))); return final; }
}
function convertToDisplayFormat(question, partType){
  const labels = ['A', 'B', 'C', 'D'];
  if(partType === 'P2'){
    let sts = [...question.statements];
    let selectedStmts = randomSample(sts, Math.min(4, sts.length));
    selectedStmts = shuffleArray(selectedStmts);
    return { id: `${question.sourceSubpart}-${question.originalId}`, originalId: question.originalId, sourceSubpart: question.sourceSubpart, partType: 'P2', content: question.content, statements: selectedStmts.map((st,idx) => ({ index:idx, text:st.text, correct:st.correct })), correctAnswer: selectedStmts.map(st => st.correct), rawData: question };
  } else if(partType === 'P3'){
    return { id: `${question.sourceSubpart}-${question.originalId}`, originalId: question.originalId, sourceSubpart: question.sourceSubpart, partType: 'P3', content: question.content, answerType: question.answerType || 'int_pos', correctValue: question.correct, decimals: question.decimals || 2, rawData: question };
  } else {
    const allChoices = [{text: question.correct, isCorrect: true},{text: question.wrong1, isCorrect: false},{text: question.wrong2, isCorrect: false},{text: question.wrong3, isCorrect: false}].filter(c => c.text && c.text.trim() !== "");
    const shuffled = shuffleArray([...allChoices]);
    const correctChoice = shuffled.find(c => c.isCorrect);
    const correctIndex = shuffled.indexOf(correctChoice);
    const correctAnswer = labels[correctIndex];
    const options = shuffled.map((c, idx) => ({id: labels[idx], text: c.text}));
    return { id: `${question.sourceSubpart}-${question.originalId}`, originalId: question.originalId, sourceSubpart: question.sourceSubpart, partType: 'P1', content: question.content, options: options, correctAnswer: correctAnswer, rawData: question };
  }
}
function generateSourceCode(q) { let raw = q.rawData; let sourceObj = { id: q.originalId, sourceSubpart: q.sourceSubpart, partType: q.partType, content: raw.content }; if(q.partType === 'P1') { sourceObj.correct = raw.correct; sourceObj.wrong1 = raw.wrong1; sourceObj.wrong2 = raw.wrong2; sourceObj.wrong3 = raw.wrong3; } else if(q.partType === 'P2') { sourceObj.statements = raw.statements; } else if(q.partType === 'P3') { sourceObj.answerType = raw.answerType; sourceObj.correct = raw.correct; } return JSON.stringify(sourceObj, null, 2); }

let currentScreen = 'main-screen', userAnswers = {}, testStartTime = null, testSubmitTime = null, timerInterval = null, timeLeft = 3600, currentTestCode = '', currentQuestions = [], studentName = '', currentQuestionIndex = 0, isTransitioning = false, isCheating = false, visibilityHandler = null;
function showScreen(id){ document.getElementById(currentScreen).classList.remove('active'); document.getElementById(id).classList.add('active'); currentScreen = id; if(window.MathJax) setTimeout(() => MathJax.typesetPromise(), 100); }
function updateTestCode(){ let g = document.getElementById('grade-select').value; let t = document.getElementById('term-select').value; if(g && t){ currentTestCode = `T${g}${t}`; document.getElementById('code-display').textContent = currentTestCode; } else { currentTestCode = ''; document.getElementById('code-display').textContent = ''; } }
function showNotification(msg, dur=1000){ let n = document.getElementById('notification'); n.textContent = msg; n.style.display = 'block'; setTimeout(() => n.style.display = 'none', dur); }
function getPartBadgeClass(p){ if(p === 'P1') return 'badge-p1'; if(p === 'P2') return 'badge-p2'; return 'badge-p3'; }
function allStatementsSelected(qid, total){ let ans = userAnswers[qid]; if(!ans) return false; for(let i = 0; i < total; i++) if(ans[i] === undefined) return false; return true; }
function tryAutoAdvance(){ if(isTransitioning) return; let q = currentQuestions[currentQuestionIndex]; if(q.partType === 'P2' && allStatementsSelected(q.id, q.statements.length)){ isTransitioning = true; showNotification("Đã chọn đủ mệnh đề!"); setTimeout(() => { if(currentQuestionIndex >= currentQuestions.length - 1) submitTest(); else{ currentQuestionIndex++; renderCurrentQuestion(); isTransitioning = false; } }, 800); } }
function createVirtualKeypad(inputEl, onOk){ let div = document.createElement('div'); div.className = 'virtual-keypad'; let btns = ['7','8','9','DEL','4','5','6','-','1','2','3','.','0','OK','C']; btns.forEach(b => { let btn = document.createElement('div'); btn.className = 'keypad-btn'; if(b === 'OK') btn.classList.add('ok'); if(b === 'DEL' || b === 'C') btn.classList.add('special'); btn.textContent = b; btn.addEventListener('click', () => { if(b === 'DEL') inputEl.value = inputEl.value.slice(0,-1); else if(b === 'C') inputEl.value = ''; else if(b === 'OK') onOk(); else inputEl.value += b; }); div.appendChild(btn); }); return div; }
function renderCurrentQuestion(){
  let container = document.getElementById('current-question-container');
  let q = currentQuestions[currentQuestionIndex];
  if(q.partType === 'P2'){
    let stHtml = '';
    q.statements.forEach((st, idx) => { let saved = userAnswers[q.id] && userAnswers[q.id][idx] !== undefined ? userAnswers[q.id][idx] : null; let trueChecked = saved === true ? 'checked' : ''; let falseChecked = saved === false ? 'checked' : ''; stHtml += `<div class="statement-item"><div class="statement-text"><div class="math-container">${st.text}</div></div><div class="statement-options"><label><input type="radio" name="stmt_${q.id}_${idx}" value="true" ${trueChecked}> Đúng</label><label><input type="radio" name="stmt_${q.id}_${idx}" value="false" ${falseChecked}> Sai</label></div></div>`; });
    container.innerHTML = `<div class="question"><div class="question-number"><span class="part-badge ${getPartBadgeClass(q.partType)}">Phần 2 (Đ/S)</span> Câu ${q.displayOrder}</div><div class="question-content"><div class="math-container">${q.content}</div></div><div class="statements-group">${stHtml}</div></div>`;
    q.statements.forEach((_, idx) => { document.querySelectorAll(`input[name="stmt_${q.id}_${idx}"]`).forEach(radio => { radio.addEventListener('change', (e) => { if(isTransitioning) return; if(!userAnswers[q.id]) userAnswers[q.id] = {}; userAnswers[q.id][idx] = e.target.value === 'true'; showNotification("Đã chọn mệnh đề", 500); tryAutoAdvance(); }); }); });
  } else if(q.partType === 'P3'){
    let saved = userAnswers[q.id] !== undefined ? userAnswers[q.id] : '';
    container.innerHTML = `<div class="question"><div class="question-number"><span class="part-badge ${getPartBadgeClass(q.partType)}">Phần 3 (Điền số)</span> Câu ${q.displayOrder}</div><div class="question-content"><div class="math-container">${q.content}</div></div><div class="input-group"><input type="text" id="p3-input-${q.id}" class="number-input" placeholder="Nhập số" value="${saved}"><div id="keypad-${q.id}"></div><button id="p3-ok-${q.id}" class="btn btn-success">OK</button></div></div>`;
    let inp = document.getElementById(`p3-input-${q.id}`); let keypadDiv = document.getElementById(`keypad-${q.id}`); let okBtn = document.getElementById(`p3-ok-${q.id}`);
    let handleOk = () => { if(isTransitioning) return; let raw = inp.value.trim(); if(raw === ''){ showNotification("Vui lòng nhập số!", 800); return; } let numVal = null; if(q.answerType === 'int_pos' || q.answerType === 'int_neg'){ let num = Number(raw); if(!isNaN(num) && Number.isInteger(num)) numVal = num; else{ showNotification("Số nguyên hợp lệ!", 800); return; } } else if(q.answerType === 'float_pos' || q.answerType === 'float_neg'){ let num = parseFloat(raw); if(!isNaN(num)) numVal = num; else{ showNotification("Số thực hợp lệ!", 800); return; } } else numVal = raw; userAnswers[q.id] = numVal; showNotification("Đã lưu đáp án!"); isTransitioning = true; setTimeout(() => { if(currentQuestionIndex >= currentQuestions.length - 1) submitTest(); else{ currentQuestionIndex++; renderCurrentQuestion(); isTransitioning = false; } }, 600); };
    let kp = createVirtualKeypad(inp, handleOk); keypadDiv.appendChild(kp); okBtn.addEventListener('click', handleOk);
  } else {
    let optsHtml = ''; q.options.forEach(opt => { optsHtml += `<li class="option" data-option="${opt.id}"><div class="math-container"><strong>${opt.id}.</strong> ${opt.text}</div></li>`; });
    container.innerHTML = `<div class="question"><div class="question-number"><span class="part-badge ${getPartBadgeClass(q.partType)}">Phần 1</span> Câu ${q.displayOrder}</div><div class="question-content"><div class="math-container">${q.content}</div></div><ul class="options">${optsHtml}</ul></div>`;
    document.querySelectorAll('.option').forEach(opt => { opt.addEventListener('click', function(){ if(isTransitioning) return; let selected = this.getAttribute('data-option'); userAnswers[q.id] = selected; showNotification("Đã chọn đáp án", 500); isTransitioning = true; setTimeout(() => { if(currentQuestionIndex >= currentQuestions.length - 1) submitTest(); else{ currentQuestionIndex++; renderCurrentQuestion(); isTransitioning = false; } }, 800); }); });
  }
  document.getElementById('current-question-number').textContent = currentQuestionIndex + 1;
  if(window.MathJax) setTimeout(() => MathJax.typesetPromise(), 200);
}
function startTimer(){ clearInterval(timerInterval); let upd = () => { let m = Math.floor(timeLeft / 60), s = timeLeft % 60; document.getElementById('timer').textContent = `${m.toString().padStart(2,'0')}:${s.toString().padStart(2,'0')}`; if(timeLeft <= 60) document.getElementById('timer').style.backgroundColor = '#ffebee'; else document.getElementById('timer').style.backgroundColor = '#f9f9f9'; }; upd(); timerInterval = setInterval(() => { timeLeft--; upd(); if(timeLeft <= 0){ clearInterval(timerInterval); submitTest(); } }, 1000); }
function startTest(){
  studentName = document.getElementById('student-name').value.trim(); let grade = document.getElementById('grade-select').value; let term = document.getElementById('term-select').value;
  if(!studentName){ alert('Vui lòng nhập họ và tên!'); return; } if(!grade || !term){ alert('Vui lòng chọn lớp và kỳ ôn tập!'); return; }
  let raw = getRandomQuestions(currentTestCode); if(raw.length === 0){ alert('Kho đề trống! Vui lòng chọn lớp và kỳ khác.'); return; }
  currentQuestions = raw.map((q, idx) => { let dq = convertToDisplayFormat(q, q.partType); dq.displayOrder = idx + 1; return dq; });
  userAnswers = {}; timeLeft = 3600; testStartTime = new Date(); currentQuestionIndex = 0; isTransitioning = false; isCheating = false;
  let gradeNames = {10:'TOÁN LỚP 10', 11:'TOÁN LỚP 11', 12:'TOÁN LỚP 12'}, termNames = {GK1:'GIỮA HỌC KÌ 1', HK1:'CUỐI HỌC KÌ 1', GK2:'GIỮA HỌC KÌ 2', HK2:'CUỐI HỌC KÌ 2', THI:'THI THỬ TỐT NGHIỆP'};
  document.getElementById('test-title').textContent = `${gradeNames[grade]} - ${termNames[term]}`; document.getElementById('total-questions').textContent = currentQuestions.length;
  renderCurrentQuestion(); startTimer(); showScreen('test-screen');
  if(visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler);
  visibilityHandler = () => { if(document.hidden && !isCheating && testStartTime && currentScreen === 'test-screen'){ isCheating = true; clearInterval(timerInterval); submitTest(); } };
  document.addEventListener('visibilitychange', visibilityHandler);
}
function submitTest(){ clearInterval(timerInterval); testSubmitTime = new Date(); if(visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler); showResults(isCheating); }
function formatTimeHMS(d){ return `${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}`; }
function calculateScore(){
  let total = 0, correct = 0, incorrect = 0, unanswered = 0;
  currentQuestions.forEach(q => {
    if(q.partType === 'P1'){ let ans = userAnswers[q.id]; if(ans && ans === q.correctAnswer){ total += 2.5; correct++; } else if(ans) incorrect++; else unanswered++; }
    else if(q.partType === 'P2'){ let us = userAnswers[q.id] || {}; let corrSt = 0, all = true; for(let i=0;i<q.statements.length;i++){ if(us[i] !== undefined){ if(us[i] === q.statements[i].correct) corrSt++; } else all=false; } if(all){ if(corrSt===4) total+=10; else if(corrSt===3) total+=5; else if(corrSt===2) total+=2.5; else if(corrSt===1) total+=1; if(corrSt===4) correct++; else incorrect++; } else unanswered++; }
    else if(q.partType === 'P3'){ let ans = userAnswers[q.id]; if(ans !== undefined){ let un=parseFloat(ans), cn=parseFloat(q.correctValue); let ok=false; if(!isNaN(un)&&!isNaN(cn)){ if(q.answerType === 'float_pos'||q.answerType==='float_neg'){ let f=Math.pow(10,q.decimals||2); ok=(Math.round(un*f)/f===Math.round(cn*f)/f); } else ok=(un===cn); } else if(q.answerType === 'str') ok=(ans===q.correctValue); if(ok){ total+=5; correct++; } else incorrect++; } else unanswered++; }
  });
  return {totalScore: total, correctCount: correct, incorrect, unanswered};
}
function showResults(cheating){
  let grade = document.getElementById('grade-select').value, term = document.getElementById('term-select').value;
  let gradeNames = {10:'TOÁN LỚP 10', 11:'TOÁN LỚP 11', 12:'TOÁN LỚP 12'}, termNames = {GK1:'GIỮA HỌC KÌ 1', HK1:'CUỐI HỌC KÌ 1', GK2:'GIỮA HỌC KÌ 2', HK2:'CUỐI HỌC KÌ 2', THI:'THI THỬ TỐT NGHIỆP'};
  document.getElementById('result-title').textContent = `${gradeNames[grade]} - ${termNames[term]} - KẾT QUẢ`;
  let {totalScore, incorrect, unanswered} = calculateScore();
  document.getElementById('result-student-name').textContent = studentName;
  let percentVal = totalScore.toFixed(1);
  document.getElementById('score-percentage').textContent = `${percentVal}%`;
  let col = (s) => { if(s<50) return '#f5222d'; if(s<70) return '#faad14'; if(s<80) return '#52c41a'; if(s<90) return '#13c2c2'; if(s<100) return '#1890ff'; return '#722ed1'; };
  document.getElementById('score-chart').style.background = `conic-gradient(${col(totalScore)} ${totalScore}%, #eee ${totalScore}% 100%)`;
  document.getElementById('result-date').textContent = `${testSubmitTime.getDate().toString().padStart(2,'0')}/${(testSubmitTime.getMonth()+1).toString().padStart(2,'0')}/${testSubmitTime.getFullYear()}`;
  document.getElementById('start-time-hms').textContent = formatTimeHMS(testStartTime);
  document.getElementById('end-time-hms').textContent = formatTimeHMS(testSubmitTime);
  document.getElementById('incorrect-count').textContent = `${incorrect}/${currentQuestions.length}`;
  document.getElementById('unanswered-count').textContent = `${unanswered}/${currentQuestions.length}`;
  let warnDiv = document.getElementById('cheating-warning');
  if(cheating){ warnDiv.style.display = 'block'; warnDiv.innerHTML = '⚠️ PHÁT HIỆN GIAN LẬN (chuyển tab/ứng dụng). Chỉ hiển thị các câu đã làm.'; } else warnDiv.style.display = 'none';
  let container = document.getElementById('review-list'); container.innerHTML = '';
  currentQuestions.forEach((q, idx) => {
    let isAnswered = false;
    if(q.partType === 'P1') isAnswered = userAnswers[q.id] !== undefined;
    else if(q.partType === 'P2') isAnswered = userAnswers[q.id] && Object.keys(userAnswers[q.id]).length === q.statements.length;
    else isAnswered = userAnswers[q.id] !== undefined;
    if(!isAnswered) return;
    let sourceCode = generateSourceCode(q), sourceId = `source-${idx}`;
    if(q.partType === 'P2'){
      let us = userAnswers[q.id] || {}; let allCorrect = true; for(let i=0;i<q.statements.length;i++) if(us[i] !== q.statements[i].correct){ allCorrect=false; break; }
      let status = allCorrect ? 'correct' : 'incorrect';
      let stHtml = ''; q.statements.forEach((st, idx2) => { let uc = us[idx2]; let isC = (uc === st.correct); let cls = (uc !== undefined) ? (isC ? 'correct-st' : 'incorrect-st') : ''; let ut = uc===undefined ? 'Chưa chọn' : (uc ? 'Đúng' : 'Sai'); stHtml += `<div class="review-statement ${cls}"><strong>Mệnh đề ${idx2+1}:</strong> ${st.text}<br><span style="font-size:13px;">→ Bạn chọn: ${ut} (Đáp án: ${st.correct ? 'Đúng' : 'Sai'})</span></div>`; });
      container.innerHTML += `<div class="review-item ${status}"><div class="review-question-title" onclick="toggleSourceCode('${sourceId}')"><span><span class="part-badge ${getPartBadgeClass(q.partType)}">P2</span> Câu ${q.displayOrder} - ${currentTestCode} - ${q.sourceSubpart} - id:${q.originalId}</span><button class="code-toggle">📄 Mã nguồn</button></div><div class="question-content">${q.content}</div>${stHtml}<div id="${sourceId}" class="source-code"><strong>📋 Mã nguồn câu hỏi:</strong><br><pre>${escapeHtml(sourceCode)}</pre></div></div>`;
    } else if(q.partType === 'P3'){
      let ans = userAnswers[q.id]; let isCor = false;
      if(ans !== undefined){ let un=parseFloat(ans), cn=parseFloat(q.correctValue); if(!isNaN(un)&&!isNaN(cn)){ if(q.answerType === 'float_pos'||q.answerType==='float_neg'){ let f=Math.pow(10,q.decimals||2); isCor=(Math.round(un*f)/f===Math.round(cn*f)/f); } else isCor=(un===cn); } else if(q.answerType === 'str') isCor=(ans===q.correctValue); }
      let status = isCor ? 'correct' : 'incorrect';
      container.innerHTML += `<div class="review-item ${status}"><div class="review-question-title" onclick="toggleSourceCode('${sourceId}')"><span><span class="part-badge ${getPartBadgeClass(q.partType)}">P3</span> Câu ${q.displayOrder} - ${currentTestCode} - ${q.sourceSubpart} - id:${q.originalId}</span><button class="code-toggle">📄 Mã nguồn</button></div><div class="question-content">${q.content}</div><div><strong>Đáp án của bạn:</strong> ${ans !== undefined ? ans : 'Chưa điền'}</div><div><strong>Đáp án đúng:</strong> ${q.correctValue}</div><div id="${sourceId}" class="source-code"><strong>📋 Mã nguồn câu hỏi:</strong><br><pre>${escapeHtml(sourceCode)}</pre></div></div>`;
    } else {
      let ans = userAnswers[q.id]; let isCor = (ans === q.correctAnswer); let status = isCor ? 'correct' : 'incorrect';
      let optsHtml = ''; q.options.forEach(opt => { let style = ''; if(opt.id === q.correctAnswer) style = 'color:#2ecc71; font-weight:bold;'; else if(opt.id === ans && !isCor) style = 'color:#e74c3c; text-decoration:line-through;'; optsHtml += `<div class="review-option-row" style="${style}"><strong>${opt.id}.</strong> ${opt.text}</div>`; });
      container.innerHTML += `<div class="review-item ${status}"><div class="review-question-title" onclick="toggleSourceCode('${sourceId}')"><span><span class="part-badge ${getPartBadgeClass(q.partType)}">P1</span> Câu ${q.displayOrder} - ${currentTestCode} - ${q.sourceSubpart} - id:${q.originalId}</span><button class="code-toggle">📄 Mã nguồn</button></div><div class="question-content">${q.content}</div>${optsHtml}<div id="${sourceId}" class="source-code"><strong>📋 Mã nguồn câu hỏi:</strong><br><pre>${escapeHtml(sourceCode)}</pre></div></div>`;
    }
  });
  if(window.MathJax) setTimeout(() => MathJax.typesetPromise(), 300);
  showScreen('result-screen');
}
function escapeHtml(str) { return str.replace(/[&<>]/g, function(m) { if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m; }).replace(/[\uD800-\uDBFF][\uDC00-\uDFFF]/g, function(c) { return c; }); }
function retryTest(){
  if(visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler);
  let raw = getRandomQuestions(currentTestCode); if(raw.length === 0){ alert('Kho đề trống!'); showScreen('main-screen'); return; }
  currentQuestions = raw.map((q, idx) => { let dq = convertToDisplayFormat(q, q.partType); dq.displayOrder = idx + 1; return dq; });
  userAnswers = {}; timeLeft = 3600; testStartTime = new Date(); currentQuestionIndex = 0; isTransitioning = false; isCheating = false;
  renderCurrentQuestion(); startTimer(); showScreen('test-screen');
  visibilityHandler = () => { if(document.hidden && !isCheating && testStartTime && currentScreen === 'test-screen'){ isCheating = true; clearInterval(timerInterval); submitTest(); } };
  document.addEventListener('visibilitychange', visibilityHandler);
}
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('grade-select').addEventListener('change', updateTestCode);
  document.getElementById('term-select').addEventListener('change', updateTestCode);
  document.getElementById('start-btn').addEventListener('click', startTest);
  document.getElementById('submit-test-btn').addEventListener('click', submitTest);
  document.getElementById('retry-btn').addEventListener('click', retryTest);
  document.getElementById('back-btn').addEventListener('click', () => { if(visibilityHandler) document.removeEventListener('visibilitychange', visibilityHandler); showScreen('main-screen'); });
});
window.toggleSourceCode = function(id) { let src = document.getElementById(id); if(src) src.classList.toggle('show'); };
