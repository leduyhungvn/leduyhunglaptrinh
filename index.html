<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ÔN TẬP TIẾNG NGA – BÀI 1</title>
    <!-- Font Awesome for speaker icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        body {
            background: linear-gradient(145deg, #f0f4f8 0%, #d9e2ec 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 16px;
        }
        #app {
            max-width: 1200px;
            width: 100%;
            background: rgba(255,255,255,0.75);
            backdrop-filter: blur(10px);
            border-radius: 48px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
            padding: 32px;
        }
        .screen {
            display: none;
        }
        .screen.active {
            display: block;
        }
        h1, h2, h3 {
            color: #1e3c72;
            font-weight: 600;
            margin-bottom: 24px;
            text-align: center;
        }
        h1 i, h2 i {
            margin-right: 12px;
            color: #0a58ca;
        }
        .btn-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            justify-content: center;
            margin: 40px 0;
        }
        .btn {
            border: none;
            border-radius: 60px;
            padding: 16px 36px;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
            color: white;
            min-width: 240px;
        }
        .btn:active {
            transform: translateY(4px);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
        }
        .btn:disabled {
            opacity: 0.5;
            transform: none;
            pointer-events: none;
        }
        .btn-vocab { background: #d44c2f; }        /* đỏ đất */
        .btn-grammar { background: #2f6f9f; }      /* xanh dương đậm */
        .btn-trans { background: #3b8b6e; }        /* xanh lá mạ */
        .btn-mix { background: #8e44ad; }           /* tím */
        .btn-back { background: #6c757d; font-size: 1rem; padding: 10px 24px; min-width: unset; }
        .btn-sub { background: #ffae42; color: #1e3c72; } /* cam */

        .name-input {
            width: 100%;
            max-width: 400px;
            margin: 20px auto;
            display: block;
            padding: 16px 24px;
            font-size: 1.3rem;
            border: 3px solid #1e3c72;
            border-radius: 60px;
            outline: none;
            text-align: center;
        }
        .table-container {
            max-height: 500px;
            overflow-y: auto;
            border-radius: 24px;
            background: white;
            padding: 8px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.05);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 20px;
        }
        th {
            background: #1e3c72;
            color: white;
            padding: 14px;
            position: sticky;
            top: 0;
        }
        td {
            padding: 12px;
            border-bottom: 1px solid #ccc;
        }
        .speaker {
            cursor: pointer;
            color: #0a58ca;
            margin-right: 8px;
            font-size: 1.2rem;
        }
        .test-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            background: white;
            padding: 16px 24px;
            border-radius: 60px;
            margin-bottom: 24px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .timer-bar {
            background: #e9ecef;
            height: 16px;
            border-radius: 30px;
            margin: 20px 0;
            overflow: hidden;
        }
        .timer-fill {
            height: 100%;
            width: 100%;
            background: #f39c12;
            transition: width 1s linear;
        }
        .question-area {
            background: white;
            border-radius: 48px;
            padding: 40px;
            box-shadow: 0 20px 30px -10px rgba(0,0,0,0.15);
            font-size: 2rem;
            text-align: center;
            margin: 20px 0;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-top: 30px;
        }
        .option {
            background: #f8f9fa;
            border-radius: 60px;
            padding: 18px 28px;
            font-size: 1.4rem;
            border: 2px solid transparent;
            cursor: pointer;
            transition: 0.1s;
            text-align: left;
        }
        .option:hover {
            background: #dfe7f5;
            border-color: #1e3c72;
        }
        .correct-count {
            font-size: 1.6rem;
            font-weight: 700;
            background: #27ae60;
            color: white;
            padding: 8px 28px;
            border-radius: 60px;
        }
        .report-chart {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: 40px 0;
        }
        canvas {
            width: 220px;
            height: 220px;
            margin: 20px;
        }
        .report-name {
            font-size: 3rem;
            font-weight: bold;
            color: #1890ff;
        }
        .report-date {
            font-size: 1.5rem;
            color: #2c3e50;
        }
        .answer-table {
            max-height: 400px;
            overflow-y: auto;
            margin: 30px 0;
        }
        .wrong-answer {
            background-color: #ffebee;
            color: #c62828;
            font-weight: 600;
        }
        .footer-buttons {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 24px;
        }
        select {
            padding: 12px 24px;
            font-size: 1.2rem;
            border-radius: 40px;
            border: 2px solid #1e3c72;
            background: white;
        }
        .small-note {
            color: #2c3e50;
            margin: 20px;
            font-style: italic;
        }
    </style>
</head>
<body>
<div id="app">

    <!-- SCREEN 1: GIAO DIỆN CHÍNH -->
    <div id="screen1" class="screen active">
        <h1><i class="fas fa-language"></i>ÔN TẬP TIẾNG NGA – BÀI 1</h1>  <!-- Đổi thành BÀI 1 -->
        <input type="text" id="student-name" class="name-input" placeholder="Nhập tên của bạn" autocomplete="off">
        <div class="btn-grid">
            <button class="btn btn-vocab" id="btn-to-vocab-main" disabled>📘 ÔN TẬP TỪ VỰNG</button>
            <button class="btn btn-grammar" id="btn-to-grammar-main" disabled>📝 TRẮC NGHIỆM NGỮ PHÁP</button>
            <button class="btn btn-trans" id="btn-to-trans-main" disabled>🌎 TRẮC NGHIỆM DỊCH CÂU</button>
            <button class="btn btn-mix" id="btn-to-mix-main" disabled>🔀 TRẮC NGHIỆM TỔNG HỢP</button>
        </div>
    </div>

    <!-- SCREEN 2: ÔN TẬP TỪ VỰNG (menu) -->
    <div id="screen2" class="screen">
        <h2><i class="fas fa-book-open"></i>TỪ VỰNG – BÀI 1</h2> <!-- Đổi thành BÀI 1 -->
        <div class="btn-grid">
            <button class="btn btn-vocab" id="btn-to-list">📋 DANH SÁCH TỪ VỰNG</button>
            <button class="btn btn-vocab" id="btn-to-vocab-test">✏️ KIỂM TRA TỪ VỰNG</button>
            <button class="btn btn-back" id="btn-back-from-vocab">⬅ QUAY LẠI</button>
        </div>
    </div>

    <!-- SCREEN 2.1: DANH SÁCH TỪ VỰNG (bảng 60 từ) -->
    <div id="screen2-1" class="screen">
        <div class="footer-buttons">
            <button class="btn btn-back" id="btn-back-from-list-top">⬅ QUAY LẠI</button>
        </div>
        <h2>📖 DANH SÁCH TỪ VỰNG (60 từ)</h2>
        <div class="table-container" id="vocab-table-container"></div>
        <div class="footer-buttons">
            <button class="btn btn-back" id="btn-back-from-list-bottom">⬅ QUAY LẠI</button>
        </div>
    </div>

    <!-- SCREEN 2.2: KIỂM TRA TỪ VỰNG (lựa chọn số câu) -->
    <div id="screen2-2" class="screen">
        <h2>🔤 TỪ VỰNG – BÀI 1</h2> <!-- Đổi thành BÀI 1 -->
        <div class="test-header">
            <span><i class="fas fa-user-graduate"></i> <span id="vocab-test-name"></span></span>
            <button class="btn btn-back" id="btn-back-from-vocab-test">⬅ QUAY LẠI</button>
        </div>
        <div style="text-align: center; margin: 40px;">
            <label style="font-size: 1.5rem;">Chọn số câu: </label>
            <select id="vocab-question-count">
                <option value="10">10 câu</option>
                <option value="20">20 câu</option>
                <option value="30">30 câu</option>
                <option value="40">40 câu</option>
                <option value="all">Tất cả (60)</option>
            </select>
            <button class="btn btn-sub" id="btn-start-vocab-test" style="margin-left: 20px;">🚀 LÀM BÀI</button>
        </div>
    </div>

    <!-- SCREEN 3: NGỮ PHÁP (lựa chọn số câu) -->
    <div id="screen3" class="screen">
        <h2>📐 NGỮ PHÁP – BÀI 1</h2> <!-- Đổi thành BÀI 1 -->
        <div class="test-header">
            <span><i class="fas fa-user-graduate"></i> <span id="grammar-test-name"></span></span>
            <button class="btn btn-back" id="btn-back-from-grammar">⬅ QUAY LẠI</button>
        </div>
        <div style="text-align: center; margin: 40px;">
            <select id="grammar-question-count">
                <option value="10">10 câu</option>
                <option value="20">20 câu</option>
                <option value="30">30 câu</option>
                <option value="40">40 câu</option>
                <option value="all">Tất cả (50)</option>
            </select>
            <button class="btn btn-sub" id="btn-start-grammar-test">🚀 LÀM BÀI</button>
        </div>
    </div>

    <!-- SCREEN 4: DỊCH CÂU (lựa chọn số câu) -->
    <div id="screen4" class="screen">
        <h2>🌐 DỊCH CÂU – BÀI 1</h2> <!-- Đổi thành BÀI 1 -->
        <div class="test-header">
            <span><i class="fas fa-user-graduate"></i> <span id="trans-test-name"></span></span>
            <button class="btn btn-back" id="btn-back-from-trans">⬅ QUAY LẠI</button>
        </div>
        <div style="text-align: center; margin: 40px;">
            <select id="trans-question-count">
                <option value="10">10 câu</option>
                <option value="20">20 câu</option>
                <option value="30">30 câu</option>
                <option value="40">40 câu</option>
                <option value="all">Tất cả (50)</option>
            </select>
            <button class="btn btn-sub" id="btn-start-trans-test">🚀 LÀM BÀI</button>
        </div>
    </div>

    <!-- SCREEN 5: TỔNG HỢP (lựa chọn số câu) -->
    <div id="screen5" class="screen">
        <h2>🎲 TỔNG HỢP – BÀI 1</h2> <!-- Đổi thành BÀI 1 -->
        <div class="test-header">
            <span><i class="fas fa-user-graduate"></i> <span id="mix-test-name"></span></span>
            <button class="btn btn-back" id="btn-back-from-mix">⬅ QUAY LẠI</button>
        </div>
        <div style="text-align: center; margin: 40px;">
            <select id="mix-question-count">
                <option value="10">10 câu</option>
                <option value="20">20 câu</option>
                <option value="30">30 câu</option>
                <option value="40">40 câu</option>
                <option value="all">Tất cả (160)</option>
            </select>
            <button class="btn btn-sub" id="btn-start-mix-test">🚀 LÀM BÀI</button>
        </div>
    </div>

    <!-- SCREEN LÀM BÀI (dùng chung cho các loại test) -->
    <div id="screen-test" class="screen">
        <div class="test-header">
            <span><i class="fas fa-user-graduate"></i> <span id="test-user-display"></span></span>
            <span class="correct-count" id="correct-counter">ĐÚNG 0</span>
            <button class="btn btn-back" id="btn-abort-test">✖ BỎ QUA</button>
        </div>
        <div class="timer-bar">
            <div class="timer-fill" id="timer-fill" style="width:100%"></div>
        </div>
        <div class="question-area" id="question-text">...</div>
        <div class="options" id="options-container"></div>
    </div>

    <!-- SCREEN BÁO CÁO KẾT QUẢ -->
    <div id="screen-report" class="screen">
        <h2 id="report-title">BÁO CÁO</h2>
        <div class="report-chart">
            <div class="report-name" id="report-name"></div>
            <canvas id="pieChart" width="220" height="220"></canvas>
            <div class="report-date" id="report-date"></div>
            <div id="report-time"></div>
        </div>
        <div class="answer-table" id="answer-table-container"></div>
        <div class="footer-buttons">
            <button class="btn btn-sub" id="btn-retry">🔄 LÀM LẠI</button>
            <button class="btn btn-back" id="btn-back-from-report">⬅ QUAY LẠI</button>
        </div>
    </div>
</div>

        {id:38, question:"Познакомь меня с твоим другом.", correct:"Hãy giới thiệu tôi với bạn của anh.", wrong1:"Hãy làm quen với bạn tôi.", wrong2:"Bạn của anh hãy giới thiệu tôi.", wrong3:"Tôi muốn gặp bạn anh."},

        {id:43, question:"Третьяковская галерея находится в центре Москвы.", correct:"Phòng tranh Tretyakov nằm ở trung tâm Moscow.", wrong1:"Phòng tranh Tretyakov ở trung tâm Moscow.", wrong2:"Trung tâm Moscow có Tretyakov.", wrong3:"Bảo tàng Tretyakov là trung tâm."},
        {id:44, question:"Московский Кремль - символ России.", correct:"Điện Kremlin Moscow là biểu tượng của nước Nga.", wrong1:"Kremlin là biểu tượng Moscow.", wrong2:"Biểu tượng nước Nga là Kremlin.", wrong3:"Kremlin tượng trưng cho nước Nga."},
        {id:45, question:"На Красной площади проходят парады.", correct:"Trên Quảng trường Đỏ diễn ra các cuộc diễu hành.", wrong1:"Quảng trường Đỏ có diễu hành.", wrong2:"Diễu hành ở Quảng trường Đỏ.", wrong3:"Quảng trường Đỏ nơi diễu hành."},
        {id:46, question:"Лужники построили в 1956 году.", correct:"Sân vận động Luzhniki được xây năm 1956.", wrong1:"Luzhniki xây xong năm 1956.", wrong2:"Năm 1956 xây dựng Luzhniki.", wrong3:"Luzhniki được xây dựng từ 1956."},
        {id:47, question:"Воробьёвы горы - красивое место в Москве.", correct:"Đồi Chim sẻ là nơi đẹp ở Moscow.", wrong1:"Đồi Chim sẻ đẹp ở Moscow.", wrong2:"Moscow có đồi Chim sẻ đẹp.", wrong3:"Nơi đẹp ở Moscow là đồi Chim sẻ."},
        {id:48, question:"Российская государственная библиотека - крупнейшая в стране.", correct:"Thư viện Quốc gia Nga là thư viện lớn nhất cả nước.", wrong1:"Thư viện Quốc gia Nga lớn nhất nước.", wrong2:"Thư viện lớn nhất nước là Thư viện Quốc gia Nga.", wrong3:"Nga có thư viện lớn nhất là Thư viện Quốc gia."},
        {id:49, question:"Я был на вечеринке у Наташи.", correct:"Tôi đã ở bữa tiệc của Natasha.", wrong1:"Tôi đã gặp Natasha ở bữa tiệc.", wrong2:"Natasha mời tôi dự tiệc.", wrong3:"Tôi và Natasha dự tiệc."},
        {id:50, question:"Мы хотим познакомиться с вами.", correct:"Chúng tôi muốn làm quen với các bạn.", wrong1:"Các bạn muốn làm quen với chúng tôi.", wrong2:"Chúng tôi muốn giới thiệu các bạn.", wrong3:"Chúng tôi sẽ quen biết các bạn."}
    ];

    // ---------- BIẾN TOÀN CỤC (giữ nguyên so với bản gốc) ----------
    let currentScreen = 'screen1';
    let studentName = '';
    let currentTest = null;
    let timerInterval = null;
    let timeLeft = 0;
    let currentQuestionStartTime = 0;

    const nameInput = document.getElementById('student-name');
    const btnVocabMain = document.getElementById('btn-to-vocab-main');
    const btnGrammarMain = document.getElementById('btn-to-grammar-main');
    const btnTransMain = document.getElementById('btn-to-trans-main');
    const btnMixMain = document.getElementById('btn-to-mix-main');

    nameInput.addEventListener('input', (e) => {
        studentName = e.target.value.trim();
        const enable = studentName !== '';
        btnVocabMain.disabled = !enable;
        btnGrammarMain.disabled = !enable;
        btnTransMain.disabled = !enable;
        btnMixMain.disabled = !enable;
    });

    function showScreen(id) {
        document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        currentScreen = id;
        if (id === 'screen2-2') document.getElementById('vocab-test-name').innerText = studentName;
        if (id === 'screen3') document.getElementById('grammar-test-name').innerText = studentName;
        if (id === 'screen4') document.getElementById('trans-test-name').innerText = studentName;
        if (id === 'screen5') document.getElementById('mix-test-name').innerText = studentName;
    }

    document.getElementById('btn-to-vocab-main').addEventListener('click', () => showScreen('screen2'));
    document.getElementById('btn-to-grammar-main').addEventListener('click', () => showScreen('screen3'));
    document.getElementById('btn-to-trans-main').addEventListener('click', () => showScreen('screen4'));
    document.getElementById('btn-to-mix-main').addEventListener('click', () => showScreen('screen5'));
    document.getElementById('btn-back-from-vocab').addEventListener('click', () => showScreen('screen1'));
    document.getElementById('btn-back-from-grammar').addEventListener('click', () => showScreen('screen1'));
    document.getElementById('btn-back-from-trans').addEventListener('click', () => showScreen('screen1'));
    document.getElementById('btn-back-from-mix').addEventListener('click', () => showScreen('screen1'));
    document.getElementById('btn-back-from-list-top').addEventListener('click', () => showScreen('screen2'));
    document.getElementById('btn-back-from-list-bottom').addEventListener('click', () => showScreen('screen2'));
    document.getElementById('btn-back-from-vocab-test').addEventListener('click', () => showScreen('screen2'));
    document.getElementById('btn-to-list').addEventListener('click', () => { renderVocabTable(); showScreen('screen2-1'); });
    document.getElementById('btn-to-vocab-test').addEventListener('click', () => showScreen('screen2-2'));

    function renderVocabTable() {
        let html = `<table><tr><th>STT</th><th>Từ vựng</th><th>Từ loại</th><th>Nghĩa</th></tr>`;
        vocabBank.forEach((item, idx) => {
            html += `<tr>
                <td>${idx+1}</td>
                <td><i class="fas fa-volume-up speaker" data-word="${item.word}"></i> ${item.word}</td>
                <td>${item.pos}</td>
                <td>${item.correct}</td>
            </tr>`;
        });
        html += `</table>`;
        document.getElementById('vocab-table-container').innerHTML = html;
        document.querySelectorAll('.speaker').forEach(sp => {
            sp.addEventListener('click', (e) => {
                const word = e.target.getAttribute('data-word');
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'ru-RU';
                speechSynthesis.speak(utterance);
            });
        });
    }

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function buildQuestionList(type, count) {
        let bank;
        switch(type) {
            case 'vocab': bank = vocabBank; break;
            case 'grammar': bank = grammarBank; break;
            case 'trans': bank = transBank; break;
            case 'mix': bank = [...vocabBank, ...grammarBank, ...transBank]; break;
        }
        let shuffled = shuffleArray([...bank]);
        if (count === 'all') return shuffled;
        return shuffled.slice(0, parseInt(count));
    }

    function startTest(type, countElemId) {
        if (timerInterval) clearInterval(timerInterval);
        const count = document.getElementById(countElemId).value;
        let questions = buildQuestionList(type, count);
        const qWithType = questions.map(q => {
            if (q.hasOwnProperty('word')) return {...q, _type: 'vocab'};
            else if (q.hasOwnProperty('question') && grammarBank.some(g => g.id === q.id && g.question === q.question)) return {...q, _type: 'grammar'};
            else return {...q, _type: 'trans'};
        });
        currentTest = {
            type: type,
            questions: qWithType,
            index: 0,
            correct: 0,
            answers: [],
        };
        showScreen('screen-test');
        document.getElementById('test-user-display').innerText = studentName;
        loadQuestion(0);
    }

    function loadQuestion(idx) {
        if (idx >= currentTest.questions.length) {
            finishTest();
            return;
        }
        const q = currentTest.questions[idx];
        let timeSec = 8;
        if (q._type === 'grammar' || q._type === 'trans') timeSec = 30;
        if (currentTest.type === 'mix') {
            if (q._type === 'vocab') timeSec = 8;
            else timeSec = 30;
        }
        timeLeft = timeSec;
        document.getElementById('timer-fill').style.width = '100%';
        if (timerInterval) clearInterval(timerInterval);
        timerInterval = setInterval(() => {
            timeLeft -= 1;
            const percent = (timeLeft / timeSec) * 100;
            document.getElementById('timer-fill').style.width = `${percent}%`;
            if (timeLeft <= 0) {
                clearInterval(timerInterval);
                currentTest.answers.push({
                    question: q,
                    chosen: null,
                    correctAnswer: q.correct || (grammarBank.find(g => g.id === q.id)?.correct) || (transBank.find(t => t.id === q.id)?.correct),
                    isCorrect: false
                });
                currentTest.index++;
                document.getElementById('correct-counter').innerText = `ĐÚNG ${currentTest.correct}`;
                loadQuestion(currentTest.index);
            }
        }, 1000);

        let questionText = q.question || q.word;
        if (q._type === 'vocab') questionText = q.word;
        document.getElementById('question-text').innerText = questionText;

        let options = [q.correct, q.wrong1, q.wrong2, q.wrong3];
        options = shuffleArray(options);
        const optsHtml = options.map(opt => `<div class="option" data-opt="${opt}">${opt}</div>`).join('');
        document.getElementById('options-container').innerHTML = optsHtml;

        document.querySelectorAll('.option').forEach(optDiv => {
            optDiv.addEventListener('click', (e) => {
                if (timerInterval) clearInterval(timerInterval);
                const chosen = e.target.getAttribute('data-opt');
                const correctAns = q.correct;
                const isCorrect = (chosen === correctAns);
                if (isCorrect) currentTest.correct++;
                currentTest.answers.push({
                    question: q,
                    chosen: chosen,
                    correctAnswer: correctAns,
                    isCorrect: isCorrect
                });
                document.getElementById('correct-counter').innerText = `ĐÚNG ${currentTest.correct}`;
                currentTest.index++;
                loadQuestion(currentTest.index);
            });
        });
    }

    function finishTest() {
        if (timerInterval) clearInterval(timerInterval);
        showScreen('screen-report');
        const total = currentTest.questions.length;
        const correct = currentTest.correct;
        const percent = Math.round((correct / total) * 100);
        document.getElementById('report-name').innerText = studentName;
        document.getElementById('report-title').innerText = `KẾT QUẢ ${currentTest.type.toUpperCase()} – BÀI 1`; // Đổi thành BÀI 1
        const now = new Date();
        const dateStr = now.toLocaleDateString('vi-VN');
        const timeStr = now.toLocaleTimeString('vi-VN');
        document.getElementById('report-date').innerText = dateStr;
        document.getElementById('report-time').innerText = timeStr;

        const canvas = document.getElementById('pieChart');
        const ctx = canvas.getContext('2d');
        ctx.clearRect(0,0,220,220);
        let color;
        if (percent < 50) color = '#f5222d';
        else if (percent < 70) color = '#faad14';
        else if (percent < 80) color = '#52c41a';
        else if (percent < 90) color = '#13c2c2';
        else if (percent < 100) color = '#1890ff';
        else color = '#722ed1';

        const centerX = 110, centerY = 110;
        const outerR = 90, innerR = 60;
        const startAngle = -Math.PI / 2;
        const endAngle = startAngle + (percent / 100) * 2 * Math.PI;

        ctx.beginPath();
        ctx.arc(centerX, centerY, outerR, 0, 2 * Math.PI);
        ctx.fillStyle = '#e0e0e0';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(centerX, centerY, innerR, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        if (percent > 0) {
            ctx.beginPath();
            ctx.moveTo(centerX, centerY);
            ctx.arc(centerX, centerY, outerR, startAngle, endAngle);
            ctx.closePath();
            ctx.fillStyle = color;
            ctx.fill();
        }

        ctx.beginPath();
        ctx.arc(centerX, centerY, innerR, 0, 2 * Math.PI);
        ctx.fillStyle = '#ffffff';
        ctx.fill();

        ctx.fillStyle = '#000000';
        ctx.font = 'bold 24px Arial';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(percent + '%', centerX, centerY);

        let tableHtml = `<table><tr><th>STT</th><th>Câu hỏi</th><th>Bạn chọn</th><th>Đáp án đúng</th></tr>`;
        currentTest.answers.forEach((ans, i) => {
            const qText = ans.question.question || ans.question.word;
            const chosen = ans.chosen || '(hết giờ)';
            const rowClass = ans.isCorrect ? '' : 'wrong-answer';
            tableHtml += `<tr class="${rowClass}"><td>${i+1}</td><td>${qText}</td><td>${chosen}</td><td>${ans.correctAnswer}</td></tr>`;
        });
        tableHtml += '</table>';
        document.getElementById('answer-table-container').innerHTML = tableHtml;
    }

    document.getElementById('btn-start-vocab-test').addEventListener('click', () => startTest('vocab', 'vocab-question-count'));
    document.getElementById('btn-start-grammar-test').addEventListener('click', () => startTest('grammar', 'grammar-question-count'));
    document.getElementById('btn-start-trans-test').addEventListener('click', () => startTest('trans', 'trans-question-count'));
    document.getElementById('btn-start-mix-test').addEventListener('click', () => startTest('mix', 'mix-question-count'));

    document.getElementById('btn-abort-test').addEventListener('click', () => {
        if (timerInterval) clearInterval(timerInterval);
        showScreen('screen1');
    });

    document.getElementById('btn-retry').addEventListener('click', () => {
        if (timerInterval) clearInterval(timerInterval);
        showScreen('screen1');
    });
    document.getElementById('btn-back-from-report').addEventListener('click', () => {
        if (timerInterval) clearInterval(timerInterval);
        showScreen('screen1');
    });

})();
</script>
