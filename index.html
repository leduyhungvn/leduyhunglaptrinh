<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Luyện nghe TA Lớp 6</title>
    <!-- Chống tự động dịch thuật -->
    <meta name="google" content="notranslate">
    <meta http-equiv="Content-Language" content="en">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Roboto, system-ui, -apple-system, sans-serif;
        }
        body {
            background: linear-gradient(145deg, #f0f4fa 0%, #e6ecf5 100%);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        /* Container chính để căn giữa và đồng bộ chiều ngang */
        .app-container {
            width: 100%;
            max-width: 900px; /* đồng bộ chiều ngang tối đa cho cả 3 màn */
            margin: 0 auto;
        }
        .main-card {
            width: 100%;
            background: rgba(255,255,255,0.85);
            backdrop-filter: blur(12px);
            border-radius: 48px;
            padding: 30px 32px;
            box-shadow: 0 25px 50px -8px rgba(0,20,40,0.3);
            border: 1px solid rgba(255,255,255,0.6);
            margin-bottom: 20px;
        }
        /* Responsive: trên mobile vẫn giữ padding nhỏ hơn */
        @media (max-width: 700px) {
            body { padding: 10px; }
            .main-card { padding: 20px 16px; border-radius: 32px; }
        }
        
        h1, h2, h3 {
            font-weight: 600;
            letter-spacing: -0.02em;
            word-break: break-word;
        }
        h1 {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 25px;
            border-left: 8px solid #2a5298;
            padding-left: 20px;
        }
        @media (max-width: 700px) {
            h1 { font-size: 1.8rem; border-left-width: 6px; padding-left: 16px; }
        }
        
        h2 {
            font-size: 1.6rem;
            margin-bottom: 8px;
            line-height: 1.3;
            color: #1e3c72;
        }
        .title-sub {
            font-size: 1.3rem;
            color: #2a5298;
            margin-bottom: 20px;
            font-weight: 500;
            padding-left: 4px;
        }
        @media (max-width: 700px) {
            h2 { font-size: 1.4rem; }
            .title-sub { font-size: 1.2rem; }
        }
        
        .flex-col {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .row {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            align-items: center;
        }
        .label-input {
            display: flex;
            align-items: center;
            gap: 12px;
            background: white;
            padding: 10px 24px;
            border-radius: 60px;
            box-shadow: inset 2px 2px 8px #b8c3d0, inset -4px -4px 8px #ffffff;
            width: 100%;
        }
        .label-input label {
            font-weight: 600;
            color: #1e2f4d;
            font-size: 1rem;
            white-space: nowrap;
        }
        .label-input input, .label-input select {
            border: none;
            background: transparent;
            font-size: 1rem;
            padding: 8px 0;
            outline: none;
            font-weight: 500;
            width: 100%;
            min-width: 0;
        }
        .btn-group {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            margin: 20px 0 10px;
            justify-content: center;
        }
        .btn {
            background: white;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 6px 6px 16px #b8c3d0, -6px -6px 16px #ffffff;
            cursor: pointer;
            transition: 0.15s;
            color: #1e2f4d;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            flex: 0 1 auto;
            justify-content: center;
        }
        .btn:active {
            box-shadow: inset 6px 6px 12px #b8c3d0, inset -6px -6px 12px #ffffff;
            transform: scale(0.97);
        }
        .btn.primary {
            background: #2a5298;
            color: white;
            box-shadow: 6px 6px 16px #1e3c72, -6px -6px 16px #3f6ab3;
        }
        @media (max-width: 700px) {
            .btn { padding: 12px 24px; font-size: 1.1rem; }
        }
        
        .footer-info {
            margin-top: 30px;
            background: #d9e2ef;
            border-radius: 40px;
            padding: 20px 30px;
            text-align: center;
            font-weight: 500;
            color: #102a4c;
            border: 1px solid #ffffff80;
        }
        .footer-info p {
            margin: 6px 0;
            font-size: 1rem;
        }
        .footer-info .zalo {
            font-size: 1.3rem;
            font-weight: 700;
            background: #0068ff20;
            display: inline-block;
            padding: 6px 32px;
            border-radius: 60px;
        }
        
        /* giao diện làm bài / báo cáo */
        .audio-panel {
            background: #eef3fc;
            border-radius: 60px;
            padding: 16px 24px;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 16px;
            margin: 20px 0 25px;
            box-shadow: inset 2px 2px 8px #b8c3d0, inset -4px -4px 10px white;
        }
        .audio-panel select, .audio-panel button {
            background: white;
            border: none;
            padding: 10px 18px;
            border-radius: 40px;
            font-size: 0.95rem;
            font-weight: 600;
            box-shadow: 3px 3px 8px #b8c3d0;
            flex: 1 0 auto;
            min-width: 80px;
        }
        .speaker-icon {
            font-size: 2rem;
            cursor: pointer;
            background: #2a5298;
            color: white;
            width: 56px;
            height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 40px;
            box-shadow: 0 5px 0 #102a4c;
            flex-shrink: 0;
        }
        .question-item {
            background: white;
            border-radius: 32px;
            padding: 22px 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
        }
        .question-text {
            font-weight: 600;
            margin-bottom: 18px;
            font-size: 1.1rem;
            line-height: 1.5;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-left: 8px;
        }
        .option {
            display: flex;
            align-items: center;
            gap: 16px;
            background: #f3f7ff;
            padding: 12px 20px;
            border-radius: 60px;
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 1rem;
            word-break: break-word;
        }
        .option.selected {
            border-color: #2a5298;
            background: #cddcff;
        }
        .option input {
            accent-color: #2a5298;
            width: 20px;
            height: 20px;
            flex-shrink: 0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 10px 25px #00000015;
            font-size: 0.95rem;
        }
        th {
            background: #2a5298;
            color: white;
            padding: 14px 10px;
            font-weight: 600;
            font-size: 0.95rem;
        }
        td {
            padding: 12px 10px;
            border-bottom: 1px solid #d0ddef;
            word-break: break-word;
        }
        .wrong-answer {
            background: #ffccc7;
            color: #a8071a;
            font-weight: 600;
            border-radius: 30px;
            padding: 4px 12px;
            display: inline-block;
        }
        .correct-answer {
            background: #b7eb8f;
            color: #237804;
            font-weight: 600;
            border-radius: 30px;
            padding: 4px 12px;
            display: inline-block;
            border: 2px solid #52c41a;
        }
        .report-chart-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Desktop: 2 cột */
            gap: 30px;
            margin: 25px 0;
        }
        /* Mobile: chuyển thành 1 cột */
        @media (max-width: 700px) {
            .report-chart-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
        }
        
        .chart-box {
            background: white;
            border-radius: 48px;
            padding: 25px;
            box-shadow: 0 15px 30px #0000001a;
            text-align: center;
        }
        .pie {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin: 15px auto;
            background: conic-gradient(#f5222d 0deg 180deg, #faad14 180deg 360deg);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            /* Đã xóa box-shadow để bỏ bóng mờ bên ngoài */
        }
        .pie span {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 2.5rem;
            color: #1e2f4d; /* màu mặc định, sẽ được thay đổi theo thuật toán trong code */
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
        }
        .stat-item {
            background: white;
            border-radius: 32px;
            padding: 20px 12px;
            font-weight: 600;
            box-shadow: 0 5px 0 #b8c3d0;
            text-align: center;
            font-size: 1.2rem;
            word-break: break-word;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100px;
        }
        .stat-item div:first-child {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: #1e2f4d;
        }
        .stat-item div:last-child {
            font-size: 1.4rem;
            font-weight: 700;
            color: #2a5298;
        }
        /* Mobile adjustments */
        @media (max-width: 700px) {
            .stat-item {
                font-size: 1rem;
                padding: 15px 8px;
                min-height: 80px;
            }
            .stat-item div:first-child { font-size: 0.95rem; }
            .stat-item div:last-child { font-size: 1.2rem; }
        }
        
        .hidden-passage {
            background: #f0f5ff;
            border-radius: 36px;
            padding: 25px;
            margin: 25px 0;
            white-space: pre-line;
            font-size: 1rem;
            line-height: 1.6;
        }
        
        /* Nút quay lại và lên đầu trang - đặt ở cuối */
        .action-buttons-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
            margin-bottom: 5px;
            gap: 16px;
            flex-wrap: wrap;
        }
        .scroll-top {
            background: white;
            width: 56px;
            height: 56px;
            border-radius: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            box-shadow: 4px 4px 14px #b8c3d0;
            cursor: pointer;
            text-decoration: none;
            color: #1e2f4d;
            transition: 0.2s;
            flex-shrink: 0;
        }
        .scroll-top:active {
            box-shadow: inset 4px 4px 10px #b8c3d0;
            transform: scale(0.95);
        }
        .btn-back {
            background: white;
            border: none;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 1.2rem;
            box-shadow: 6px 6px 16px #b8c3d0, -6px -6px 16px #ffffff;
            cursor: pointer;
            color: #1e2f4d;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        
        /* không dịch */
        * {
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>

                        <div class="label-input">
                            <label>📖 BÀI</label>
                            <select id="baiSelect">${BAI_ITEMS.map(b => `<option value="${b}" ${selectedBai===b?'selected':''}>${b}</option>`).join('')}
                            </select>
                        </div>
                        <div class="label-input">
                            <label>🎯 DẠNG</label>
                            <select id="dangSelect">${DANG_BAI.map(d => `<option value="${d}" ${selectedDang===d?'selected':''}>${d}</option>`).join('')}
                            </select>
                        </div>
                        <div class="btn-group">
                            <button class="btn primary" id="startBtn">▶ LÀM BÀI</button>
                        </div>
                    </div>
                    <div class="footer-info">
                        <p>👨‍🏫 Thầy Hùng</p>
                        <p>Giáo viên dạy kèm Toán, tiếng Anh</p>
                        <p class="zalo">📞 Zalo: 0967.095.025</p>
                    </div>
                    <!-- nút lên đầu trang cho main -->
                    <div class="action-buttons-container">
                        <div></div> <!-- placeholder cho cân bằng -->
                        <a href="#" class="scroll-top" id="scrollTopMain">⬆️</a>
                    </div>
                </div>
            `;
            app.innerHTML = html;
            document.getElementById('studentNameInput').addEventListener('input', (e) => studentName = e.target.value);
            document.getElementById('unitSelect').addEventListener('change', (e) => selectedUnit = e.target.value);
            document.getElementById('baiSelect').addEventListener('change', (e) => selectedBai = e.target.value);
            document.getElementById('dangSelect').addEventListener('change', (e) => selectedDang = e.target.value);
            document.getElementById('startBtn').addEventListener('click', () => {
                if (!studentName.trim()) { alert('Vui lòng nhập tên'); return; }
                if (!prepareQuizData()) {
                    alert('Bài học chưa có nội dung (vui lòng khai báo biến).');
                    return;
                }
                currentScreen = 'quiz';
                startTime = Date.now();
                endTime = null;
                userAnswers = [];
                audioEnabled = false;
                render();
            });
            document.getElementById('scrollTopMain').addEventListener('click', (e)=>{ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); });
        }

        function prepareQuizData() {
            const unitKey = selectedUnit.replace('UNIT ','U');
            const baiKey = selectedBai.replace('BÀI ','B').replace('KIỂM TRA NGẪU NHIÊN','random');
            let dataKey = '';
            if (baiKey.includes('random')) {
                const r = Math.floor(Math.random() * 12) + 1;
                dataKey = `E6_${unitKey}_B${r}`;
            } else {
                dataKey = `E6_${unitKey}_${baiKey}`;
            }
            // @ts-ignore
            let rawData = window[dataKey];
            if (!rawData) {
                alert(`Chưa có nội dung cho ${dataKey}, dùng bài mẫu U1_B1 thay thế.`);
                rawData = E6_U1_B1; 
            }
            let questionPool = [];
            if (selectedDang.includes('TRẮC NGHIỆM TRẢ LỜI CÂU HỎI')) questionPool = rawData.P1 || [];
            else if (selectedDang.includes('TRUE – FALSE')) questionPool = rawData.P2 || [];
            else if (selectedDang.includes('ĐIỀN KHUYẾT')) questionPool = rawData.P3 || [];

            if (!questionPool.length) {
                alert('Dạng bài này chưa có câu hỏi.');
                return false;
            }

            const shuffled = [...questionPool].sort(()=>0.5-Math.random()).slice(0,5);
            quizData = shuffled.map(q => {
                let opts = [q.correct, q.wrong1, q.wrong2];
                for (let i = opts.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [opts[i], opts[j]] = [opts[j], opts[i]];
                }
                return {
                    id: q.id,
                    question: q.word,
                    options: opts,
                    correct: q.correct
                };
            });
            return true;
        }

        // ----- AUDIO HELPERS -----
        function stopAllAudio() {
            speechSynthesis.cancel();
            if (currentAudioInterval) {
                clearInterval(currentAudioInterval);
                currentAudioInterval = null;
            }
            if (audioTimeout) {
                clearTimeout(audioTimeout);
                audioTimeout = null;
            }
            audioQueue = [];
            isPaused = false;
        }

        function pauseAudio() {
            if (speechSynthesis.speaking) {
                speechSynthesis.pause();
                isPaused = true;
            }
            if (currentAudioInterval) {
                clearInterval(currentAudioInterval);
                currentAudioInterval = null;
            }
            if (audioTimeout) {
                clearTimeout(audioTimeout);
                audioTimeout = null;
            }
        }

        function resumeAudio() {
            if (isPaused && speechSynthesis.paused) {
                speechSynthesis.resume();
                isPaused = false;
                return;
            }
        }

        function playAudioSentences(sentences, gapSec, loop) {
            stopAllAudio();
            if (!sentences || sentences.length === 0) return;
            
            audioQueue = [];
            sentences.forEach(s => {
                for (let i = 0; i < loop; i++) {
                    audioQueue.push(s.word);
                }
            });

            let index = 0;
            const playNext = () => {
                if (index >= audioQueue.length) {
                    stopAllAudio();
                    return;
                }
                const utterance = new SpeechSynthesisUtterance(audioQueue[index]);
                utterance.lang = 'en-GB';
                utterance.onend = () => {
                    index++;
                    if (index < audioQueue.length && !isPaused) {
                        audioTimeout = setTimeout(playNext, gapSec * 1000);
                    } else if (index >= audioQueue.length) {
                        stopAllAudio();
                    }
                };
                utterance.onerror = () => {
                    index++;
                    if (index < audioQueue.length && !isPaused) {
                        audioTimeout = setTimeout(playNext, gapSec * 1000);
                    }
                };
                speechSynthesis.speak(utterance);
            };
            playNext();
        }

        // ------- QUIZ SCREEN --------
        function renderQuiz() {
            let titleBai = selectedBai === 'KIỂM TRA NGẪU NHIÊN' ? 'KTRA' : selectedBai;
            let html = `
                <div class="main-card">
                    <h2>📘 LỚP 6 - ${selectedUnit} - ${titleBai}</h2>
                    <div class="title-sub">${selectedDang}</div>
                    
                    <div class="audio-panel" id="audioPanel">
                        <span class="speaker-icon" id="playSpeaker">🔊</span>
                        <select id="gapTimeSelect">
                            <option value="0.5">0.5s</option><option value="1" selected>1s</option><option value="2">2s</option><option value="3">3s</option><option value="4">4s</option><option value="5">5s</option><option value="6">6s</option>
                        </select>
                        <select id="loopCountSelect">
                            <option value="1">1 lần</option><option value="2">2 lần</option><option value="3">3 lần</option><option value="4">4 lần</option>
                        </select>
                        <button id="pauseAudioBtn">⏸️</button>
                        <button id="stopAudioBtn">⏹️</button>
                    </div>
                    <div id="quizQuestions"></div>
                    <div class="btn-group"><button class="btn primary" id="submitQuizBtn">📩 NỘP BÀI</button></div>
                    
                    <!-- nút quay lại và lên đầu trang ở cuối -->
                    <div class="action-buttons-container">
                        <button class="btn-back" id="backToMainBtn">◀ QUAY LẠI</button>
                        <a href="#" class="scroll-top" id="scrollTopQuiz">⬆️</a>
                    </div>
                </div>
            `;
            app.innerHTML = html;

            let qDiv = document.getElementById('quizQuestions');
            quizData.forEach((q, idx) => {
                let qHtml = `<div class="question-item" data-qidx="${idx}"><div class="question-text">${idx+1}. ${q.question}</div><div class="options">`;
                q.options.forEach((opt, optIdx) => {
                    let checked = (userAnswers[idx] && userAnswers[idx].chosen === opt) ? 'checked' : '';
                    qHtml += `<label class="option ${checked ? 'selected' : ''}"><input type="radio" name="q${idx}" value="${opt}" ${checked}> ${opt}</label>`;
                });
                qHtml += '</div></div>';
                qDiv.innerHTML += qHtml;
            });

            document.querySelectorAll('.question-item input[type=radio]').forEach(radio => {
                radio.addEventListener('change', function(e) {
                    let name = this.name;
                    let qIndex = parseInt(name.substring(1));
                    let chosen = this.value;
                    if (!userAnswers[qIndex]) userAnswers[qIndex] = {};
                    userAnswers[qIndex].chosen = chosen;
                    document.querySelectorAll(`input[name="${name}"]`).forEach(r => {
                        r.closest('.option').classList.remove('selected');
                    });
                    this.closest('.option').classList.add('selected');
                });
            });

            document.getElementById('backToMainBtn').addEventListener('click', ()=>{ 
                stopAllAudio();
                currentScreen = 'main'; render();
            });
            document.getElementById('scrollTopQuiz').addEventListener('click', (e)=>{ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); });
            
            document.getElementById('playSpeaker').addEventListener('click', ()=>{
                if (!audioEnabled) { startTime = Date.now(); audioEnabled = true; }
                let raw = window[`E6_${selectedUnit.replace('UNIT ','U')}_B1`] || E6_U1_B1;
                let sentences = raw.P5A || [];
                let gap = parseFloat(document.getElementById('gapTimeSelect').value);
                let loop = parseInt(document.getElementById('loopCountSelect').value);
                playAudioSentences(sentences, gap, loop);
            });

            document.getElementById('pauseAudioBtn').addEventListener('click', ()=>{
                if (isPaused) resumeAudio(); else pauseAudio();
            });

            document.getElementById('stopAudioBtn').addEventListener('click', ()=>{
                stopAllAudio();
            });

            document.getElementById('submitQuizBtn').addEventListener('click', ()=>{
                if (userAnswers.filter(a=>a?.chosen).length !== 5) { alert('Vui lòng trả lời đủ 5 câu'); return; }
                endTime = Date.now();
                stopAllAudio();
                currentScreen = 'report';
                render();
            });
        }

        // ---------- REPORT SCREEN ----------
        function renderReport() {
            let total = 5;
            let correctCount = userAnswers.filter((ans,i)=> ans?.chosen === quizData[i]?.correct).length;
            let percent = (correctCount/total)*100;
            let color = percent<50?'#f5222d':percent<70?'#faad14':percent<80?'#52c41a':percent<90?'#13c2c2':percent<100?'#1890ff':'#722ed1';
            let startStr = startTime ? new Date(startTime).toLocaleTimeString() : '';
            let endStr = endTime ? new Date(endTime).toLocaleTimeString() : '';
            let streak = 0, maxStreak=0;
            userAnswers.forEach((a,i)=> { if(a?.chosen===quizData[i]?.correct) streak++; else { maxStreak=Math.max(maxStreak,streak); streak=0; } });
            maxStreak=Math.max(maxStreak,streak);
            let totalTime = endTime && startTime ? Math.round((endTime-startTime)/1000) : 0;
            
            let titleBai = selectedBai === 'KIỂM TRA NGẪU NHIÊN' ? 'KIỂM TRA' : selectedBai;
            let html = `
                <div class="main-card">
                    <h2>📊 BÁO CÁO LỚP 6 - ${selectedUnit} - ${titleBai}</h2>
                    <div class="title-sub">${selectedDang}</div>
                    
                    <div class="report-chart-grid">
                        <div class="chart-box">
                            <div style="font-weight:800; font-size:2.4rem; color:blue; margin-bottom:10px;">${studentName}</div>
                            <div class="pie" style="background: conic-gradient(${color} 0deg ${percent*3.6}deg, #e0e0e0 ${percent*3.6}deg 360deg);">
                                <span style="color: ${color};">${Math.round(percent)}%</span>
                            </div>
                            <div style="font-weight:bold; color:#1e3c72; margin-top:15px;">${new Date().toLocaleDateString()}</div>
                        </div>
                        <div class="stats-grid">
                            <div class="stat-item">
                                <div>⏱️ START</div>
                                <div>${startStr}</div>
                            </div>
                            <div class="stat-item">
                                <div>⌛ END</div>
                                <div>${endStr}</div>
                            </div>
                            <div class="stat-item">
                                <div>🔗 CHUỖI</div>
                                <div>${maxStreak}/${correctCount}/${total}</div>
                            </div>
                            <div class="stat-item">
                                <div>⏳ Tổng</div>
                                <div>${totalTime}s</div>
                            </div>
                        </div>
                    </div>

                    <!-- Audio Panel dưới thông tin -->
                    <div class="audio-panel" id="audioPanelReport">
                        <span class="speaker-icon" id="playSpeakerReport">🔊</span>
                        <select id="gapTimeSelectReport"><option value="0.5">0.5s</option><option value="1">1s</option><option value="2">2s</option><option value="3">3s</option><option value="4">4s</option><option value="5">5s</option><option value="6">6s</option></select>
                        <select id="loopCountSelectReport"><option value="1">1</option><option value="2">2</option><option value="3">3</option><option value="4">4</option></select>
                        <button id="pauseAudioBtnReport">⏸️</button><button id="stopAudioBtnReport">⏹️</button>
                    </div>

                    <button class="btn" id="togglePassageBtn">📄 HIỆN đoạn văn P4</button>
                    <div id="passageContainer" style="display:none;" class="hidden-passage">${(window[`E6_${selectedUnit.replace('UNIT ','U')}_B1`]||E6_U1_B1).P4}</div>
                    <h3>📋 Chi tiết câu hỏi</h3>
                    <table>
                        <tr><th>STT</th><th>Nội dung</th><th>Đáp án chọn</th><th>Đáp án đúng</th></tr>`;
            quizData.forEach((q,i)=>{
                let chosen = userAnswers[i]?.chosen || '—';
                let correct = q.correct;
                let wrongClass = (chosen !== correct) ? 'wrong-answer' : '';
                let correctDisplay = `<span class="correct-answer">${correct}</span>`;
                html += `<tr>
                    <td>${i+1}</td>
                    <td>${q.question}</td>
                    <td class="${wrongClass}">${chosen}</td>
                    <td>${correctDisplay}</td>
                </tr>`;
            });
            html += `</table><br>
                    <div class="action-buttons-container">
                        <button class="btn-back" id="backToMainBtnReport">◀ QUAY LẠI</button>
                        <a href="#" class="scroll-top" id="scrollTopReport">⬆️</a>
                    </div>
                </div>`;
            app.innerHTML = html;
            
            document.getElementById('backToMainBtnReport').addEventListener('click',()=>{ stopAllAudio(); currentScreen='main';render(); });
            document.getElementById('scrollTopReport').addEventListener('click',(e)=>{e.preventDefault();window.scrollTo({top:0,behavior:'smooth'});});
            document.getElementById('togglePassageBtn').addEventListener('click',(e)=>{
                let c=document.getElementById('passageContainer'); c.style.display=c.style.display==='none'?'block':'none';
            });
            
            document.getElementById('playSpeakerReport').addEventListener('click',()=>{
                let raw = window[`E6_${selectedUnit.replace('UNIT ','U')}_B1`] || E6_U1_B1;
                let sentences = raw.P5A || [];
                let gap = parseFloat(document.getElementById('gapTimeSelectReport').value);
                let loop = parseInt(document.getElementById('loopCountSelectReport').value);
                playAudioSentences(sentences, gap, loop);
            });

            document.getElementById('pauseAudioBtnReport').addEventListener('click', ()=>{
                if (isPaused) resumeAudio(); else pauseAudio();
            });

            document.getElementById('stopAudioBtnReport').addEventListener('click', ()=>{
                stopAllAudio();
            });
        }
        // khởi tạo
        render();
        window.E6_U1_B1 = E6_U1_B1;
        window.E6_U2_B1 = E6_U2_B1;
    })();
</script>
</body>
</html>
