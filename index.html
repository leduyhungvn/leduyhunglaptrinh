<style>
/* CSS CHUNG */
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
}

body {
background-color: #f5f7fa;
color: #333;
line-height: 1.4;
}

.container {
max-width: 1000px;
margin: 0 auto;
padding: 10px; /* Giảm padding ngoài để rộng hơn trên mobile */
}

header {
text-align: center;
margin-bottom: 15px;
padding: 15px;
background: linear-gradient(135deg, #1e5799, #207cca);
color: white;
border-radius: 10px;
box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
}

h1 {
font-size: 28px;
margin-bottom: 5px;
}

.screen {
display: none;
background-color: white;
border-radius: 10px;
box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
padding: 20px;
margin-bottom: 20px;
}

.active {
display: block;
}

/* Form & Buttons */
.form-group {
margin-bottom: 15px;
}

label {
display: block;
margin-bottom: 5px;
font-weight: 600;
color: #2c3e50;
font-size: 16px;
}

input, select {
width: 100%;
padding: 12px;
border: 1px solid #ddd;
border-radius: 5px;
font-size: 16px;
transition: border-color 0.3s;
}

input:focus, select:focus {
border-color: #3498db;
outline: none;
}

.row {
display: flex;
gap: 15px;
margin-bottom: 15px;
}

.col {
flex: 1;
}

.btn {
display: inline-block;
padding: 12px 24px;
background-color: #3498db;
color: white;
border: none;
border-radius: 5px;
font-size: 16px;
cursor: pointer;
transition: background-color 0.3s;
text-align: center;
margin-right: 10px;
margin-top: 10px;
width: 100%;
}

.btn:hover {
background-color: #2980b9;
}

.btn-secondary { background-color: #7f8c8d; }
.btn-success { background-color: #2ecc71; }
.btn-danger { background-color: #e74c3c; }

/* Test Screen */
.test-header-container {
display: flex;
justify-content: space-between;
align-items: center;
margin-bottom: 15px;
padding-bottom: 10px;
border-bottom: 1px solid #eee;
}
.test-title { font-size: 20px; font-weight: bold; color: #2c3e50; }
.test-info { display: flex; align-items: center; gap: 10px; }
.timer { text-align: center; font-size: 28px; font-weight: bold; color: #e74c3c; background: #f9f9f9; padding: 5px 10px; border-radius: 5px; }
.question-counter { font-size: 18px; font-weight: bold; }

.question { margin-bottom: 20px; padding: 15px; background-color: #f9f9f9; border-radius: 8px; border-left: 4px solid #3498db; }
.question-number { font-weight: bold; color: #3498db; margin-bottom: 8px; font-size: 20px; }
.question-content { margin-bottom: 12px; font-size: 18px; }
.options { list-style-type: none; }
.option { padding: 10px 15px; margin-bottom: 8px; background-color: white; border-radius: 5px; cursor: pointer; border: 1px solid #e0e0e0; font-size: 18px; transition: all 0.2s; }
.option:hover { background-color: #f0f7ff; border-color: #3498db; }
.option.selected { background-color: #e1f0ff; border-color: #3498db; font-weight: bold; }

.notification {
position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
background-color: rgba(46, 204, 113, 0.9); color: white; padding: 15px 30px;
border-radius: 8px; font-size: 18px; font-weight: bold; z-index: 1000; display: none;
}

/* --- RESULT SCREEN STYLES (CẬP NHẬT MỚI) --- */

.result-header { text-align: center; margin-bottom: 10px; padding-bottom: 10px; border-bottom: 1px solid #eee; }
.result-header h2 { font-size: 22px; }

.result-wrapper {
display: flex;
flex-direction: row; /* Desktop: Ngang */
gap: 20px;
align-items: stretch;
}

/* --- Ô 1 (Bên trái) --- */
.result-left {
flex: 1;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
padding: 15px;
background-color: #fff;
border-radius: 8px;
text-align: center;
}

/* 3. Tên người làm (Tăng 30% so với gốc: 32px -> 42px) */
.student-name-display {
color: #1890ff; /* Xanh blue */
font-weight: bold;
font-size: 42px; 
margin-bottom: 15px;
line-height: 1.1;
}

/* Biểu đồ tròn Donut */
.chart-container {
position: relative;
width: 200px; /* Giảm nhẹ từ 220px để vừa trên màn hình ngắn */
height: 200px;
margin-bottom: 15px;
flex-shrink: 0;
}

.pie-chart {
width: 100%;
height: 100%;
border-radius: 50%;
background: conic-gradient(#eee 0% 100%);
display: flex;
align-items: center;
justify-content: center;
transition: background 1s ease-out;
}

.pie-chart::after {
content: ""; position: absolute; width: 75%; height: 75%;
background-color: white; border-radius: 50%;
}

/* 1. Tâm biểu đồ (Chính giữa tuyệt đối) */
.chart-center {
position: absolute;
top: 50%; left: 50%;
transform: translate(-50%, -50%);
text-align: center; z-index: 10;
width: 100%;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}

.percentage-text { display: block; font-size: 40px; font-weight: 800; color: #333; line-height: 1; }
.score-detail-text { display: block; font-size: 20px; font-weight: bold; color: #666; margin-top: 2px; }

/* 2. Ngày tháng (Tăng 15%: 16px -> 18.5px) */
.exam-date {
color: #000; font-weight: bold; font-size: 18.5px;
margin-top: auto; padding-top: 10px; border-top: 1px solid #eee; width: 100%;
}

/* --- Ô 2 (Bên phải) --- */
.result-right {
flex: 1;
display: grid;
grid-template-columns: 1fr 1fr;
grid-template-rows: 1fr 1fr;
gap: 10px;
}

.grid-item {
background-color: #f8f9fa;
border-radius: 8px;
padding: 10px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
text-align: center;
border: 1px solid #eee;
}

.grid-icon { width: 30px; height: 30px; margin-bottom: 5px; color: #555; }
.grid-label { font-size: 12px; color: #666; margin-bottom: 2px; }
/* 4. Thông số (Tăng 15%: 18px -> 21px) */
.grid-value { font-size: 21px; color: #333; font-weight: bold; }

/* Màu icon */
.grid-item.time-start .grid-icon { color: #27ae60; }
.grid-item.time-end .grid-icon { color: #e74c3c; }
.grid-item.wrong .grid-icon { color: #e67e22; }
.grid-item.unanswered .grid-icon { color: #95a5a6; }

/* Review List (Ẩn ở màn hình chính để tiết kiệm chỗ, hiện ở dưới) */
.review-list { margin-top: 20px; width: 100%; }
.review-item { padding: 10px; margin-bottom: 10px; border-radius: 8px; border-left: 4px solid; background-color: #fff; border: 1px solid #eee; }
.review-item.correct { border-left-color: #2ecc71; background-color: #f0fff4; }
.review-item.incorrect { border-left-color: #e74c3c; background-color: #fff5f5; }
.review-item.unanswered { border-left-color: #95a5a6; background-color: #f8f9fa; }
.review-question-title { font-weight: bold; margin-bottom: 5px; font-size: 16px; }
.review-options { margin-top: 5px; }
.review-option-row { padding: 3px 0; font-size: 14px; }
.review-opt-correct { color: #2ecc71; font-weight: bold; }
.review-opt-wrong { color: #e74c3c; text-decoration: line-through; }

/* --- MOBILE OPTIMIZATION (KEY CHANGE) --- */
@media (max-width: 768px) {
.row { flex-direction: column; gap: 10px; }
.btn { padding: 10px; font-size: 14px; }

/* Kết quả trên mobile: Xếp chồng dọc nhưng cực kỳ gọn để vừa 1 màn hình */
.result-wrapper {
flex-direction: column;
gap: 10px; /* Khoảng cách cực nhỏ */
}

/* Ô 1: Thu nhỏ lại */
.result-left {
padding: 10px 5px; /* Giảm padding dọc */
}

.student-name-display {
font-size: 24px; /* Thu nhỏ tên cho vừa */
margin-bottom: 5px;
}

.chart-container {
width: 140px; /* Thu nhỏ biểu đồ to */
height: 140px;
margin-bottom: 5px;
}

.percentage-text { font-size: 26px; }
.score-detail-text { font-size: 14px; }

.exam-date {
font-size: 14px; /* Ngày tháng nhỏ lại */
padding-top: 5px;
}

/* Ô 2: Lưới 2x2 nhỏ gọn */
.result-right {
width: 100%;
gap: 6px; /* Khoảng cách ô nhỏ */
}

.grid-item {
padding: 6px; /* Padding rất mỏng */
}

.grid-icon { width: 20px; height: 20px; margin-bottom: 2px; }
.grid-label { font-size: 10px; }
.grid-value { font-size: 14px; } /* Chữ số nhỏ lại */

/* Review list: Thu nhỏ font để scroll nhanh */
.review-item { padding: 8px; }
.review-question-title { font-size: 14px; }
.review-option-row { font-size: 12px; }

/* Giảm padding screen chính trên mobile */
.screen { padding: 10px; margin-bottom: 10px; }
}

/* MathJax */
.math-container { margin: 5px 0; padding: 5px; background-color: rgba(255,255,255,0.9); border-radius: 3px; overflow-x: auto; }
mjx-container { outline: none; }
</style>
</head>
<body>
<div class="container">
<header>
<h1>ÔN TẬP TRẮC NGHIỆM TOÁN</h1>
</header>

<!-- Màn hình chính -->
<div id="main-screen" class="screen active">
<div class="form-group">
<label for="student-name">Họ và tên:</label>
<input type="text" id="student-name" maxlength="40" placeholder="Nhập họ và tên (tối đa 40 ký tự)">
</div>

<div class="row">
<div class="col">
<div class="form-group">
<label for="grade-select">Chọn lớp:</label>
<select id="grade-select">
<option value="">-- Chọn lớp --</option>
<option value="1">TOÁN LỚP 1</option>
<option value="2">TOÁN LỚP 2</option>
<option value="3">TOÁN LỚP 3</option>
<option value="4">TOÁN LỚP 4</option>
<option value="5">TOÁN LỚP 5</option>
<option value="6">TOÁN LỚP 6</option>
<option value="7">TOÁN LỚP 7</option>
<option value="8">TOÁN LỚP 8</option>
<option value="9">TOÁN LỚP 9</option>
</select>
</div>
</div>

<div class="col">
<div class="form-group">
<label for="term-select">Chọn kỳ ôn tập:</label>
<select id="term-select">
<option value="">-- Chọn kỳ --</option>
<option value="GK1">GIỮA HỌC KÌ 1</option>
<option value="HK1">CUỐI HỌC KÌ 1</option>
<option value="GK2">GIỮA HỌC KÌ 2</option>
<option value="HK2">CUỐI HỌC KÌ 2</option>
</select>
</div>
</div>
</div>

<div class="form-group">
<label>Mã kho đề: <span id="code-display" style="font-weight: bold; color: #e74c3c;"></span></label>
</div>

<button id="start-btn" class="btn btn-success">Bắt đầu làm bài</button>

<div class="contact-info" style="background:#f8f9fa; padding:15px; border-radius:8px; text-align:center; font-size:14px; margin-top:15px;">
<h3 style="color:#2c3e50;">Thông tin liên hệ</h3>
<p><strong>Thầy Lê Duy Hùng</strong></p>
<p>ZALO: 0967 095 025</p>
<p>FACEBOOK: <a href="https://www.facebook.com/leduyhung.vietnam" target="_blank" style="color:#3498db;">https://www.facebook.com/leduyhung.vietnam</a></p>
</div>
</div>

<!-- Màn hình làm bài -->
<div id="test-screen" class="screen">
<div class="test-header-container">
<div class="test-title" id="test-title"></div>
<div class="test-info">
<div class="timer" id="timer">10:00</div>
<div class="question-counter">
Câu <span id="current-question-number">1</span>/<span id="total-questions">10</span>
</div>
</div>
</div>

<div id="current-question-container">
<!-- Câu hỏi hiện tại sẽ được hiển thị ở đây -->
</div>

<div style="text-align: center;">
<button id="submit-test-btn" class="btn btn-danger">NỘP BÀI</button>
</div>
</div>

<!-- Màn hình kết quả -->
<div id="result-screen" class="screen">
<div class="result-header">
<h2 id="result-title"></h2>
</div>

<!-- Layout kết quả (Tối ưu 1 màn hình điện thoại) -->
<div class="result-wrapper">
    
    <!-- Ô 1 -->
    <div class="result-left">
        <div class="student-name-display" id="result-student-name"></div>
        
        <div class="chart-container">
            <div class="pie-chart" id="score-chart"></div>
            <div class="chart-center">
                <span class="percentage-text" id="score-percentage">0%</span>
                <span class="score-detail-text" id="score-detail">0/10</span>
            </div>
        </div>
        
        <div class="exam-date" id="result-date"></div>
    </div>

    <!-- Ô 2 -->
    <div class="result-right">
        <!-- Thời gian bắt đầu -->
        <div class="grid-item time-start">
            <svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            <div class="grid-label">Bắt đầu</div>
            <div class="grid-value" id="start-time-hms">00:00:00</div>
        </div>

        <!-- Thời gian kết thúc -->
        <div class="grid-item time-end">
            <svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline><line x1="12" y1="10" x2="12" y2="10.01"></line></svg>
            <div class="grid-label">Kết thúc</div>
            <div class="grid-value" id="end-time-hms">00:00:00</div>
        </div>

        <!-- Số câu sai -->
        <div class="grid-item wrong">
            <svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>
            <div class="grid-label">Sai</div>
            <div class="grid-value" id="incorrect-count">0/10</div>
        </div>

        <!-- Chưa chọn -->
        <div class="grid-item unanswered">
            <svg class="grid-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="8"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
            <div class="grid-label">Chưa chọn</div>
            <div class="grid-value" id="unanswered-count">0/10</div>
        </div>
    </div>
</div>

<div class="review-list" id="review-list">
<!-- Kết quả chi tiết -->
</div>

<div style="text-align: center; margin-top: 20px;">
<button id="retry-btn" class="btn btn-success">LÀM LẠI</button>
<button id="back-btn" class="btn btn-secondary">QUAY LẠI</button>
</div>
</div>
</div>

<!-- Thông báo chuyển câu -->
<div id="notification" class="notification"></div>

<script>
// Dữ liệu cho các kho đề
const questionBanks = {

// Biến toàn cục
let currentScreen = 'main-screen';
let userAnswers = {};
let testStartTime = null;
let testSubmitTime = null;
let timerInterval = null;
let timeLeft = 600;
let currentTestCode = '';
let currentQuestions = [];
let studentName = '';
let currentQuestionIndex = 0;
let isTransitioning = false;

function showScreen(screenId) {
document.getElementById(currentScreen).classList.remove('active');
document.getElementById(screenId).classList.add('active');
currentScreen = screenId;
if (window.MathJax) {
setTimeout(() => {
MathJax.typesetPromise();
}, 100);
}
}

function updateTestCode() {
const grade = document.getElementById('grade-select').value;
const term = document.getElementById('term-select').value;
if (grade && term) {
const code = `T${grade}${term}`;
document.getElementById('code-display').textContent = code;
currentTestCode = code;
} else {
document.getElementById('code-display').textContent = '';
currentTestCode = '';
}
}

function shuffleArray(array) {
for (let i = array.length - 1; i > 0; i--) {
const j = Math.floor(Math.random() * (i + 1));
[array[i], array[j]] = [array[j], array[i]];
}
return array;
}

function convertQuestionToDisplayFormat(question) {
const options = [];
const labels = ['A', 'B', 'C', 'D'];
const allChoices = [
{ text: question.correct, isCorrect: true },
{ text: question.wrong1, isCorrect: false },
{ text: question.wrong2, isCorrect: false },
{ text: question.wrong3, isCorrect: false }
];
const shuffledChoices = shuffleArray([...allChoices]);
const correctChoice = shuffledChoices.find(choice => choice.isCorrect);
const correctIndex = shuffledChoices.indexOf(correctChoice);
const correctAnswer = labels[correctIndex];
shuffledChoices.forEach((choice, index) => {
options.push({
id: labels[index],
text: choice.text
});
});
return {
id: question.id,
content: question.content,
options: options,
correctAnswer: correctAnswer
};
}

function getRandomQuestions(code, count = 10) {
const bank = questionBanks[code];
if (!bank) return [];
if (bank.length <= count) {
return shuffleArray([...bank]).map((q, index) => ({
...convertQuestionToDisplayFormat(q),
displayOrder: index + 1
}));
}
const shuffled = shuffleArray([...bank]);
const selected = shuffled.slice(0, count);
return selected.map((q, index) => ({
...convertQuestionToDisplayFormat(q),
displayOrder: index + 1
}));
}

function startTest() {
studentName = document.getElementById('student-name').value.trim();
const grade = document.getElementById('grade-select').value;
const term = document.getElementById('term-select').value;
if (!studentName) {
alert('Vui lòng nhập họ và tên!');
return;
}
if (!grade || !term) {
alert('Vui lòng chọn lớp và kỳ ôn tập!');
return;
}
if (studentName.length > 40) {
alert('Họ và tên không được vượt quá 40 ký tự!');
return;
}
currentQuestions = getRandomQuestions(currentTestCode);
userAnswers = {};
timeLeft = 600;
testStartTime = new Date();
currentQuestionIndex = 0;
isTransitioning = false;
const testTitle = `${gradeNames[grade]} - ${termNames[term]}`;
document.getElementById('test-title').textContent = testTitle;
renderCurrentQuestion();
startTimer();
showScreen('test-screen');
document.addEventListener('visibilitychange', handleVisibilityChange);
}

function handleVisibilityChange() {
if (document.hidden) {
clearInterval(timerInterval);
submitTest();
}
}

function startTimer() {
clearInterval(timerInterval);
updateTimerDisplay();
timerInterval = setInterval(() => {
timeLeft--;
updateTimerDisplay();
if (timeLeft <= 0) {
clearInterval(timerInterval);
submitTest();
}
}, 1000);
}

function updateTimerDisplay() {
const minutes = Math.floor(timeLeft / 60);
const seconds = timeLeft % 60;
document.getElementById('timer').textContent =
`${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
if (timeLeft <= 60) {
document.getElementById('timer').style.color = '#e74c3c';
document.getElementById('timer').style.backgroundColor = '#ffebee';
}
}

function showNotification(message, duration = 1000) {
const notification = document.getElementById('notification');
notification.textContent = message;
notification.style.display = 'block';
setTimeout(() => {
notification.style.display = 'none';
}, duration);
}

function renderCurrentQuestion() {
const container = document.getElementById('current-question-container');
const question = currentQuestions[currentQuestionIndex];
let optionsHTML = '';
question.options.forEach(option => {
optionsHTML += `
<li class="option"
data-question="${question.id}" data-option="${option.id}">
<div class="math-container"><strong>${option.id}.</strong> ${option.text}</div>
</li>
`;
});
container.innerHTML = `
<div class="question">
<div class="question-number">Câu ${question.displayOrder} - ${currentTestCode} - ${question.id}</div>
<div class="question-content">
<div class="math-container">${question.content}</div>
</div>
<ul class="options">${optionsHTML}</ul>
</div>
`;
document.getElementById('current-question-number').textContent = currentQuestionIndex + 1;
document.getElementById('total-questions').textContent = currentQuestions.length;
document.querySelectorAll('.option').forEach(option => {
option.addEventListener('click', function() {
if (isTransitioning) return;
const questionId = this.getAttribute('data-question');
const optionId = this.getAttribute('data-option');
isTransitioning = true;
userAnswers[questionId] = optionId;
showNotification("Đã chọn đáp án!");
setTimeout(() => {
if (currentQuestionIndex >= currentQuestions.length - 1) {
submitTest();
} else {
currentQuestionIndex++;
renderCurrentQuestion();
isTransitioning = false;
}
}, 800);
});
});
if (window.MathJax) {
setTimeout(() => {
MathJax.typesetPromise();
}, 200);
}
}

function submitTest() {
clearInterval(timerInterval);
testSubmitTime = new Date();
document.removeEventListener('visibilitychange', handleVisibilityChange);
showResults();
}

function getScoreColor(percentage) {
if (percentage >= 0 && percentage <= 49) return '#f5222d';
else if (percentage >= 50 && percentage <= 69) return '#faad14';
else if (percentage >= 70 && percentage <= 79) return '#52c41a';
else if (percentage >= 80 && percentage <= 89) return '#13c2c2';
else if (percentage >= 90 && percentage <= 99) return '#1890ff';
else if (percentage === 100) return '#722ed1';
else return '#e0e0e0';
}

function showResults() {
const grade = document.getElementById('grade-select').value;
const term = document.getElementById('term-select').value;
const resultTitle = `${gradeNames[grade]} - ${termNames[term]} - KẾT QUẢ`;
document.getElementById('result-title').textContent = resultTitle;
const { correctCount, incorrectCount, unansweredCount, percentage } = calculateScore();
document.getElementById('result-student-name').textContent = studentName;
const scoreChart = document.getElementById('score-chart');
const scorePercentageText = document.getElementById('score-percentage');
const scoreDetailText = document.getElementById('score-detail');
const color = getScoreColor(percentage);
scoreChart.style.background = `conic-gradient(${color} ${percentage}%, #eee ${percentage}% 100%)`;
scorePercentageText.textContent = `${percentage}%`;
scoreDetailText.textContent = `${correctCount}/${currentQuestions.length}`;
const dateStr = `${testSubmitTime.getDate().toString().padStart(2, '0')}/${(testSubmitTime.getMonth() + 1).toString().padStart(2, '0')}/${testSubmitTime.getFullYear()}`;
document.getElementById('result-date').textContent = dateStr;
const startHMS = formatTimeHMS(testStartTime);
document.getElementById('start-time-hms').textContent = startHMS;
const endHMS = formatTimeHMS(testSubmitTime);
document.getElementById('end-time-hms').textContent = endHMS;
document.getElementById('incorrect-count').textContent = `${incorrectCount}/${currentQuestions.length}`;
document.getElementById('unanswered-count').textContent = `${unansweredCount}/${currentQuestions.length}`;
renderReviewQuestions();
showScreen('result-screen');
}

function calculateScore() {
let correctCount = 0;
let incorrectCount = 0;
let unansweredCount = 0;
currentQuestions.forEach(question => {
const userAnswer = userAnswers[question.id];
if (!userAnswer) {
unansweredCount++;
} else if (userAnswer === question.correctAnswer) {
correctCount++;
} else {
incorrectCount++;
}
});
const percentage = Math.round((correctCount / currentQuestions.length) * 100);
return {
correctCount,
incorrectCount,
unansweredCount,
percentage
};
}

function formatTimeHMS(date) {
const h = date.getHours().toString().padStart(2, '0');
const m = date.getMinutes().toString().padStart(2, '0');
const s = date.getSeconds().toString().padStart(2, '0');
return `${h}:${m}:${s}`;
}

function renderReviewQuestions() {
const container = document.getElementById('review-list');
container.innerHTML = '';
currentQuestions.forEach(question => {
const userAnswer = userAnswers[question.id];
const isCorrect = userAnswer === question.correctAnswer;
const isUnanswered = !userAnswer;
let statusClass = '';
if (isUnanswered) {
statusClass = 'unanswered';
} else if (isCorrect) {
statusClass = 'correct';
} else {
statusClass = 'incorrect';
}
let optionsHTML = '';
question.options.forEach(option => {
let classStyle = '';
let textStyle = '';
if (option.id === question.correctAnswer) {
classStyle = 'review-opt-correct';
textStyle = 'color: #2ecc71; font-weight: bold;';
} else if (option.id === userAnswer && !isCorrect) {
classStyle = 'review-opt-wrong';
textStyle = 'color: #e74c3c; text-decoration: line-through;';
} else {
textStyle = 'color: #000;';
}
optionsHTML += `
<div class="review-option-row ${classStyle}" style="${textStyle}">
<div class="math-container"><strong>${option.id}.</strong> ${option.text}</div>
</div>
`;
});
const reviewItem = document.createElement('div');
reviewItem.className = `review-item ${statusClass}`;
reviewItem.innerHTML = `
<div class="review-question-title">Câu ${question.displayOrder} - ${currentTestCode} - ${question.id}</div>
<div class="question-content" style="font-size: 16px; margin-bottom: 5px;">
<div class="math-container">${question.content}</div>
</div>
<div class="review-options">${optionsHTML}</div>
`;
container.appendChild(reviewItem);
});
if (window.MathJax) {
setTimeout(() => {
MathJax.typesetPromise();
}, 300);
}
}

function retryTest() {
currentQuestions = getRandomQuestions(currentTestCode);
userAnswers = {};
timeLeft = 600;
testStartTime = new Date();
currentQuestionIndex = 0;
isTransitioning = false;
renderCurrentQuestion();
startTimer();
document.addEventListener('visibilitychange', handleVisibilityChange);
showScreen('test-screen');
}

document.addEventListener('DOMContentLoaded', function() {
document.getElementById('grade-select').addEventListener('change', updateTestCode);
document.getElementById('term-select').addEventListener('change', updateTestCode);
document.getElementById('start-btn').addEventListener('click', startTest);
document.getElementById('submit-test-btn').addEventListener('click', submitTest);
document.getElementById('retry-btn').addEventListener('click', retryTest);
document.getElementById('back-btn').addEventListener('click', function() {
showScreen('main-screen');
});
});
